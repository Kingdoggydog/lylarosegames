<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyla Rose Games</title>
<meta name="description" content="A little collection of games to play.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@600;800&display=swap">
<style>
  :root{
    color-scheme: light;
    --sky:#CDEBF5;
    --sky2:#F7DDEB;
    --hedge:#2E6E61;
    --pink:#F2559B;
    --gold:#FFC23D;
    --ink:#23413B;
    --card:#FFFFFF;
    --muted:#557A72;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    background:linear-gradient(170deg,var(--sky) 0%,var(--sky2) 100%) fixed;
    background-color:var(--sky);
    color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif;
    padding-inline:16px;
    padding-block:max(24px, env(safe-area-inset-top)) 40px;
  }
  .wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:12px}
  .rainbow{display:flex;gap:4px}
  .rainbow span{width:28px;height:8px;border-radius:4px}
  h1{
    font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;
    font-size:clamp(44px,10vw,80px);line-height:1;margin:8px 0 0;
    color:var(--pink);text-shadow:3px 3px 0 #fff;text-wrap:balance;
  }
  .tag{margin:0;font-size:clamp(16px,3.5vw,20px);font-weight:800;color:var(--muted)}
  main{display:flex;flex-direction:column;gap:40px}
  .section{display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
  .section-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .badge{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none}
  .section h2.title{font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;font-size:clamp(30px,6vw,40px);margin:0;line-height:1;color:var(--ink)}
  .section .about{margin:2px 0 0;font-size:15px;color:var(--muted)}
  .jump{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .jump a{background:var(--card);color:var(--ink);text-decoration:none;font-weight:800;font-size:15px;padding:8px 14px;border-radius:999px;box-shadow:0 4px 12px #2E6E6118}
  .jump a:hover{background:#FDE2EC}
  .jump a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .game{
    display:flex;flex-direction:column;background:var(--card);border-radius:22px;overflow:hidden;
    text-decoration:none;color:inherit;box-shadow:0 8px 24px #2E6E6122;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .game:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 14px 30px #2E6E6133}
  .game:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
  .art{aspect-ratio:4/3;display:grid;place-items:center;font-size:clamp(72px,18vw,96px);position:relative}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
  .game:hover .art img{transform:scale(1.05)}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .game h3{font-family:"Chewy",cursive;font-weight:400;font-size:28px;margin:0;line-height:1.1}
  .game p{margin:0;font-size:15px;color:var(--muted)}
  .meta{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#EAF7EC;color:var(--hedge)}
  .play{
    margin-top:auto;align-self:flex-start;background:var(--pink);color:#fff;font-weight:800;
    font-size:18px;padding:10px 22px;border-radius:14px;
  }
  .soon{background:transparent;border:3px dashed #2E6E6155;box-shadow:none}
  .soon:hover{transform:none;box-shadow:none}
  .soon .art{filter:grayscale(.3);opacity:.7}
  footer{text-align:center;font-size:13px;color:var(--muted)}
  @media (prefers-reduced-motion: reduce){.game,.art img{transition:none}.game:hover,.game:hover .art img{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="rainbow" aria-hidden="true">
      <span style="background:#FF6B6B"></span><span style="background:#FFA94D"></span><span style="background:#FFD43B"></span><span style="background:#69DB7C"></span><span style="background:#4DABF7"></span><span style="background:#9775FA"></span>
    </div>
    <h1>Lyla Rose Games</h1>
    <p class="tag">Pick a game and press Play!</p>
    <nav class="jump" id="jump" aria-label="Game sections"></nav>
  </header>

  <main id="sections"></main>

  <footer>Made with love. More games on the way.</footer>
</div>

<script>
  // ===== SECTIONS AND GAMES =====
  // Each section is a group of games (Unicorns, Puzzles, Cars...).
  // To add a game: put it in its own folder inside "games", then add it to a section's "games" list.
  // To add a section: copy the example section at the bottom of this list.
  const sections = [
    {
      id: "unicorns",
      title: "Unicorns",
      emoji: "🦄",
      colour: "#FDE2EC",
      about: "Magical games with unicorns, rainbows and sparkles.",
      comingSoon: true,
      games: [
        {
          title: "Sparklehoof's Maze",
          folder: "unicorn-maze",
          emoji: "🦄",
          colour: "#CFEFD8",
          thumb: "thumb.svg",   // picture file inside the game's folder (optional)
          blurb: "Gallop through the hedge maze, grab the stars and find the rainbow gate.",
          tags: ["Maze", "Keyboard or touch"]
        },
        {
          title: "Glitter Sky Unicorn",
          folder: "glitter-sky",
          emoji: "🌈",
          thumb: "thumb.jpg",
          colour: "#FDE2EC",
          blurb: "Fly across the sky catching glitter, eat cotton candy sandwiches and giggle at the tooting clouds.",
          tags: ["Flying", "Touch or keyboard"]
        },
        {
          title: "Unicorn Penalty Shoot-out",
          folder: "unicorn-soccer",
          emoji: "⚽",
          thumb: "thumb.jpg",
          colour: "#D6F0C8",
          blurb: "Aim, kick and score past Lenny the Lemur. How many goals can you get in a row?",
          tags: ["Soccer", "Tap or Space"]
        },
        // { title: "Next unicorn game", folder: "next-game", emoji: "🌈", colour: "#FDE2EC", thumb: "thumb.jpg", blurb: "What it's about.", tags: ["Puzzle"] },  // "thumb" is optional: a picture in the game's folder, leave it out to show the emoji
      ]
    },
    // {
    //   id: "space", title: "Space", emoji: "🚀", colour: "#DDE3FF",
    //   about: "Blast off to the stars.", comingSoon: false,
    //   games: [ { title: "Rocket Run", folder: "rocket-run", emoji: "🚀", colour: "#DDE3FF", blurb: "Dodge the asteroids.", tags: ["Action"] } ]
    // },
  ];

  const main = document.getElementById('sections');
  const jump = document.getElementById('jump');

  function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  function gameCard(g){
    const a = el('a','game');
    a.href = 'games/' + g.folder + '/';
    const art = el('div','art'); art.style.background = g.colour; art.setAttribute('aria-hidden','true');
    if(g.thumb){
      const img = el('img'); img.src = 'games/' + g.folder + '/' + g.thumb; img.alt = ''; img.loading = 'lazy';
      art.append(img);
    } else {
      art.textContent = g.emoji;
    }
    const body = el('div','body');
    body.append(el('h3',null,g.title), el('p',null,g.blurb));
    const meta = el('div','meta'); (g.tags||[]).forEach(t=>meta.append(el('span','chip',t)));
    body.append(meta, el('span','play','Play ▶'));
    a.append(art, body);
    return a;
  }

  function soonCard(){
    const d = el('div','game soon');
    const art = el('div','art','✨'); art.setAttribute('aria-hidden','true');
    const body = el('div','body');
    body.append(el('h3',null,'Coming soon'), el('p',null,'A new game is on its way.'));
    d.append(art, body);
    return d;
  }

  sections.forEach(sec => {
    const s = el('section','section'); s.id = sec.id;
    const head = el('div','section-head');
    const badge = el('div','badge',sec.emoji); badge.style.background = sec.colour; badge.setAttribute('aria-hidden','true');
    const txt = el('div');
    txt.append(el('h2','title',sec.title), el('p','about',sec.about));
    head.append(badge, txt);
    const grid = el('div','grid');
    sec.games.forEach(g => grid.append(gameCard(g)));
    if(sec.comingSoon) grid.append(soonCard());
    s.append(head, grid);
    main.append(s);

    const link = el('a',null, sec.emoji + ' ' + sec.title); link.href = '#' + sec.id;
    jump.append(link);
  });
</script>
</body>
</html>
