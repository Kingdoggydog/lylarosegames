<style>
  :root{
    color-scheme: light;
    --bg1:#D6EEFF;
    --bg2:#FFF1C9;
    --purple:#7B4FD6;
    --purple-d:#5A2FA0;
    --pink:#FF4F9A;
    --gold:#FFC23D;
    --ink:#2F2350;
    --card:#FFFFFFD9;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);
    background-color:var(--bg1);
    color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif;
    /* fill the screen exactly, keeping clear of notches and rounded corners */
    height:100vh;height:100dvh;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    box-sizing:border-box;
    overflow:hidden;
  }
  .wrap{max-width:1200px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  /* the bar along the top: back link, title, what you found and the buttons */
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
  .back{order:1}
  .snd{order:2;margin-left:auto;display:flex;gap:6px}
  h1{order:3;flex-basis:100%;font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;font-size:clamp(24px,5.5vw,38px);margin:0;line-height:1;color:var(--purple);text-shadow:2px 2px 0 #fff;text-wrap:balance}
  .stats{order:4;display:flex;gap:6px;flex-wrap:wrap}
  .pill{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:22px}
  .pill svg{width:30px;height:15px;display:block}
  .pill img{width:24px;height:24px;display:block}
  .pill .off{opacity:.28}
  .pill.bump{animation:bump .5s ease-out}
  @keyframes bump{40%{transform:scale(1.25)}}
  .jobname{display:inline}
  @media (min-width:1100px){
    h1{order:2;flex:1 1 auto;min-width:0;font-size:clamp(24px,2.6vw,38px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stats{order:3}
    .snd{order:4;margin-left:0}
  }
  /* short screens: everything on one row, no title - the game gets the space */
  @media (max-height:520px){
    h1{display:none}
    .stats{order:2;margin-right:auto}
    .snd{margin-left:0}
    .pill{font-size:13px;padding:5px 9px}
  }
  /* the building site fills whatever space is left over */
  .stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
  .board{position:relative;width:100cqw;height:100cqh;border-radius:18px;overflow:hidden;background:#9ED8FF;box-shadow:0 10px 30px #5A2FA033;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* the big pointing hand that shows what to do next */
  .hand{position:absolute;z-index:3;left:0;top:0;width:58px;height:76px;pointer-events:none;transform-origin:29px 2px;filter:drop-shadow(0 3px 3px #2F235040)}
  .hand svg{width:100%;height:100%;display:block}

  .overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:#2F2350A6;padding:12px;cursor:default}
  .overlay.soft{background:#2F235033;align-items:flex-end}
  .panel{background:#fff;border-radius:18px;padding:14px 16px;text-align:center;max-width:420px;width:100%;max-height:100%;box-sizing:border-box;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px}
  .panel h2{font-family:"Chewy",cursive;font-weight:400;font-size:30px;margin:0;color:var(--purple);line-height:1.05}
  .panel p{margin:0;font-size:15px}
  .panel p.small{font-size:13px;font-weight:800;color:#6B5A8E}
  .panel .key{font-size:14px;display:grid;grid-template-columns:auto auto;justify-content:center;gap:2px 10px;text-align:left}
  .panel .finds{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:40px}
  .panel .finds img{width:44px;height:44px}
  .panel .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  button{font:inherit;font-weight:800;cursor:pointer;border:none;border-radius:12px;padding:12px 18px;background:var(--purple);color:#fff;font-size:17px;min-height:48px;min-width:48px}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  button.ghost{background:var(--card);color:var(--ink);padding:8px 12px;font-size:16px}
  .panel button.ghost{background:#F1EBFF}
  #ovBtn{background:var(--pink);box-shadow:0 5px 0 #C9306F;font-size:20px}
  #ovBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #C9306F}
  /* the job picker */
  .jobs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .jobs button{position:relative;background:#FFF4D6;color:var(--ink);padding:4px 2px;font-size:12px;line-height:1.1;border-radius:12px;box-shadow:0 3px 0 #E8C77A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
  .jobs button .ji{font-size:24px;line-height:1}
  .jobs button.now{background:#FFE08A}
  .jobs button:disabled{opacity:.5;cursor:default;box-shadow:none;background:#EEE9F5}
  .jobs button .tick{position:absolute;right:2px;top:1px;font-size:13px}
  @media (max-width:420px){ .jobs{grid-template-columns:repeat(3,1fr)} }
  /* the treasure shelf */
  .shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;border-radius:14px;background:#F6E3C3;box-shadow:inset 0 -6px 0 #D9B98A}
  .shelf div{background:#FFF8EC;border-radius:12px;padding:4px 2px 6px;font-size:12px;font-weight:800;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px}
  .shelf img{width:52px;height:52px;display:block}
  .shelf .count{font-size:15px;color:var(--purple)}
  .shelf div.none{color:#9C8FB5}
  .shelf div.none img{opacity:.22;filter:grayscale(1) brightness(.4)}
  .back{font-weight:800;color:var(--purple-d);text-decoration:none;background:var(--card);padding:0 14px;border-radius:999px;font-size:15px;min-height:48px;display:inline-flex;align-items:center;box-sizing:border-box;white-space:nowrap}
  .back:hover{text-decoration:underline}
  /* short screens: a more compact panel so the big button always fits */
  @media (max-height:520px){
    .panel{padding:10px 14px;gap:6px;max-width:560px}
    .panel h2{font-size:25px}
    .panel p{font-size:14px}
    .panel .key{display:none}
    .jobs button{min-height:44px}
    .jobs button .ji{font-size:20px}
    .shelf{grid-template-columns:repeat(9,1fr);gap:4px;padding:6px}
    .shelf img{width:40px;height:40px}
    .shelf .nm{display:none}
  }
  /* PHONES ONLY: the building site fills the whole screen; buttons and the finds float over it */
  @media (max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) {
    body{padding:0;background:#9ED8FF}
    .wrap{display:block;max-width:none;height:100%}
    h1{display:none}
    .stage{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);display:block}
    .board{width:100%;height:100%;border-radius:0;box-shadow:none}
    /* back, jobs, music and sound: small round buttons in the top-left corner */
    .bar{display:block}
    .back,#jobsBtn,#music,#sound{position:fixed;z-index:5;top:calc(4px + env(safe-area-inset-top,0px));width:40px;height:40px;min-width:40px;min-height:40px;padding:0;border-radius:50%;justify-content:center;align-items:center;display:inline-flex;background:#FFFFFFB3;box-shadow:0 2px 6px #2F235026;font-size:0;line-height:1}
    .back{left:calc(4px + env(safe-area-inset-left,0px))}
    .back::before{content:"←";content:"←" / "";font-size:22px;font-weight:800}
    #jobsBtn{left:calc(48px + env(safe-area-inset-left,0px));font-size:19px}
    #music{left:calc(92px + env(safe-area-inset-left,0px))}
    #sound{left:calc(136px + env(safe-area-inset-left,0px));font-size:20px}
    #music::before{content:"🎵";content:"🎵" / "";font-size:20px}
    #music[aria-label="Music off"]::before{opacity:.4}
    #music[aria-label="Music off"]::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:3px;border-radius:2px;background:#C92A2A;transform:rotate(-40deg)}
    /* the job and what you found: little see-through bubbles next to the buttons */
    .stats{position:fixed;z-index:4;top:calc(8px + env(safe-area-inset-top,0px));left:calc(182px + env(safe-area-inset-left,0px));right:4px;pointer-events:none;flex-wrap:nowrap}
    .pill{font-size:13px;padding:4px 8px;background:#FFFFFFA6;line-height:1.3;gap:3px}
    .pill svg{width:24px;height:12px}
    .pill img{width:20px;height:20px}
    .jobname{display:none}
    .wrap:has(#overlay:not([hidden])) .stats{display:none}
    .overlay{padding:50px 8px 8px}
    @media (orientation: landscape) { .overlay{padding:48px 8px 6px} }
  }
</style>

<script>
(() => {
  // ===== SETUP =====
  const $ = id => document.getElementById(id);
  const cvs = $('c'), ctx = cvs.getContext('2d');
  const board = $('board'), overlay = $('overlay'), panel = $('panel'), handEl = $('hand');
  const soundBtn = $('sound'), musicBtn = $('music'), jobsBtn = $('jobsBtn');
  const jobPill = $('jobPill'), jobIconEl = $('jobIcon'), jobNameEl = $('jobName'), findsPill = $('findsPill');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PHONE = matchMedia('(max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape)');
  const FONT = '"Chewy","Comic Sans MS",cursive';
  const TAU = Math.PI*2;
  const O = '#2F2350';                      // outline colour
  const KEY = 'lrg-chompers-digger-';

  const rand = (a, b) => a + Math.random()*(b - a);
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a)*u;
  const ease = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
  const easeIO = u => { u = clamp(u, 0, 1); return u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2; };
  const easeBack = u => { u = clamp(u, 0, 1); const c = 1.9; return 1 + (c + 1)*Math.pow(u - 1, 3) + c*Math.pow(u - 1, 2); };
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
  function shade(hex, f){
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
    if(f < 0){ r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r)*f; g += (255 - g)*f; b += (255 - b)*f; }
    return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
  }
  function rr(g, x, y, w, h, r){
    r = Math.max(0, Math.min(r, w/2, h/2));
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function ell(g, x, y, rx, ry, rot){ g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
  function circ(g, x, y, r){ g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, TAU); }
  function rrect(g, x, y, w, h, r){ rr(g, x, y, w, h, r); }
  function line(g, x1, y1, x2, y2){ g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  function poly(g, pts){ g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
  function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  // ===== THE JOBS =====
  // hole: the shape Chomper digs (world units: x across, y down from the ground; the tunnel goes UP into a hill)
  // pieces: what gets dropped in, one tap each ('FILL' = water, bark, sand or concrete poured into the hole)
  const JOBS = [
    {id: 'pond',   name: 'Duck Pond',          icon: '🦆', hole: {t: 'bowl', hw: 136, d: 88},  fill: {kind: 'water', src: 'pipe', top: 12},   pieces: ['pipe', 'rocks', 'reeds', 'FILL', 'lily']},
    {id: 'tunnel', name: 'Train Tunnel',       icon: '🚂', hole: {t: 'tunnel', hw: 205, d: 112}, hill: true,                                    pieces: ['track', 'portalL', 'portalR', 'hilltree']},
    {id: 'play',   name: "Lenny's Playground", icon: '🐒', hole: {t: 'box', hw: 150, d: 50},   fill: {kind: 'bark', src: 'bucket', top: 0},     pieces: ['FILL', 'ladder', 'slide', 'swingframe', 'swings']},
    {id: 'sand',   name: 'Unicorn Sandpit',    icon: '🦄', hole: {t: 'box', hw: 132, d: 62},   fill: {kind: 'sand', src: 'bucket', top: -4},    pieces: ['border', 'FILL', 'umbrella', 'toys']},
    {id: 'garage', name: 'Car Garage',         icon: '🚗', hole: {t: 'box', hw: 150, d: 44},   fill: {kind: 'concrete', src: 'bucket', top: 0}, pieces: ['FILL', 'wallL', 'wallR', 'roof', 'sign']}
  ];
  // where each piece ends up (bottom middle) and how big it is
  const PIECES = {
    pipe:      {x: -150, y: 0,   w: 70,  h: 96},
    rocks:     {x: 152,  y: 2,   w: 84,  h: 46},
    reeds:     {x: 108,  y: 30,  w: 50,  h: 118},
    lily:      {x: -10,  y: 14,  w: 150, h: 26, float: true},
    track:     {x: 0,    y: 2,   w: 420, h: 18},
    portalL:   {x: -192, y: 0,   w: 64,  h: 136},
    portalR:   {x: 192,  y: 0,   w: 64,  h: 136},
    hilltree:  {x: -46,  y: -194, w: 70,  h: 96},
    ladder:    {x: -104, y: 0,   w: 52,  h: 150},
    slide:     {x: -34,  y: 0,   w: 150, h: 146},
    swingframe:{x: 88,   y: 0,   w: 130, h: 156},
    swings:    {x: 88,   y: -34, w: 96,  h: 118},
    border:    {x: 0,    y: 4,   w: 300, h: 34},
    umbrella:  {x: -92,  y: -4,  w: 110, h: 150},
    toys:      {x: 92,   y: -4,  w: 80,  h: 50},
    wallL:     {x: -140, y: 0,   w: 24,  h: 152},
    wallR:     {x: 140,  y: 0,   w: 24,  h: 152},
    roof:      {x: 0,    y: -150, w: 360, h: 78},
    sign:      {x: 0,    y: -160, w: 96,  h: 44}
  };
  const TREASURES = [
    {id: 'coins', name: 'Gold coins'}, {id: 'teddy', name: 'Lost teddy'}, {id: 'duck', name: 'Rubber duck'},
    {id: 'boot', name: 'Boot with a frog'}, {id: 'car', name: 'Toy car'}, {id: 'gem', name: 'Sparkly gem'},
    {id: 'key', name: 'Old key'}, {id: 'shell', name: 'Seashell'}
  ];

  // ===== THE BUILDING SITE (world units; 0,0 = middle of the dig, on the ground) =====
  const DX = -290;                        // the digger (middle of its tracks)
  const PIV = {x: DX + 72, y: -128};      // where the arm joins the digger
  const L1 = 240, L2 = 250;               // the two parts of the arm
  const TX = 258;                         // where Tipper parks
  const TRAY_X = TX - 50;                 // the middle of Tipper's tray
  const REST = {x: 40, y: -190};         // where the bucket waits
  const VIEW_L = -414, VIEW_R = 388;      // everything important fits between these
  const CAB = {x: DX - 88, y: -120};      // where Chomper sits

  // ===== THE PATH THAT ROLLA ROLLS FLAT =====
  const PATH_L = 142;
  function drawPath(g){
    if(step === 'dig' || step === 'intro'){ drawLumps(g); return; }
    const R2 = farRight() + 30;
    // rolled (smooth) part
    const s0 = Math.max(PATH_L, smoothFrom);
    if(s0 < R2){
      g.fillStyle = '#E3C59A'; g.fillRect(s0, -4, R2 - s0, 16);
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(s0, -3, R2 - s0, 4);
      if(job.id === 'tunnel' && step !== 'dig'){ g.save(); g.beginPath(); g.rect(s0, -30, R2 - s0, 40); g.clip(); g.translate(422, 2); drawPiece(g, 'track', PIECES.track); g.translate(422, 0); drawPiece(g, 'track', PIECES.track); g.restore(); }
    }
    // bumpy part
    if(s0 > PATH_L){ g.fillStyle = '#A8703F'; g.fillRect(PATH_L, -4, s0 - PATH_L, 16); }
    drawLumps(g);
  }
  function drawLumps(g){
    lumps.forEach(l => {
      const h = l.h*(1 - ease(l.flat))*easeBack(l.grow == null ? 1 : l.grow);
      if(h < 1) return;
      g.fillStyle = '#9A6536'; g.beginPath(); g.ellipse(l.x, -2, l.w/2, h, 0, Math.PI, TAU); g.closePath(); g.fill(); g.lineWidth = 3; g.strokeStyle = O; g.stroke();

    });
  }

  // ===== THE ANIMAL FRIENDS (from Blossom's Easter Eggs) =====

  };
  function fEyes(f, y, gap){

  // ===== THE ARM'S MOVES =====

  function doBite(x, y){

  // ===== LAYOUT (works out where everything goes for this screen shape) =====
  function layout(){
    const w = CW, h = CH;
    phone = PHONE.matches;
    tall = w/h < 1.05;
    topPad = phone ? (tall ? 52 : 8) : 8;
    const above = 384, below = hole.t === 'tunnel' ? 60 : Math.max(96, hole.d + 26);
    const L = VIEW_L, R = VIEW_R;
    camOn = tall && w/(R - L) < (h - topPad - 6)/(above + below);
    k = Math.min(camOn ? w/560 : w/(R - L), (h - topPad - 6)/(above + below), 1.7);
    const spare = h - topPad - (above + below)*k;
    gy = topPad + above*k + spare*(tall ? 0.55 : 0.62);
    if(camOn){
      worldL = L - 30; worldR = R + 220;
      bgW = (worldR - worldL)*k; cxR = -worldL*k;
      cx = camTarget();
    } else {
      cx = (w - (R - L)*k)/2 - L*k;
      cxR = cx; bgW = w; worldL = viewLeft(); worldR = viewRight();
    }
    drawWorld(bgA, false); drawWorld(bgB, true);
    rebuildReveal();
    updateHud(false);
  }

  // ===== THE CAMERA (upright screens only) =====
  function camShot(){
    if(step === 'intro' || ch.jump) return [-392, 160];
    if(step === 'dig'){
      const busy = ['honk', 'go', 'tip', 'lower', 'leave', 'back'].includes(tip.st);
      const dx = tip.st === 'leave' ? 180 : clamp(tip.x - TX, 0, 180);
      if(arm.load || arm.wait || busy) return [-172 + dx, 388 + dx];
      return [-392, 160];
    }
    if(step === 'build'){ const P = PIECES[job.pieces[pieceIdx]]; return [-392, P ? clamp(P.x + P.w/2 + 10, 160, 200) : 160]; }
    if(step === 'roll') return rol.st === 'back' || rol.st === 'park' ? [-392, 170] : [0, 388];
    return [-392, 170];
  }
  function camTarget(){
    const [a, b] = camShot(), mid = (a + b)/2;
    let t = CW/2 - mid*k;
    return clamp(t, CW - worldR*k, -worldL*k);
  }

  // ===== THE POINTING HAND =====
  let handOn = false;
  function placeHand(x, y, bob){
    if(!handOn){ handEl.hidden = false; handOn = true; }

  }
  function hideHand(){ if(handOn){ handEl.hidden = true; handOn = false; } }
  function updateHand(){
    if(!overlay.hidden || !started || ch.jump || aim.down){ hideHand(); return; }
    const bob = reduced ? 0 : Math.abs(Math.sin(clock*5))*12;
    const at = (x, y) => placeHand(sx(x), sy(y), bob);
    if(step === 'dig' && !digFinished){
      if(!armIdle() || pops.length) return hideHand();
      if(arm.load && tip.st === 'parked' && (stepT > 1)) return at(TRAY_X, -140);
      if(!arm.load && (scoops === 0 && stepT > 0.6 || idleT > 5)){ const c = nearestDirt(0, hole.t === 'tunnel' ? -60 : 0); if(c) return at(c.x, c.y); }
    } else if(step === 'build' && armIdle() && !falling && !filling){
      const id = job.pieces[pieceIdx];
      if(id && (pieceIdx === 0 && stepT > 1 || idleT > 3)){
        if(id === 'FILL') return at(0, hole.d*0.4);
        const P = PIECES[id]; return at(P.x, P.y - P.h*0.5);

  // ===== UPDATE =====
  function update(dt){
    clock += dt; stepT += dt; idleT += dt;
    if(camOn){ const t = camTarget(); cx += (t - cx)*Math.min(1, dt*2.6); if(Math.abs(t - cx) < 0.3) cx = t; }
    // keyboard: arrow keys move where to dig
    const kx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0), ky = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
    if(kx || ky){
      if(!aim.kb){ aim.kb = true; aim.x = 0; aim.y = hole.t === 'tunnel' ? -50 : 20; }
      aim.x = clamp(aim.x + kx*260*dt, -200, 300); aim.y = clamp(aim.y + ky*200*dt, -200, 110);
    }
    // the arm
    if(arm.busy){
      arm.t += dt;
      const u = easeIO(arm.t/arm.dur);
      arm.x = lerp(arm.fx, arm.tx, u); arm.y = lerp(arm.fy, arm.ty, u); arm.a = lerp(arm.fa, arm.ta, u);
      arm.lever = Math.min(1, arm.lever + dt*5);
      if(arm.t >= arm.dur){ arm.busy = false; const f = arm.then; arm.then = null; if(f) f(); }
    } else {
      arm.lever = Math.max(0, arm.lever - dt*3);
      // follow the finger while it is held down (dig step)
      if(aim.down && step === 'dig' && !arm.wait && !digFinished && !ch.jump){
        const p = toWorld(aim.x, aim.y), t0 = teethOffset(arm.a);
        const tx = clamp(p.x - t0.x, -200, 300), ty = clamp(p.y - t0.y - 30, -300, 40);
        arm.x += (tx - arm.x)*Math.min(1, dt*5); arm.y += (ty - arm.y)*Math.min(1, dt*5);
        arm.lever = Math.max(arm.lever, 0.4);
      }
    }
    if(arm.wait && tip.st === 'parked' && !arm.busy && arm.waitFn){ const f = arm.waitFn; arm.waitFn = null; f(); }
    arm.jig = Math.max(0, arm.jig - dt*2);
    if(!arm.busy && !arm.wait && pending && step === 'dig' && !ch.jump){ const p = pending; pending = null; digAt(p.x, p.y); }
    engineSet(started && overlay.hidden ? arm.lever : 0);
    if(Math.random() < dt*(1 + arm.lever*6) && started) addPuff(DX + 65, -200, 'rgba(120,120,130,0.55)', rand(-10, 10), rand(-60, -30), rand(6, 10));

    // Tipper
    tip.happyT = Math.max(0, tip.happyT - dt);
    tip.heap += (tip.loads - tip.heap)*Math.min(1, dt*6);
    tip.bounce *= Math.pow(0.02, dt); if(Math.abs(tip.bounce) < 0.2) tip.bounce = 0;
    tip.t += dt;
    const offX = farRight() + 150;
    // Tipper's trip: honk, drive a little way right, tip the dirt onto a pile, then back up (or head off at the end)
    if(tip.st === 'honk'){
      tip.bounce = -Math.abs(Math.sin(tip.t*14))*6; tip.happyT = 0.5;
      if(tip.t > 0.8){
        if(tip.loads > 0){ tip.st = 'go'; tip.t = 0; tip.fromX = tip.x; tip.dumpX = DUMPS[tip.dumps % DUMPS.length]; tip.toX = tip.dumpX + 140; sfx.vroom(); }
        else startLeave();
      }
    } else if(tip.st === 'go'){
      const u = easeIO(clamp(tip.t/1.1, 0, 1)); const ox = tip.x;
      tip.x = lerp(tip.fromX, tip.toX, u); tip.wheel += (tip.x - ox)/26;
      if(Math.random() < dt*10) addPuff(tip.x - 130, -20, '#E8D6BF');
      if(u >= 1){ tip.st = 'tip'; tip.t = 0; tip.bounce = 3; sfx.tipRumble(); }
    } else if(tip.st === 'tip'){
      tip.trayA = ease(tip.t/0.5)*0.72;
      if(tip.t > 0.35 && tip.t < 1.1){
        tip.heap = Math.max(0, tip.heap - dt*4);
        if(Math.random() < dt*30){ const c = Math.cos(tip.trayA), s = Math.sin(tip.trayA); addClump(tip.x - 124 - s*40 + rand(-6, 6), -50 - c*20, rand(-60, -10), rand(-40, 40)); }
      }
      if(tip.t > 0.55 && !tip.piled){ tip.piled = true; growPile(tip.dumpX, tip.loads); tip.loads = 0; }
      if(tip.t > 1.25){ tip.st = 'lower'; tip.t = 0; tip.piled = false; tip.dumps++; }
    } else if(tip.st === 'lower'){
      tip.trayA = 0.72*(1 - ease(tip.t/0.45));
      if(tip.t > 0.5){ tip.trayA = 0; tip.happyT = 1.2; if(tip.final) startLeave(); else { tip.st = 'back'; tip.t = 0; tip.beepAt = 0; tip.fromX = tip.x; } }
    } else if(tip.st === 'leave'){
      const u = clamp(tip.t/1.3, 0, 1);
      const ox = tip.x; tip.x = tip.fromX + (offX - tip.fromX)*u*u; tip.wheel += (tip.x - ox)/26;
      if(Math.random() < dt*14) addPuff(tip.x - 130, -20, '#E8D6BF');

    } else if(tip.st === 'back'){
      // reversing back to the digger - beep, beep, beep

    lumps.forEach(l => { if(l.grow != null && l.grow < 1) l.grow = Math.min(1, l.grow + dt*3); });

      filling.t += dt;

        let x0, y0;
        if(filling.bucket){ const p = armPose(); x0 = p.wx + 12; y0 = p.wy + 40; } else { x0 = filling.x; y0 = filling.y; }
        parts.push({kind: 'stream', x: x0 + rand(-6, 6), y: y0, vx: rand(-20, 20) + (filling.bucket ? 0 : 40), vy: rand(20, 80), life: 0, max: 0.7, r: rand(4, 7), col, world: true, stopY: lerp(hole.d, job.fill.top, fillLevel)});
      }

        pieceIdx++; sfx.ding();
        popWord({water: 'Splish splash!', bark: 'Soft and bouncy!', sand: 'Lovely sand!', concrete: 'Nice and flat!'}[job.fill.kind], sx(0), sy(-60), '#1C7ED6');
        afterPiece();
      }
    }

    // Rolla
    rol.happyT = Math.max(0, rol.happyT - dt);
    rol.sq = Math.max(0, rol.sq - dt*3);
    rol.t += dt;
    if(rol.st === 'enter'){
      const u = ease(clamp(rol.t/1.6, 0, 1)); const ox = rol.x;
      rol.x = lerp(rol.fromX, rol.toX, u); rol.wheel += (rol.x - ox)/30; smoothFrom = Math.min(smoothFrom, rol.x - 62);
      if(Math.random() < dt*8) addPuff(rol.x + 16, -140, 'rgba(255,255,255,0.9)');

    } else if(rol.st === 'roll'){
      const u = easeIO(clamp(rol.t/1.1, 0, 1)); const ox = rol.x;
      rol.x = lerp(rol.fromX, rol.toX, u); rol.wheel += (rol.x - ox)/30;
      const drum = rol.x - 62;
      smoothFrom = Math.min(smoothFrom, drum);
      if(Math.random() < dt*8) addPuff(rol.x + 16, -140, 'rgba(255,255,255,0.9)');
      lumps.forEach(l => { if(!l.hit && drum < l.x + 10){ l.hit = true; rol.sq = 1; sfx.squish(); popWord(pick(['SQUISH!', 'BOING!', 'SQUASH!']), sx(l.x), sy(-90), '#2F9E44'); for(let i = 0; i < 4; i++) addPuff(l.x + rand(-20, 20), -6, '#E8D6BF'); } if(l.hit) l.flat = Math.min(1, l.flat + dt*4); });
      if(u >= 1){
        if(rol.seg >= 3){ rol.st = 'back'; rol.t = 0; rol.fromX = rol.x; rol.toX = camOn ? 330 : Math.min(viewRight() - 110, 330); sfx.ding(); popWord('All smooth!', sx(220), sy(-170), '#2F9E44'); }
        else { rol.st = 'wait'; rol.t = 0; }
      }
    } else if(rol.st === 'back'){
      const u = ease(clamp(rol.t/1.4, 0, 1)); const ox = rol.x;
      rol.x = lerp(rol.fromX, rol.toX, u); rol.wheel += (rol.x - ox)/30;
      if(rol.t < 1.2 && (rol.t % 0.36) < dt) sfx.beep();

    if(ch.jump){
      const j = ch.jump; j.t += dt;
      if(j.t > 0.55 && !j.landed){ j.landed = true; sfx.thud(); for(let i = 0; i < 6; i++) addPuff(-165 + rand(-30, 30), -4, '#E8D6BF'); }
      if(j.t > 0.8 && !j.bone){ j.bone = true; sfx.sparkle(); burst(-150, -60, 12); }
      if(j.t > 1.0 && !j.aww){ j.aww = true; sfx.aww(); sfx.giggle(); }
      if(j.t > 0.9 && j.t < 3.3 && Math.random() < dt*6) hearts.push({x: -150 + rand(-30, 30), y: -110, t: 0, s: rand(0.7, 1.2)});
      if(j.t > 3.35 && !j.hop){ j.hop = true; sfx.boing(); }

    // treasures popping out

      else if(p.kind === 'spark'){ p.x += p.vx*dt*0.3; p.y += p.vy*dt*0.3; }
      else if(p.kind === 'stream'){ p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; if(p.y > p.stopY) p.life = p.max; }
      else { p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; if(p.rot != null) p.rot += dt*5; if(p.tray && p.y > -120) p.life = p.max; }
    });
    parts = parts.filter(p => p.life < p.max);
    if(parts.length > 500) parts.splice(0, parts.length - 500);
    words.forEach(w => w.t += dt);
    words = words.filter(w => w.t < 1.2);
    updateHand();
  }

  function updateParty(dt){
    partyT += dt;
    const T = partyT;
    if(T > 1.3 && !extras.c2){ extras.c2 = true; confetti(-100, -200, 30); confetti(150, -200, 30); sfx.cheer(); }
    // friends walk in and hop about
    friends.forEach((f, i) => {
      f.giggle = Math.max(0, f.giggle - dt); f.joy = Math.max(0, f.joy - dt);
      if(f.st === 'walk'){
        if(T < f.delay) return;
        f.walk += dt;
        const sp = 170;
        f.x = Math.max(f.tx, f.x - sp*dt);
        f.hop = Math.abs(Math.sin(f.walk*9))*10;
        if(f.x <= f.tx + 0.5){ f.st = 'here'; f.happy = true; f.joy = 0.8; f.hop = 0; if(f.kind === 'duck') sfx.quack(); else sfx.giggle(); }
        if(job.id === 'pond' && f.kind === 'duck' && f.x < 200 && !f.inWater){ f.st = 'jump'; f.jt = 0; f.jx0 = f.x; }
      } else if(f.st === 'jump'){

      } else if(f.st === 'swim'){
        f.x = f.swim + Math.sin(T*1.2 + f.ph)*22; f.hop = 0;
        if(Math.random() < dt*0.4) sfx.quack();
      } else {
        f.hop = f.happy ? Math.abs(Math.sin(T*5 + f.ph))*10 : 0;

    });

    if(job.id === 'tunnel'){

        if(!extras.tooted && T > 0.6){ extras.tooted = true; sfx.toot(); popWord('TOOT TOOT!', sx(Math.min(extras.trainX, viewRight() - 80)), sy(-200), '#E03131'); }
      } else if(!extras.trainStop){ extras.trainStop = true; sfx.toot(); popWord('Choo choo!', sx(-40), sy(-200), '#E03131'); extras.riders.forEach(r => r.joy = 1); }
      else if(Math.random() < dt*3) addPuff(extras.trainX - 34, -150, 'rgba(255,255,255,0.9)', rand(-10, 10), rand(-60, -30), rand(8, 12));
    } else if(job.id === 'play'){

  function bez(a, b, c, d, u){ const v = 1 - u; return v*v*v*a + 3*v*v*u*b + 3*v*u*u*c + u*u*u*d; }

  function drawParts(g){
    parts.forEach(p => {
      const u = p.life/p.max, a = 1 - u;
      if(p.kind === 'clump'){ g.globalAlpha = Math.min(1, a*3); g.fillStyle = p.col; ell(g, p.x, p.y, p.r, p.r*0.8, p.rot); g.fill(); }
      else if(p.kind === 'stream'){ g.globalAlpha = 0.9; g.fillStyle = p.col; ell(g, p.x, p.y, p.r, p.r*1.3); g.fill(); }
      else if(p.kind === 'drop'){ g.globalAlpha = a; g.fillStyle = '#74C0FC'; ell(g, p.x, p.y, p.r, p.r*1.3); g.fill(); }
      else if(p.kind === 'spark'){ g.globalAlpha = Math.sin(u*Math.PI); drawTwinkle(g, p.x, p.y, p.r, p.col); }
      else if(p.kind === 'conf'){ g.globalAlpha = Math.min(1, a*3); g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.col; g.fillRect(-p.r, -p.r*0.5, p.r*2, p.r); g.restore(); }
      else if(p.kind === 'puff'){ g.globalAlpha = a*0.8; g.fillStyle = p.col; ell(g, p.x, p.y, p.r, p.r); g.fill(); }
    });
    g.globalAlpha = 1;
  }
  function drawTwinkle(g, x, y, r, col){
    g.fillStyle = col;
    g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill();
    if(col === '#fff'){ g.strokeStyle = 'rgba(255,212,59,0.8)'; g.lineWidth = 1.5; g.stroke(); }
  }
  function drawHeart(g, x, y, r){
    g.fillStyle = '#FF4F9A'; g.beginPath(); g.moveTo(x, y + r*0.9);
    g.bezierCurveTo(x - r*1.4, y - r*0.1, x - r*0.6, y - r*1.2, x, y - r*0.4);
    g.bezierCurveTo(x + r*0.6, y - r*1.2, x + r*1.4, y - r*0.1, x, y + r*0.9); g.fill();
  }
  function drawWords(){
    S(ctx);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    words.forEach(w => {
      const u = w.t/1.2, sc = w.t < 0.2 ? 0.5 + w.t/0.2*0.6 : 1.1 - (w.t - 0.2)*0.1;
      ctx.globalAlpha = u > 0.75 ? (1 - u)/0.25 : 1;
      const sz = Math.max(20, 38*k)*sc;
      ctx.font = Math.round(sz) + 'px ' + FONT;
      const tw = ctx.measureText(w.text).width;
      const x = clamp(w.x, tw/2 + 8, CW - tw/2 - 8), y = clamp(w.y - u*40*k, sz, CH - sz);
      ctx.lineWidth = sz*0.2; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(w.text, x, y); ctx.fillStyle = w.col; ctx.fillText(w.text, x, y);
    });
    ctx.globalAlpha = 1;
  }
  function drawSpeech(text, wx, wy){
    S(ctx);
    const sz = Math.max(15, 24*k);
    ctx.font = Math.round(sz) + 'px ' + FONT;
    const tw = ctx.measureText(text).width, w = tw + sz*1.2, h = sz*1.8;
    let x = sx(wx), y = sy(wy);
    const bx = clamp(x - w*0.25, 6, CW - w - 6), by = Math.max(topPad + 4, y - h - sz*0.6);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = O; ctx.lineWidth = 3;
    rr(ctx, bx, by, w, h, h/2); ctx.fill(); ctx.stroke();
    const tx = clamp(x, bx + h/2, bx + w - h/2);
    ctx.beginPath(); ctx.moveTo(tx - 10, by + h - 2); ctx.lineTo(tx - 2, by + h + sz*0.6); ctx.lineTo(tx + 8, by + h - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillRect(tx - 9, by + h - 5, 16, 5);
    ctx.fillStyle = '#7B4FD6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + w/2, by + h/2 + 1);
  }
  function draw(){
    S(ctx);
    const ox = cx - cxR;
    ctx.drawImage(holeDone ? bgB : bgA, ox, 0, bgW, CH);
    if(!holeDone){
      ctx.drawImage(rev, ox, 0, bgW, CH);
      if(holeFade > 0){ ctx.save(); W(ctx); clipHole(ctx); S(ctx); ctx.globalAlpha = holeFade; ctx.drawImage(bgB, ox, 0, bgW, CH); ctx.restore(); ctx.globalAlpha = 1; }
    }
    W(ctx);
    drawPath(ctx);
    // things in the hole
    drawFill(ctx);
    if(extras.trainX != null) drawTrain(ctx, extras.trainX);
    // the back wall of the garage goes behind the cars
    const has = id => placed.some(p => p.id === id);
    if(job.id === 'garage' && has('wallL') && has('wallR')){
      ctx.fillStyle = '#FFE3C7'; ctx.fillRect(-128, -150, 256, 150);
      ctx.fillStyle = '#C5ECFF'; rr(ctx, -40, -120, 80, 44, 6); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = O; ctx.stroke();
      ctx.strokeStyle = O; line(ctx, 0, -120, 0, -76);
    }
    // ghost of the next piece
    if(step === 'build' && !falling && !arm.hold){ const id = job.pieces[pieceIdx]; if(id && id !== 'FILL') drawGhost(ctx, id); }
    // placed pieces
    placed.forEach(p => {
      const P = PIECES[p.id];
      const sq = p.t < 0.3 ? Math.sin(p.t/0.3*Math.PI)*0.12 : 0;
      ctx.save(); ctx.translate(P.x, P.y + (P.float ? Math.sin(clock*2)*1.5 : 0)); ctx.scale(1 + sq, 1 - sq); drawPiece(ctx, p.id, P); ctx.restore();
    });
    if(job.id === 'pond') drawFriends(ctx, 'water');
    if(falling){ ctx.save(); ctx.translate(falling.x, falling.y); drawPiece(ctx, falling.id, falling.P); ctx.restore(); }
    // the sandcastle
    if(extras.castle){ ctx.save(); ctx.translate(52, -4); drawCastle(ctx, easeBack(extras.castle)*0.9); ctx.restore(); }
    // cars driving into the garage
    if(extras.cars) extras.cars.forEach(c => { if(partyT < c.delay) return; ctx.save(); ctx.translate(c.x, -2); ctx.scale(-0.33, 0.33); drawCar(ctx, c.t, c.col, c.spin || 0, c.parked, c.honkT); ctx.restore(); });
    drawTipper(ctx);
    drawRolla(ctx);
    drawFriends(ctx, 'land');
    drawDigger(ctx);
    drawArm(ctx);
    // Chomper out of the cab, hugging the bone
    if(ch.jump){
      const j = ch.jump, from = {x: CAB.x, y: CAB.y}, to = {x: -160, y: 0};
      let x, y, sc;
      if(j.t < 0.55){ const u = j.t/0.55; x = lerp(from.x, to.x, u); y = lerp(from.y, to.y, u) - Math.sin(u*Math.PI)*110; sc = lerp(0.92, 1, u); }
      else if(j.t < 3.35){ x = to.x; y = to.y; sc = 1; }
      else { const u = clamp((j.t - 3.35)/0.6, 0, 1); x = lerp(to.x, from.x, u); y = lerp(to.y, from.y, u) - Math.sin(u*Math.PI)*110; sc = lerp(1, 0.92, u); }
      const hug = j.t > 0.8 && j.t < 3.35;
      const sway = hug ? Math.sin(clock*4)*0.08 : 0;
      ctx.fillStyle = 'rgba(50,25,80,0.2)'; ell(ctx, x, 2, 40, 10); ctx.fill();
      ctx.save(); ctx.translate(x, y); ctx.rotate(sway); ctx.scale(sc, sc);
      drawChomperFig(ctx, {legs: true, hat: true, happy: true, hug, armA: hug ? 0.9 : -0.9, l1: j.t < 0.55 || j.t > 3.35 ? 8 : 0, l2: j.t < 0.55 || j.t > 3.35 ? 4 : 0});
      ctx.restore();
    }
    // hearts
    hearts.forEach(h => { ctx.globalAlpha = Math.min(1, (1.6 - h.t)*2); drawHeart(ctx, h.x, h.y, 10*h.s); });
    ctx.globalAlpha = 1;
    drawParts(ctx);
    // treasures popping out
    pops.forEach(p => {
      const grow = p.t < 0.6 ? 0.6 + p.t/0.6*0.5 : p.t < 1.6 ? 1.1 + Math.sin(p.t*8)*0.04 : lerp(1.1, 0.4, clamp((p.t - 1.6)/0.6, 0, 1));
      const r = Math.max(22/k, 34)*grow;
      if(p.t > 0.5 && p.t < 1.7){ ctx.fillStyle = 'rgba(255,240,170,0.55)'; ell(ctx, p.x, p.y, r*1.4, r*1.4); ctx.fill(); }
      ctx.save(); ctx.translate(p.x, p.y); drawTreasure(ctx, p.id, r); ctx.restore();
    });
    // keyboard: where the digger will dig
    if(aim.kb && overlay.hidden){
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.setLineDash([8, 6]); ell(ctx, aim.x, aim.y, 26, 26); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = O; ctx.lineWidth = 2; ell(ctx, aim.x, aim.y, 30, 30); ctx.stroke();
    }
    drawWords();
    if(ch.jump && ch.jump.t > 0.8 && ch.jump.t < 3.35) drawSpeech("That's my great-great-grandad!", -150, -150);
  }

  // ===== CONTROLS =====
  function boardPos(e){ const r = board.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }
  function onChomper(w){ return !ch.jump && w.x > DX - 124 && w.x < DX - 4 && w.y > -270 && w.y < -118; }
  function onRolla(w){ return rol.st !== 'off' && w.x > rol.x - 115 && w.x < rol.x + 115 && w.y > -200 && w.y < 10; }
  function tapAt(w){
    wake(); startMusic();
    idleT = 0;
    if(onChomper(w) && step !== 'build'){ ch.roarT = 0.9; ch.giggleT = 0.5; sfx.roar(); return; }
    if(step === 'dig'){
      if(ch.jump){ ch.giggleT = 0.4; sfx.giggle(); return; }
      if(onTipper(w.x, w.y) && !arm.load && armIdle()){ tip.st === 'parked' && (tip.bounce = 6, tip.happyT = 0.6); sfx.meep(); return; }
      if(onTipper(w.x, w.y) && arm.load){ if(armIdle()) dumpToTipper(); return; }
      if(digFinished){ sfx.tap(); return; }
      digAt(w.x, w.y);
    } else if(step === 'build'){
      if(onChomper(w)){ ch.roarT = 0.9; sfx.roar(); return; }
      if(armIdle() && !falling && !filling) doPiece(); else sfx.tap();
    } else if(step === 'roll'){
      if(rol.st === 'wait') rollTap(); else sfx.tap();
    } else if(step === 'party'){
      const f = friends.find(f => Math.abs(w.x - f.x) < 50 && w.y > -110 && w.y < 20);
      if(f){ f.joy = 0.8; f.giggle = 0.6; if(f.kind === 'duck') sfx.quack(); else sfx.giggle(); }
      else { confetti(w.x, w.y, 16); sfx.pop(); }
    }
  }
  board.addEventListener('pointerdown', e => {
    if(!overlay.hidden || e.target.closest('button')) return;
    const p = boardPos(e);
    try { board.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
    wake(); startMusic();
    aim.kb = false; aim.x = aim.sx = p.x; aim.y = aim.sy = p.y; aim.down = true; aim.moved = 0;
  });
  board.addEventListener('pointermove', e => {
    if(!aim.down) return;
    const p = boardPos(e);
    aim.moved += Math.hypot(p.x - aim.x, p.y - aim.y);
    aim.x = p.x; aim.y = p.y;
  });
  const up = e => {
    if(!aim.down) return;
    aim.down = false;
    if(e && e.type === 'pointercancel') return;
    if(!overlay.hidden) return;
    tapAt(toWorld(aim.x, aim.y));
  };
  board.addEventListener('pointerup', up);
  board.addEventListener('pointercancel', up);
  board.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if(!overlay.hidden){
      if(e.code === 'Enter' || e.code === 'Space'){
        const a = document.activeElement;
        if(a && a.tagName === 'BUTTON' && overlay.contains(a)) return;
        e.preventDefault(); const b = $('ovBtn'); if(b) b.click();
      }
      return;
    }
    const a = document.activeElement, onBtn = a && a.tagName === 'BUTTON';
    if(e.code.startsWith('Arrow')){ keys.add(e.code); e.preventDefault(); wake(); }
    else if(e.code === 'Space' || e.code === 'Enter'){
      if(onBtn) return;
      e.preventDefault(); if(e.repeat) return;
      wake(); startMusic();
      if(step === 'dig'){
        if(arm.load){ idleT = 0; if(armIdle()) dumpToTipper(); return; }
        if(!aim.kb){ aim.kb = true; aim.x = 0; aim.y = hole.t === 'tunnel' ? -50 : 20; }
        tapAt({x: aim.x, y: aim.y});
      } else tapAt({x: 0, y: -400});
    }
  });
  addEventListener('keyup', e => { keys.delete(e.code); });

  // ===== SIZE AND LOOP =====
  function resize(){
    const r = board.getBoundingClientRect(), dpr = Math.min(2.5, window.devicePixelRatio || 1);
    if(r.width < 2 || r.height < 2) return;
    CW = r.width; CH = r.height;
    cvs.width = Math.round(r.width*dpr); cvs.height = Math.round(r.height*dpr);
    PX = cvs.width/r.width;
    layout();
  }
  addEventListener('resize', resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(board);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); });

  let last = performance.now();
  let oops = 0;
  function loop(t){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, Math.max(0, (t - last)/1000)); last = t;
    try { update(dt); draw(); }
    catch(e){ if(oops++ < 3) console.error(e); }
  }

  setupCells();
  resize();
  updateHud(false);
  showStart();
  requestAnimationFrame(loop);
  /* end of game code */
})();
</script>
