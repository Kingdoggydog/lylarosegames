<script>

  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
  function rr(g, x, y, w, h, r){

  // ----- background music: a bouncy chuff-along tune -----
  const ROOTS = [48, 53, 55, 48, 48, 53, 55, 48];   // C, F, G, C, C, F, G, C
  const MELODY = [
    67,0,72,0,72,74,76,0,   77,0,76,0,74,0,72,0,
    74,0,74,76,77,0,79,0,   76,0,74,0,72,0,0,0,
    79,0,77,76,77,0,74,0,   76,0,74,72,74,0,77,0,

  const hz = m => 440*Math.pow(2, (m - 69)/12);

  function playStep(i, t){
    const bar = Math.floor(i/8), beat = i % 8, root = ROOTS[bar], d = t - actx.currentTime, S = stepLen();
    if(beat === 0 || beat === 4) tone(hz(root - 12 + (beat === 4 ? 7 : 0)), S*1.6, 'triangle', 0.26, null, d, musicBus);
    if(beat === 2 || beat === 6) [0, 4, 7].forEach(n => tone(hz(root + 12 + n), 0.16, 'sine', 0.035, null, d, musicBus));
    const m = MELODY[i];
    if(m){ tone(hz(m), S*1.5, 'triangle', 0.07, null, d, musicBus); tone(hz(m + 12), 0.07, 'sine', 0.025, null, d, musicBus); }

    if(beat === 0 || beat === 4) tone(80, 0.12, 'sine', 0.2, 40, d, musicBus);
  }
  function scheduleMusic(){

  // ===== THE STATIONS AND THE FOUR MAPS =====
  const STATIONS = {
    farm:   {name: 'Farm',          cargo: 'Milk and hay',  word: 'Moo!'},
    toys:   {name: 'Toy Shop',      cargo: 'Toys',          word: 'Yay, toys!'},
    beach:  {name: 'Beach',         cargo: 'Passengers',    word: 'Splash!'},
    zoo:    {name: 'Zoo',           cargo: 'Bananas',       word: 'Bananas!'},
    bakery: {name: 'Bakery',        cargo: 'Flour',         word: 'Yum!'},
    build:  {name: 'Building Site', cargo: 'Bricks',        word: 'Beep beep!'}
  };
  // Each map is a little tree of switches: [up, down] pairs, with a station at the end of every branch.
  // Stations are listed top to bottom (the "lanes"). Deeper stations need two or three switches set right.
  const DXB = 260;                              // how far apart the switches are along the track
  const MAPS = [
    {name: 'Little Loop',    icon: '🐄', tree: ['farm', 'toys'], ex: 0, total: 4},
    {name: 'Farm and Beach', icon: '🏖️', tree: ['farm', ['beach', 'toys']], ex: 0, total: 6},
    {name: 'Busy Town',      icon: '🚗', tree: [['zoo', 'beach'], ['farm', 'toys']], ex: 80, total: 7, crossing: true},
    {name: 'Big Railway',    icon: '🌉', tree: [[['build', 'bakery'], 'zoo'], ['beach', ['farm', 'toys']]], ex: 120, total: 8, crossing: true, river: true, tunnel: true}
  ];
  const leavesOf = t => Array.isArray(t) ? t.flatMap(leavesOf) : [t];
  const depthOf = t => Array.isArray(t) ? 1 + Math.max(...t.map(depthOf)) : 0;
  MAPS.forEach(M => { M.lanes = leavesOf(M.tree); M.L = 680 + depthOf(M.tree)*DXB; });
  const UL = 206, R = 100, LG = 240, TOP = 236, STEP = 6;

  // The track is drawn in "flat" coordinates (u along the lanes, v across them) and then turned to
  // fit the screen: lanes run across on tall screens and up-and-down on wide screens, so the
  // whole train set uses the space best either way.
  let LY = null;                                // the current layout
  let swState = [];                             // which way each switch points (0 = straight on, 1 = turn)
  function makePath(u, v, h){
    const pts = [[u, v]];
    const P = {
      line(len){ const n = Math.max(1, Math.round(len/STEP)); for(let i = 1; i <= n; i++) pts.push([u + Math.cos(h)*len*i/n, v + Math.sin(h)*len*i/n]); u += Math.cos(h)*len; v += Math.sin(h)*len; return P; },
      arc(dir){
        const cx = u + R*Math.cos(h + dir*Math.PI/2), cy = v + R*Math.sin(h + dir*Math.PI/2), a0 = h - dir*Math.PI/2;
        const n = Math.round(R*Math.PI/2/STEP);
        for(let i = 1; i <= n; i++){ const t = i/n*Math.PI/2; pts.push([cx + R*Math.cos(a0 + dir*t), cy + R*Math.sin(a0 + dir*t)]); }
        h += dir*Math.PI/2; u = cx + R*Math.cos(a0 + dir*Math.PI/2); v = cy + R*Math.sin(a0 + dir*Math.PI/2); return P;
      },
      // a smooth S-bend: forwards du while shifting sideways dv (only used heading along +u)
      bend(du, dv){
        const u0 = u, v0 = v, n = Math.max(8, Math.round(Math.hypot(du, dv)*1.15/STEP));
        for(let i = 1; i <= n; i++){ const t = i/n, a = 3*t*t - 2*t*t*t; pts.push([u0 + du*t, v0 + dv*a]); }
        u += du; v += dv; return P;
      },
      pts
    };

  function makeLayout(mi, screenLand){
    const M = MAPS[mi], n = M.lanes.length, L = M.L;
    const UR = UL + L;
    const vl = i => TOP + i*LG;
    const VB = vl(n - 1) + LG + M.ex;
    const Wab = UR + 150, Hab = VB + 236;
    // turn the train set so its long side runs along the screen's long side
    const land = screenLand ? Hab > Wab : Wab > Hab;
    const T = (u, v) => land ? {x: v, y: u} : {x: u, y: v};
    const lay = {mi, n, land, screenLand, WW: land ? Hab : Wab, WH: land ? Wab : Hab, edges: [], nodes: [], switches: [], stations: [], T, UL, UR, VB, vl};
    const node = (id, u, v) => { const p = T(u, v); const nd = {id, x: p.x, y: p.y, outs: []}; lay.nodes[id] = nd; return nd; };
    const edge = (id, path, to, kind, lane) => {
      const pa = path.pts, pts = pa.map(([u, v]) => T(u, v)), cum = [0];
      for(let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
      const e = {id, pa, pts, cum, len: cum[cum.length - 1], to, kind, lane};
      lay.edges[id] = e; return e;
    };
    // the lanes join up again on the right (M nodes), then run down and back along the bottom
    const Mg = i => 'M' + i;
    for(let i = 1; i < n; i++) node(Mg(i), UR, vl(i) + R);
    for(let i = 1; i <= n - 2; i++) edge('colR' + i, makePath(UR, vl(i) + R, Math.PI/2).line(LG), Mg(i + 1), 'col');
    for(let i = 1; i < n; i++) lay.nodes[Mg(i)].outs = i <= n - 2 ? ['colR' + i] : ['trunk'];
    // the switch tree: each switch splits into an upper and a lower branch with smooth S-bends
    const u0 = UL + R + 40, laneEnd = UR - R;
    let leafI = 0;
    const place = t => { if(!Array.isArray(t)) return {leaf: t, row: leafI++}; const kids = t.map(place); return {kids, v: 0}; };
    const root = place(M.tree);
    const vOf = nd => nd.kids ? (nd.v = (vOf(nd.kids[0]) + vOf(nd.kids[1]))/2) : vl(nd.row);
    vOf(root);
    // number the switches in the order the train can meet them (nearest first)
    const bfs = [root]; for(let i = 0; i < bfs.length; i++) if(bfs[i].kids) bfs[i].kids.forEach(c => c.kids && bfs.push(c));
    bfs.forEach((nd, i) => { nd.id = 'J' + i; nd.k = i + 1; });
    const depth = (nd, d) => { nd.d = d; if(nd.kids) nd.kids.forEach(c => depth(c, d + 1)); };
    depth(root, 0);
    bfs.forEach(nd => node(nd.id, u0 + nd.d*DXB, nd.v));
    bfs.forEach(nd => {
      const us = u0 + nd.d*DXB;
      nd.kids.forEach(c => {
        const p = makePath(us, nd.v, 0).bend(DXB, (c.kids ? c.v : vl(c.row)) - nd.v);
        if(c.kids){ edge('br' + c.id, p, c.id, 'col'); lay.nodes[nd.id].outs.push('br' + c.id); return; }
        const k = c.row;
        p.line(laneEnd - (us + DXB)).arc(1);
        if(k === 0 && n > 1) p.line(LG);
        edge('lane' + k, p, Mg(Math.max(1, k)), 'lane', k);
        lay.nodes[nd.id].outs.push('lane' + k);

    });

    edge('trunk', makePath(UR, drop, Math.PI/2).line(bot - drop).arc(1).line(L - 2*R).arc(1).line(bot - (root.v + R)).arc(1).line(u0 - UL - R), root.id, 'trunk');
    // the switches, each with its lever just behind and above the points
    bfs.forEach((b, i) => {
      const nd = lay.nodes[b.id], lv = T(u0 + b.d*DXB - 64, b.v - 80);
      nd.sw = i;
      const outs = nd.outs.map(id => { const e = lay.edges[id], p = posAt(e, 70); return {id, a: Math.atan2(p.y - nd.y, p.x - nd.x)}; });
      lay.switches.push({k: b.k, node: b.id, x: nd.x, y: nd.y, lx: lv.x, ly: lv.y, outs});
    });
    // where along an edge the track passes a point (u, v)
    const sAt = (e, u, v) => { let best = 0, bd = 1e9; e.pa.forEach(([a, b], i) => { const d = Math.hypot(a - u, b - v); if(d < bd){ bd = d; best = e.cum[i]; } }); return best; };
    // stations: one in the middle of each lane, with a platform, a yard and its building
    const ust = UR - R - 300;
    M.lanes.forEach((id, i) => {
      const e = lay.edges['lane' + i], v = vl(i);
      const base = land ? {x: v - 118, y: ust + 76} : {x: ust, y: v - 48};
      const yard = rectT(T, ust + 118, v - 206, ust + 304, v - 40);
      const plat = rectT(T, ust - 118, v - 47, ust + 108, v - 27);
      const yc = T(ust + 211, v - 120), front = T(ust - 150, v - 70);
      lay.stations.push({id, lane: i, edge: e.id, stopS: sAt(e, ust + 196, v), mid: T(ust, v), base, yard, plat, yc, front, u: ust, v});
    });
    // the depot, where the crane loads the train
    const ud = UL + R + (L - 2*R)*0.36;
    lay.depot = {edge: 'trunk', stopS: sAt(lay.edges.trunk, ud - 190, VB), mid: T(ud, VB),
      base: land ? {x: VB + 118, y: ud + 72} : {x: ud, y: VB + 176},
      pivot: T(ud + 156, VB + 78), pile: T(ud + 156, VB + 160), plat: rectT(T, ud - 120, VB + 27, ud + 110, VB + 47), u: ud};
    if(M.crossing){
      const uc = UL + R + (L - 2*R)*0.64;
      const rd = makePath(uc, Hab + 30, -Math.PI/2).line(Hab + 30 - (VB - 132)).pts.map(([u, v]) => T(u, v));
      lay.crossing = {at: T(uc, VB), s: sAt(lay.edges.trunk, uc, VB), road: rd, end: T(uc, VB - 132), u: uc, land};
    }
    if(M.river){
      const ur = UR - R - 130;
      const pts = [];
      for(let v = Hab + 40; v >= VB - 150; v -= 12){ const w = Math.sin(v/90)*14; pts.push(T(ur + w, v)); }
      lay.river = {pts, pond: T(ur + Math.sin((VB - 150)/90)*14 - 6, VB - 170), bridge: T(ur + Math.sin(VB/90)*14, VB), land};
    }
    if(M.tunnel){
      const c = T(UR - 10, VB - 60), r = 150, e = lay.edges.trunk;
      let first = -1, last = -1;
      e.pts.forEach((p, i) => { if(Math.hypot(p.x - c.x, p.y - c.y) < r - 8){ if(first < 0) first = i; last = i; } });
      const portal = i => { const p = e.pts[i], q = e.pts[Math.min(e.pts.length - 1, i + 1)], o = e.pts[Math.max(0, i - 1)]; return {x: p.x, y: p.y, a: Math.atan2(q.y - o.y, q.x - o.x)}; };
      lay.hill = {x: c.x, y: c.y, r, in: portal(first), out: portal(last), s0: e.cum[first], s1: e.cum[last]};
    }
    plantTrees(lay, mi);
    return lay;
  }
  function rectT(T, u0, v0, u1, v1){ const a = T(u0, v0), b = T(u1, v1); return {x0: Math.min(a.x, b.x), y0: Math.min(a.y, b.y), x1: Math.max(a.x, b.x), y1: Math.max(a.y, b.y)}; }

  // ----- following the track -----
  function posAt(e, s){
    const c = e.cum, p = e.pts, n = p.length;
    if(s <= 0){ const a = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x); return {x: p[0].x + Math.cos(a)*s, y: p[0].y + Math.sin(a)*s, a}; }
    if(s >= e.len){ const a = Math.atan2(p[n - 1].y - p[n - 2].y, p[n - 1].x - p[n - 2].x), d = s - e.len; return {x: p[n - 1].x + Math.cos(a)*d, y: p[n - 1].y + Math.sin(a)*d, a}; }
    let lo = 0, hi = n - 1;
    while(hi - lo > 1){ const m = (lo + hi) >> 1; if(c[m] <= s) lo = m; else hi = m; }
    const u = (s - c[lo])/Math.max(0.0001, c[hi] - c[lo]);
    return {x: lerp(p[lo].x, p[hi].x, u), y: lerp(p[lo].y, p[hi].y, u), a: Math.atan2(p[hi].y - p[lo].y, p[hi].x - p[lo].x)};
  }

  // which way each switch must point to get from edge "from" to the station's lane
  function routeTo(fromEdge, destEdge){
    // walk forward along the track (switches can go either way) until we reach the lane
    const seen = new Set(), need = [];
    function go(eid){
      if(eid === destEdge) return true;
      if(seen.has(eid)) return false;
      seen.add(eid);
      const nd = LY.nodes[LY.edges[eid].to];
      if(nd.outs.length > 1){
        for(let k = 0; k < nd.outs.length; k++){ need.push({sw: nd.sw, want: k}); if(go(nd.outs[k])) return true; need.pop(); }
        return false;
      }
      return go(nd.outs[0]);
    }
    return go(fromEdge) ? need : [];
  }

  // ----- trees and bushes dotted about in the empty spaces -----
  function plantTrees(lay, mi){
    const Rn = rng(mi*97 + (lay.land ? 5 : 11));
    const near = [];
    Object.values(lay.edges).forEach(e => e.pts.forEach((p, i) => { if(i % 4 === 0) near.push(p); }));
    const blocked = (x, y, r) => {
      if(x < 40 || y < 130 || x > lay.WW - 40 || y > lay.WH - 30) return true;
      for(const p of near){
        if(Math.abs(p.x - x) < r && Math.abs(p.y - y) < r && Math.hypot(p.x - x, p.y - y) < r) return true;
        // the leafy top mustn't hide the train going past behind it
        if(p.x > x - 70 && p.x < x + 70 && p.y > y - 150 && p.y < y) return true;
      }
      for(const s of lay.stations){
        const b = s.base;
        if(x > b.x - 120 && x < b.x + 120 && y > b.y - 190 && y < b.y + 40) return true;
        if(x > s.yard.x0 - 30 && x < s.yard.x1 + 30 && y > s.yard.y0 - 40 && y < s.yard.y1 + 30) return true;
        if(Math.hypot(x - s.front.x, y - s.front.y) < 80) return true;
      }
      const d = lay.depot;
      if(x > d.base.x - 130 && x < d.base.x + 130 && y > d.base.y - 170 && y < d.base.y + 40) return true;
      if(Math.hypot(x - d.pivot.x, y - d.pivot.y) < 140) return true;
      for(const sw of lay.switches) if(Math.hypot(x - sw.lx, y - sw.ly) < 90) return true;
      if(lay.crossing){ for(const p of lay.crossing.road) if(Math.hypot(p.x - x, p.y - y) < 80) return true; if(Math.hypot(x - lay.crossing.end.x, y - lay.crossing.end.y) < 110) return true; }
      if(lay.river){ for(const p of lay.river.pts) if(Math.hypot(p.x - x, p.y - y) < 80) return true; if(Math.hypot(x - lay.river.pond.x, y - lay.river.pond.y) < 120) return true; }
      if(lay.hill && Math.hypot(x - lay.hill.x, y - lay.hill.y) < lay.hill.r + 30) return true;
      for(const t of lay.trees) if(Math.hypot(t.x - x, t.y - y) < 70) return true;
      return false;
    };
    lay.trees = [];
    for(let tries = 0; tries < 900 && lay.trees.length < 34; tries++){
      const x = Rn()*lay.WW, y = Rn()*lay.WH;
      if(!blocked(x, y, 66)) lay.trees.push({x, y, kind: Rn() < 0.6 ? 'tree' : Rn() < 0.5 ? 'pine' : 'bush', s: 0.8 + Rn()*0.35, ph: Rn()*6});
    }
  }

  // the little extras a station gets every time you deliver to it
  const BAL_COLS = ['#FF6B6B', '#4DABF7', '#FFD43B', '#B197FC', '#69DB7C', '#FF8FB8'];
  function drawDeco(g, id, n, pop){
    const h = B_TOP[id], w = 88;
    const sc = i => i === n - 1 ? easeBack(pop) : 1;
    const balloon = (x, y, c, i) => {
      const s = sc(i), bx = x + (reduced ? 0 : Math.sin(clock*2 + i)*5), by = y - h*0.18*s;

      g.fillStyle = 'rgba(255,255,255,0.55)'; ell(g, -5, -7, 3.5, 6, -0.4); g.fill(); g.restore();
    };
    const flowers = (x, i) => {
      const s = sc(i); g.save(); g.translate(x, 0); g.scale(s, s);

      g.strokeStyle = '#2F9E44'; g.lineWidth = 2.5; line(g, -5, -18, -7, -30); line(g, 5, -18, 7, -32); line(g, 0, -18, 0, -36);
      [[-7, -32, '#FF8FB8'], [7, -34, '#FFD43B'], [0, -38, '#B197FC']].forEach(([fx, fy, c]) => { g.fillStyle = c; for(let k = 0; k < 5; k++){ const a = k/5*TAU; circ(g, fx + Math.cos(a)*3.4, fy + Math.sin(a)*3.4, 3); g.fill(); } g.fillStyle = '#FAB005'; circ(g, fx, fy, 2.2); g.fill(); });
      g.restore();
    };
    const bunting = (y, i) => {
      const s = sc(i); if(s <= 0.01) return;
      g.save(); g.translate(0, y); g.scale(s, 1);
      g.strokeStyle = O; g.lineWidth = 2; g.beginPath(); g.moveTo(-w, 0); g.quadraticCurveTo(0, 22, w, 0); g.stroke();
      for(let k = 0; k < 9; k++){ const u = (k + 0.5)/9, x = -w + u*2*w, yy = 2*(1 - u)*u*22; g.fillStyle = BAL_COLS[k % BAL_COLS.length]; poly(g, [[x - 7, yy], [x + 7, yy], [x, yy + 14]]); g.fill(); }
      g.restore();

    for(let i = 0; i < Math.min(n, 9); i++){

  // ===== THE PLAY MAT (drawn once per map and screen shape, then reused) =====

  function drawBridge(g, b, e){

  function sNear(e, x, y){ let best = 0, bd = 1e9; e.pts.forEach((p, i) => { const d = Math.hypot(p.x - x, p.y - y); if(d < bd){ bd = d; best = e.cum[i]; } }); return best; }
  function drawYard(g, st, Rn){

        g.fillStyle = '#FF6B6B'; circ(g, cx + 30, cy + 30, 13); g.fill(); g.fillStyle = '#fff'; g.fillRect(cx + 17, cy + 28, 26, 4);
        g.fillStyle = '#B197FC'; rr(g, cx + 10, cy - 40, 20, 20, 3); g.fill(); g.fillStyle = '#69DB7C'; rr(g, cx + 34, cy - 30, 18, 18, 3); g.fill();

        g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 4; LY.land ? ell(g, y.x0, cy, w*0.5, h*0.62) : ell(g, cx, y.y0, w*0.62, h*0.5); g.stroke();
        g.fillStyle = '#4DABF7'; LY.land ? ell(g, y.x0, cy, w*0.32, h*0.45) : ell(g, cx, y.y0, w*0.45, h*0.32); g.fill();

        g.fillStyle = '#ADB5BD'; ell(g, y.x0 + 30, y.y1 - 30, 22, 16); g.fill(); ell(g, y.x0 + 50, y.y1 - 22, 14, 10); g.fill();

        g.save(); rr(g, y.x0, y.y0, w, h, 14); g.clip(); g.fillStyle = '#EACB9A';
        for(let xx = y.x0; xx < y.x1; xx += 28) for(let yy = y.y0; yy < y.y1; yy += 28) if(((xx - y.x0)/28 + (yy - y.y0)/28) % 2 === 0) g.fillRect(xx, yy, 28, 28);
        g.restore();
        circ(g, cx + 28, cy - 18, 28); fs(g, '#fff', O, 3); g.strokeStyle = '#FF8FB8'; g.lineWidth = 4; circ(g, cx + 28, cy - 18, 21); g.stroke();
        g.fillStyle = '#E8A15A'; ell(g, cx + 28, cy - 18, 10, 6); g.fill();

  }

  // ===== GAME STATE =====
  // what's saved on this device: which maps are open, best stars, deliveries so far and decorations
  function freshProg(){ return {unlocked: 1, stars: [0, 0, 0, 0], done: [0, 0, 0, 0], deco: [{}, {}, {}, {}], cur: 0, beat: false}; }
  let prog = load(KEY + 'progress', null);
  if(!prog || !Array.isArray(prog.stars) || prog.stars.length !== 4) prog = freshProg();
  ['stars', 'done'].forEach(k => { prog[k] = prog[k].map(v => clamp(v | 0, 0, 99)); });
  if(!Array.isArray(prog.deco) || prog.deco.length !== 4) prog.deco = [{}, {}, {}, {}];
  prog.unlocked = clamp(prog.unlocked | 0, 1, 4); prog.cur = clamp(prog.cur | 0, 0, prog.unlocked - 1);
  const saveProg = () => save(KEY + 'progress', prog);

  let mapI = 0, playing = false, party = null, done = 0, total = 6, queue = [], dest = null;
  let stState = {}, flyers = [], parts = [], words = [], cars = [], whirly = null, whirlyWait = 16;
  let swAnim = [], lastInput = 0, hintSw = null, held = false, heldT = 0, tootCool = 0;
  const train = {e: 'trunk', s: 0, v: 0, odo: 0, crumbs: [], mode: 'load', cargo: null, t: 0, toot: 0, chuffT: 0, chuffN: 0, idleT: 0, warned: null, face: 1, happy: 0};
  const crane = {a: 0, len: 80, load: null, lift: 1, rest: 0, restLen: 80};
  const bubble = {pop: 0};
  const CRUISE = 132, ACC = 80, BRAKE = 95;
  const OFF = {loco: 55, w0: 158, w1: 244, tail: 282, chim: 19};

  function stationFor(id){ return LY.stations.find(s => s.id === id); }
  function makeQueue(m, n){
    const ids = MAPS[m].lanes.slice(), q = [];
    while(q.length < n){
      const bag = ids.slice().sort(() => Math.random() - 0.5);
      bag.forEach(id => { if(q.length < n) q.push(id); });
    }
    for(let i = 1; i < q.length; i++) if(q[i] === q[i - 1]){ const j = (i + 1) % q.length; [q[i], q[j]] = [q[j], q[i]]; }
    return q;
  }

  // where along the train's path a point "d" behind the front is
  function posOdo(t){
    const c = train.crumbs;
    let lo = 0, hi = c.length - 1;
    if(t <= c[0].o){ const e = LY.edges[c[0].e]; return posAt(e, c[0].s + (t - c[0].o)); }
    while(hi - lo > 1){ const m = (lo + hi) >> 1; if(c[m].o <= t) lo = m; else hi = m; }
    const a = c[lo], e = LY.edges[a.e], s = a.s + (t - a.o);
    if(s <= e.len || lo + 1 >= c.length) return posAt(e, s);
    const b = c[lo + 1];
    return posAt(LY.edges[b.e], b.s - (b.o - t));
  }
  function pieces(){
    const o = train.odo;
    return {loco: posOdo(o - OFF.loco), w0: posOdo(o - OFF.w0), w1: posOdo(o - OFF.w1), head: posOdo(o), tail: posOdo(o - OFF.tail), chim: posOdo(o - OFF.chim)};
  }
  function placeTrainAtDepot(){
    const d = LY.depot;
    train.e = d.edge; train.s = d.stopS; train.v = 0; train.odo = 1000;
    train.crumbs = [{o: 1000 - 600, e: d.edge, s: d.stopS - 600}, {o: 1000, e: d.edge, s: d.stopS}];
  }

  // ----- starting a map -----
  function startMap(m, resume){
    mapI = m; prog.cur = m; saveProg();
    total = MAPS[m].total;
    done = resume ? clamp(prog.done[m] | 0, 0, total - 1) : 0;
    if(!resume){ prog.done[m] = 0; saveProg(); }
    queue = makeQueue(m, total - done);
    LY = makeLayout(m, isLand()); groundCanvas = null;
    swState = LY.switches.map(() => 0); swAnim = LY.switches.map(() => 1);
    stState = {};
    MAPS[m].lanes.forEach(id => { stState[id] = {joy: 0, deco: prog.deco[m][id] | 0, pop: 1, look: 0, near: false, foals: false, banana: false, ph: Math.random()*6}; });
    flyers = []; parts = []; words = []; party = null; held = false; whirly = null; whirlyWait = rand(10, 16);
    crane.load = null; crane.lift = 1;
    const p = LY.depot.pivot, pl = LY.depot.pile;
    crane.rest = Math.atan2(pl.y - p.y, pl.x - p.x) + 0.9; crane.restLen = 70; crane.a = crane.rest; crane.len = crane.restLen;
    placeTrainAtDepot();
    cars = LY.crossing ? [{ph: 'in', d: 0, col: '#4DABF7', sp: 120, wait: 0}, {ph: 'idle', d: 0, col: '#FF8787', sp: 105, wait: 4}] : [];
    beginLoad();
    updateHud(); setGo();
    lastInput = clock;
    updateCam(0, true);
  }
  function beginLoad(){
    dest = queue.length ? queue.shift() : pick(MAPS[mapI].lanes);
    train.mode = 'load'; train.t = 0; train.cargo = {kind: dest, w: [0, 0]};
    bubble.pop = 0; train.warned = null;
    if(dest === 'beach'){ const b = stState.beach; if(b) b.foals = false; }
    // work out where the wagons are for the crane
    const P = pieces(), pv = LY.depot.pivot;
    train.loadSpots = [P.w0, P.w1].map(w => ({x: w.x, y: w.y, a: Math.atan2(w.y - pv.y, w.x - pv.x), len: Math.hypot(w.x - pv.x, w.y - pv.y)}));
  }

  // ----- the crane loading the wagons (or the baby unicorns hopping in) -----
  const LOAD_PER = 2.1, LOAD_END = LOAD_PER*2 + 0.7;
  function updateLoad(dt){
    const t0 = train.t, t = (train.t += dt);
    const c = train.cargo, pv = LY.depot.pivot, pl = LY.depot.pile;
    if(c.kind === 'beach'){
      // the baby unicorns hop on board one by one
      FOAL_ORDER.forEach((k, i) => {
        const at = 0.3 + i*0.55;
        if(t0 < at && t >= at){
          const from = {x: LY.depot.base.x + (i - 1)*40, y: LY.depot.base.y - 10}, w = i < 2 ? 0 : 1, P = pieces(), to = w ? P.w1 : P.w0;
          flyers.push({x0: from.x, y0: from.y, x1: to.x, y1: to.y, t: 0, dur: 0.6, h: 90, foal: k, onLand: () => { c.w[w] = Math.max(c.w[w], i < 2 ? i + 1 : 1); sfx.neigh(); sparkles(to.x, to.y, 6); }});
          sfx.pop();
        }
      });
      if(t >= 2.3 && !held) depart();
      return;
    }
    const pileA = Math.atan2(pl.y - pv.y, pl.x - pv.x), pileL = Math.hypot(pl.x - pv.x, pl.y - pv.y);
    for(let i = 0; i < 2; i++){
      const b = i*LOAD_PER, spot = train.loadSpots[i];
      const fromA = i ? train.loadSpots[0].a : crane.rest, fromL = i ? train.loadSpots[0].len : crane.restLen;
      const ph = t - b;
      if(ph < 0 || ph > LOAD_PER) continue;
      if(ph < 0.55){ const u = easeIO(ph/0.55); crane.a = fromA + wrapA(pileA - fromA)*u; crane.len = lerp(fromL, pileL, u); crane.lift = 1; }
      else if(ph < 0.8){ crane.lift = 1 - (ph - 0.55)/0.25; }
      else if(ph < 1.0){ crane.lift = (ph - 0.8)/0.2; }
      else if(ph < 1.6){ const u = easeIO((ph - 1.0)/0.6); crane.a = pileA + wrapA(spot.a - pileA)*u; crane.len = lerp(pileL, spot.len, u); crane.lift = 1; }
      else if(ph < 1.85){ crane.lift = 1 - (ph - 1.6)/0.25; }
      else { crane.lift = (ph - 1.85)/0.25; }
      if(t0 - b < 0.01 && ph >= 0.01) sfx.whirr();
      if(t0 - b < 1.0 && ph >= 1.0 && !crane.load){ crane.load = cargoFor(c.kind, i).map(v => [c.kind, v]); sfx.plop(); }
      if(t0 - b < 1.0 + 0.01 && ph >= 1.0 + 0.01) sfx.whirr();
      if(t0 - b < 1.85 && ph >= 1.85 && crane.load){ crane.load = null; c.w[i] = 1; sfx.plop(); sfx.plop(0.08); puff(spot.x, spot.y, 6, 'rgba(255,255,255,0.8)'); }
    }
    if(t > LOAD_PER*2){ const u = easeIO((t - LOAD_PER*2)/0.6); const a0 = train.loadSpots[1].a, l0 = train.loadSpots[1].len; crane.a = a0 + wrapA(crane.rest - a0)*u; crane.len = lerp(l0, crane.restLen, u); crane.lift = 1; }
    if(t >= LOAD_END && !held) depart();
  }
  function depart(){
    train.mode = 'run'; train.t = 0;
    doToot(true);
  }
  function doToot(auto){
    if(tootCool > 0 && !auto) return;
    tootCool = 0.6; train.toot = 1.1;
    sfx.toot();
    const P = pieces();
    for(let i = 0; i < 5; i++) addPart({kind: 'steam', x: P.chim.x + rand(-6, 6), y: P.chim.y + rand(-6, 6), vx: rand(-30, 30), vy: rand(-60, -20), r: rand(10, 16), life: rand(0.8, 1.3), col: 'rgba(255,255,255,0.9)'});
    popWord('Toot toot!', P.loco.x, P.loco.y - 30, '#7B4FD6');
  }

  // ----- arriving at a station: unload and celebrate -----
  function arrive(st){
    train.mode = 'unload'; train.t = 0; train.v = 0;
    const c = train.cargo, P = pieces(), S = stState[st.id];
    sfx.hiss(); puff(P.loco.x, P.loco.y, 6, 'rgba(255,255,255,0.8)');
    const yc = st.yc;
    if(c.kind === 'beach'){
      FOAL_ORDER.forEach((k, i) => {
        const from = i < 2 ? P.w0 : P.w1, to = foalSpot(st, i);
        flyers.push({x0: from.x, y0: from.y, x1: to.x, y1: to.y, t: -i*0.3, dur: 0.75, h: 110, foal: k, onLand: () => { if(i === 2) S.foals = true; sfx.neigh(); }});
      });
      c.w = [0, 0];
    } else {
      const list = [];
      [0, 1].forEach(w => cargoFor(c.kind, w).forEach((v, j) => list.push({w, v, j})));
      list.forEach((it, n) => {
        const from = it.w ? P.w1 : P.w0, to = c.kind === 'zoo' ? {x: yc.x + rand(-20, 20), y: yc.y + rand(-10, 10)} : dropSpot(st, n);
        flyers.push({x0: from.x + SPOTS[it.j][0]*0.5, y0: from.y + SPOTS[it.j][1]*0.5, x1: to.x, y1: to.y, t: -n*0.12, dur: 0.7, h: 100, item: [c.kind, it.v], onLand: () => { sfx.plop(); if(n === list.length - 1) c.w = [0, 0]; }});
      });
    }
    train.arrivedAt = st;
  }
  function foalSpot(st, i){ const y = st.yard; const u = [0.28, 0.55, 0.78][i]; return LY.land ? {x: lerp(y.x0, y.x1, 0.6 + i*0.1), y: lerp(y.y0, y.y1, u)} : {x: lerp(y.x0, y.x1, u), y: lerp(y.y0, y.y1, 0.62 + (i % 2)*0.18)}; }
  function dropSpot(st, n){ const b = st.front; return {x: b.x + (n % 3 - 1)*22 + rand(-4, 4), y: b.y + Math.floor(n/3)*14 + rand(-4, 4)}; }
  function updateUnload(dt){
    const t0 = train.t, t = (train.t += dt), st = train.arrivedAt, S = stState[st.id];
    if(t0 < 1.15 && t >= 1.15){
      // the happy bit!
      S.joy = 3.2; S.deco = Math.min(S.deco + 1, 9); S.pop = 0;
      prog.deco[mapI][st.id] = S.deco;
      done++; prog.done[mapI] = done; prog.stars[mapI] = Math.max(prog.stars[mapI], starsFor(done)); saveProg();
      updateHud(true);
      const b = st.base;
      confetti(b.x, b.y - 90, 46); sparkles(b.x, b.y - 60, 12);
      sfx.jingle();
      if(st.id === 'farm'){ sfx.moo(0.2); sfx.moo(0.75); }
      else if(st.id === 'toys'){ sfx.cheer(); sfx.giggle(); }
      else if(st.id === 'beach'){ sfx.neigh(); sfx.giggle(); }
      else if(st.id === 'zoo'){ S.banana = true; sfx.babble(); hearts(st.yc.x, st.yc.y - 60, 6); }
      else if(st.id === 'bakery'){ sfx.ding3(); puff(b.x + 40, b.y - 160, 8, 'rgba(255,255,255,0.9)', true); }
      else if(st.id === 'build'){ sfx.beep(); setTimeout(() => sfx.honk(), 350); }
      popWord(STATIONS[st.id].word, b.x, b.y - B_TOP[st.id] - 10, '#FF4F9A');
      train.happy = 3;
    }
    if(t >= 3.3){
      if(done >= total){ train.cargo = null; startParty(); return; }
      if(!held){ train.cargo = null; dest = null; train.mode = 'run'; train.t = 0; doToot(true); }
    }
  }
  const starsFor = n => n >= total ? 3 : n >= Math.ceil(total*0.6) ? 2 : n >= Math.ceil(total*0.3) ? 1 : 0;

  // ----- moving the train along the track -----
  function stopAhead(){
    if(train.mode !== 'run') return null;
    if(train.cargo){
      const st = stationFor(train.cargo.kind);
      if(st && train.e === st.edge && train.s < st.stopS + 1) return {d: st.stopS - train.s, st};
    } else if(train.e === LY.depot.edge && train.s < LY.depot.stopS + 1) return {d: LY.depot.stopS - train.s, depot: true};
    return null;
  }
  function updateTrain(dt){
    let target = held || train.mode !== 'run' ? 0 : train.cargo ? CRUISE : CRUISE*1.2;
    const stop = stopAhead();
    if(stop) target = Math.min(target, Math.sqrt(2*BRAKE*Math.max(0, stop.d)) + 8);
    // slow down past a station that isn't the right one, and say so
    const E = LY.edges[train.e];
    if(train.cargo && train.mode === 'run' && E.kind === 'lane'){
      const st = LY.stations.find(s => s.edge === train.e);
      if(st && st.id !== train.cargo.kind){
        if(train.s > st.stopS - 300 && train.s < st.stopS + 40) target = Math.min(target, 78);
        if(train.s > st.stopS - 160 && train.warned !== train.e + st.id){
          train.warned = train.e + st.id;
          popWord('Not here!', st.base.x, st.base.y - B_TOP[st.id] + 10, '#7B4FD6');
          sfx.notHere(); setTimeout(() => { if(train.mode === 'run') doToot(true); }, 450);
          stState[st.id].shake = 1.2;
        }
      }
    }
    const a = train.v < target ? ACC : held ? 210 : BRAKE*1.4;
    train.v = train.v < target ? Math.min(target, train.v + a*dt) : Math.max(target, train.v - a*dt);
    if(stop && train.v < 9 && stop.d < 2.5){
      train.s = stop.st ? stop.st.stopS : LY.depot.stopS; train.v = 0;
      if(stop.st) arrive(stop.st); else beginLoad();
      return;
    }
    let d = train.v*dt;
    if(stop) d = Math.min(d, Math.max(0, stop.d));
    if(d <= 0) return;
    train.s += d; train.odo += d;
    while(train.s > LY.edges[train.e].len){
      const e = LY.edges[train.e];
      train.s -= e.len;
      const nd = LY.nodes[e.to];
      train.e = outOf(e.to);
      if(nd.outs.length > 1){ sfx.tap(); }
    }
    const c = train.crumbs, last = c[c.length - 1];
    if(train.odo - last.o >= 4) c.push({o: train.odo, e: train.e, s: train.s});
    while(c.length > 3 && c[1].o < train.odo - 420) c.shift();
  }
  function updateChuff(dt){
    const P = pieces();
    train.face = Math.cos(P.loco.a) >= -0.05 ? 1 : -1;
    if(train.v > 6){
      train.chuffT -= dt;
      if(train.chuffT <= 0){
        train.chuffT = clamp(26/train.v, 0.17, 0.55); train.chuffN++;
        if(!muted) sfx.chuff(train.chuffN % 2 === 0);
        addPart({kind: 'steam', x: P.chim.x, y: P.chim.y, vx: -Math.cos(P.loco.a)*30 + rand(-14, 14), vy: -Math.sin(P.loco.a)*30 + rand(-30, -10), r: rand(7, 11), life: rand(0.7, 1.0), col: 'rgba(255,255,255,0.85)'});
      }
    } else {
      train.idleT -= dt;
      if(train.idleT <= 0){ train.idleT = rand(1.6, 2.6); addPart({kind: 'steam', x: P.chim.x, y: P.chim.y, vx: rand(-10, 10), vy: rand(-30, -14), r: rand(6, 9), life: 1.1, col: 'rgba(255,255,255,0.7)'}); }
    }
  }

  // ----- the switches -----
  function flip(k, fromArrow){
    const sw = LY.switches[k];
    if(!sw || !playing) return;
    swState[k] ^= 1; swAnim[k] = 0;
    sfx.clunk(); lastInput = clock;
    puff(sw.x, sw.y, 5, 'rgba(255,248,230,0.85)');
    const need = neededSwitch();
    if(hintSw === k && need !== k){ sparkles(sw.x, sw.y, 10); sfx.ding2(); }
    if(fromArrow){ pan.x = sw.x - camBase.x; pan.y = sw.y - camBase.y; pan.hold = 2.2; }
  }
  // which switch still needs flipping for the train to reach the right station
  function neededSwitch(){
    if(!train.cargo || train.mode === 'unload' || party) return null;
    const st = stationFor(train.cargo.kind);
    if(!st || train.e === st.edge) return null;
    const route = routeTo(train.e, st.edge);
    for(const r of route) if((swState[r.sw] | 0) !== r.want) return r.sw;
    return null;
  }

  // ----- level crossing and its little cars -----
  function updateCrossing(dt){
    const c = LY.crossing; if(!c) return;
    const P = pieces();
    let busy = [P.head, P.loco, P.w0, P.w1, P.tail].some(p => Math.hypot(p.x - c.at.x, p.y - c.at.y) < 230);
    if(train.e === 'trunk' && c.s - train.s > 0 && c.s - train.s < 300 && train.v > 1) busy = true;
    c.busy = busy;
    c.down = clamp((c.down || 0) + (busy ? 1.6 : -1.2)*dt, 0, 1);
    const Hab = LY.land ? LY.WW : LY.WH;
    const dC = Hab + 30 - LY.VB, dEnd = Hab + 30 - (LY.VB - 132 + 40);
    const blocked = busy || c.down > 0.05;
    cars.forEach(car => {
      car.honk = Math.max(0, (car.honk || 0) - dt);
      if(car.ph === 'idle'){ car.wait -= dt; if(car.wait <= 0){ car.ph = 'in'; car.d = 0; car.honked = false; } return; }
      if(car.ph === 'in'){
        const stopAt = dC - 66;
        if(blocked && car.d <= stopAt && car.d + car.sp*dt >= stopAt){ car.d = stopAt; if(!car.honked){ car.honked = true; car.honk = 0.8; const p = carPos(car); if(onScreen(p.x, p.y)){ sfx.honk(); popWord('Beep beep!', p.x, p.y, '#E8590C'); } } return; }
        car.d += car.sp*dt;

      } else if(car.ph === 'out'){

        if(blocked && car.d >= stopAt && car.d - car.sp*dt <= stopAt){ car.d = stopAt; if(!car.honked){ car.honked = true; car.honk = 0.8; const p = carPos(car); if(onScreen(p.x, p.y)){ sfx.honk(); popWord('Beep beep!', p.x, p.y, '#E8590C'); } } return; }

  function carPos(car){

  // ----- life around the map -----
  function updateLife(dt){
    tootCool = Math.max(0, tootCool - dt);
    train.toot = Math.max(0, train.toot - dt); train.happy = Math.max(0, train.happy - dt);
    swAnim = swAnim.map(a => Math.min(1, a + dt*5));
    bubble.pop += dt;
    const P = pieces();
    LY.stations.forEach(st => {
      const S = stState[st.id]; if(!S) return;
      S.joy = Math.max(0, S.joy - dt); S.pop = Math.min(1, S.pop + dt*2.2); S.shake = Math.max(0, (S.shake || 0) - dt);
      if(party && !party.closed) S.joy = Math.max(S.joy, 1);
      // the cows look up and moo when the train goes past
      if(st.id === 'farm'){
        const d = Math.min(...[P.loco, P.w0, P.w1].map(p => Math.hypot(p.x - st.yc.x, p.y - st.yc.y)));
        S.look = Math.max(0, S.look - dt);
        if(d < 260 && !S.near){ S.near = true; S.look = 2.4; if(onScreen(st.yc.x, st.yc.y)){ sfx.moo(); popWord('Moo!', st.yc.x, st.yc.y - 60, '#2F9E44'); } }
        if(d > 420) S.near = false;
      }
    });
    // Whirly flies over now and then
    if(!whirly){
      whirlyWait -= dt;
      if(whirlyWait <= 0 && playing){
        const v = viewRect(), fromLeft = Math.random() < 0.5;
        const y0 = rand(v.y0 + (v.y1 - v.y0)*0.2, v.y0 + (v.y1 - v.y0)*0.8), y1 = rand(v.y0 + (v.y1 - v.y0)*0.2, v.y0 + (v.y1 - v.y0)*0.8);
        const x0 = fromLeft ? v.x0 - 160 : v.x1 + 160, x1 = fromLeft ? v.x1 + 160 : v.x0 - 160;
        whirly = {x: x0, y: y0, a: Math.atan2(y1 - y0, x1 - x0), sp: 210, x1, y1, t: 0, heard: false};
      }
    } else {
      whirly.t += dt; whirly.x += Math.cos(whirly.a)*whirly.sp*dt; whirly.y += Math.sin(whirly.a)*whirly.sp*dt;
      if(!whirly.heard && onScreen(whirly.x, whirly.y)){ whirly.heard = true; sfx.whup(); }
      if(Math.hypot(whirly.x - whirly.x1, whirly.y - whirly.y1) < 40 || whirly.t > 30){ whirly = null; whirlyWait = rand(24, 40); }
    }
    // things flying through the air (cargo, baby unicorns)
    for(let i = flyers.length - 1; i >= 0; i--){
      const f = flyers[i]; f.t += dt;
      if(f.t >= f.dur){ flyers.splice(i, 1); if(f.onLand) f.onLand(); }
    }
  }

  // ----- the end-of-map party -----
  function startParty(){

    prog.stars[mapI] = 3; prog.done[mapI] = 0;
    if(mapI + 1 < MAPS.length) prog.unlocked = Math.max(prog.unlocked, mapI + 2);
    else prog.beat = true;
    party.newMap = prog.unlocked > was;
    saveProg();
    sfx.cheer(); setTimeout(() => sfx.jingle(), 400);
    LY.stations.forEach(st => { const S = stState[st.id]; S.joy = 6; if(st.id === 'beach') S.foals = true; if(st.id === 'zoo') S.banana = true; });
  }
  function updateParty(dt){

  // ===== PARTICLES AND WORDS =====
  function addPart(p){ if(parts.length < 500) parts.push(Object.assign({t: 0, z: 0, vz: 0, vx: 0, vy: 0, r: 6, life: 1}, p)); }

  function sparkles(x, y, n){ for(let i = 0; i < n; i++){ const a = rand(0, TAU), s = rand(40, 160); addPart({kind: 'spark', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: rand(6, 11), life: rand(0.5, 0.9), col: pick(['#FFD43B', '#fff', '#FF8FB8'])}); } }
  function hearts(x, y, n){ for(let i = 0; i < n; i++) addPart({kind: 'heart', x: x + rand(-20, 20), y: y + rand(-10, 10), vx: rand(-20, 20), vy: rand(-90, -50), r: rand(7, 11), life: rand(1, 1.5)}); }
  function firework(x, y){ const col = pick(['#FF4F9A', '#FFD43B', '#4DABF7', '#69DB7C', '#B197FC']); for(let i = 0; i < 26; i++){ const a = i/26*TAU, s = rand(140, 220); addPart({kind: 'fw', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: rand(5, 8), life: rand(0.8, 1.1), col}); } confetti(x, y, 10); }
  function popWord(text, x, y, col){ words.push({text, x, y, t: 0, col: col || '#FF4F9A'}); if(words.length > 6) words.shift(); }
  function updateParts(dt){
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i]; p.t += dt;
      if(p.t >= p.life){ parts.splice(i, 1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      if(p.kind === 'conf'){ p.vz -= 700*dt; p.z += p.vz*dt; if(p.z < 0){ p.z = 0; p.vz *= -0.3; p.vx *= 0.6; p.vy *= 0.6; } }

      if(p.kind === 'steam'){ p.vx *= 0.97; p.vy *= 0.97; p.r += dt*16; }
      if(p.kind === 'fw'){ p.vx *= 0.95; p.vy = p.vy*0.95 + 60*dt; }
    }

  }

  // ===== CAMERA =====
  // Big screens see the whole train set. Small screens follow the train (drag to look around).
  let CW = 300, CH = 300, PX = 1;

  let camBase = {x: 500, y: 500};
  const isLand = () => CW > CH*1.02;
  const phoneMQ = matchMedia('(max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape)');
  const isPhone = () => phoneMQ.matches;
  const sx = x => (x - cam.x)*cam.k + CW/2, sy = y => (y - cam.y)*cam.k + CH/2;
  const toWorld = (px, py) => ({x: (px - CW/2)/cam.k + cam.x, y: (py - CH/2)/cam.k + cam.y});
  function Wt(g){ g.setTransform(PX*cam.k, 0, 0, PX*cam.k, PX*(CW/2 - cam.x*cam.k), PX*(CH/2 - cam.y*cam.k)); }
  function St(g){ g.setTransform(PX, 0, 0, PX, 0, 0); }
  const fitK = () => Math.min(CW/LY.WW, CH/LY.WH)*0.97;

  let camLock = null;
  function updateCam(dt, snap){

    let tk, tx, ty;
    const fk = fitK();
    if(!followMode() || (party && party.t > 0.5 && !party.closed)){
      tk = Math.min(fk, 1.05); tx = LY.WW/2; ty = LY.WH/2; pan.x = pan.y = 0;
    } else {
      tk = Math.max(fk, phoneK());
      const P = pieces(), look = 110;
      camBase = {x: P.loco.x + Math.cos(P.loco.a)*look, y: P.loco.y + Math.sin(P.loco.a)*look};
      pan.hold -= dt;
      if(pan.hold <= 0 && !pointer.down){ const f = Math.exp(-dt*1.6); pan.x *= f; pan.y *= f; }
      tx = camBase.x + pan.x; ty = camBase.y + pan.y;
    }
    const u = snap ? 1 : 1 - Math.exp(-dt*3);
    cam.k = snap ? tk : lerp(cam.k, tk, 1 - Math.exp(-dt*2.5));

    }
  }

  // ===== DRAW EVERYTHING =====

  function drawCrossingArms(g){

    const d = easeIO(c.down || 0), blink = (c.busy || d > 0.1) && Math.floor(clock*3) % 2;

  const jumpOf = (S, ph) => S && S.joy > 0 && !reduced ? Math.abs(Math.sin(clock*9 + ph))*18 : 0;

  tootBtn.addEventListener('click', e => { if(e.detail === 0 && playing) doToot(); });
  addEventListener('keydown', e => {
    if(!overlay.hidden){ if((e.code === 'Enter' || e.code === 'Space') && document.activeElement === document.body){ const b = panel.querySelector('button.go'); if(b){ e.preventDefault(); b.click(); } } return; }
    if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat){ wake(); startMusic(); toggleHeld(); } return; }
    const n = ['1', '2', '3', '4', '5'].indexOf(e.key);
    if(n >= 0){ wake(); startMusic(); if(LY.switches[n]) flip(n); else lastInput = clock; return; }
    if(e.code === 'KeyT'){ wake(); startMusic(); lastInput = clock; doToot(); return; }
  });
  mapBtn.addEventListener('click', () => { wake(); showStart(); mapBtn.blur(); });

  // ===== PANELS =====
  function showPanel(html, soft){
    panel.innerHTML = html;
    overlay.classList.toggle('soft', !!soft);
    overlay.hidden = false;
    playing = false; pointer.down = false;
    const crew = panel.querySelector('canvas.crewc');
    if(crew) drawCrew(crew);
    const b = panel.querySelector('button.go'); if(b) setTimeout(() => { try { b.focus({preventScroll: true}); } catch(e){} }, 50);
  }
  function hidePanel(){ overlay.hidden = true; playing = true; lastInput = clock; }
  function drawCrew(c){
    const D = 2; c.width = 300*D; c.height = 100*D;
    const g = c.getContext('2d'); g.scale(D, D);
    // the train going along, seen from above
    g.save(); g.translate(168, 58); g.scale(0.6, 0.6);
    [[-176, 'w1'], [-90, 'w0']].forEach(([x, w]) => { g.save(); g.translate(x, 0); drawWagon(g, w === 'w0' ? 0 : 1); cargoFor('toys', 0).forEach((v, j) => { g.save(); g.translate(SPOTS[j][0], SPOTS[j][1]); drawItem(g, w === 'w0' ? 'toys' : 'zoo', v); g.restore(); }); g.restore(); });
    g.save(); g.translate(18, 0); drawLoco(g); g.restore();
    g.save(); g.translate(-20, -10); drawChomperHead(g, 1, 'happy'); g.restore();
    g.restore();
    g.save(); g.translate(24, 96); g.scale(0.36, 0.36); drawFoal(g, {kind: 'foalPink', happy: true, hat: true}); g.restore();
    g.save(); g.translate(278, 94); g.scale(0.46, 0.46); drawLenny(g, {joy: 1, banana: true}); g.restore();
  }
  function mapButtons(){
    return MAPS.map((m, i) => {
      const open = i < prog.unlocked || prog.beat, s = prog.stars[i];
      return `<button class="${i === mapI ? 'now' : ''}" data-map="${i}" ${open ? '' : 'disabled'} aria-label="Map ${i + 1}, ${m.name}${open ? ', ' + s + ' stars' : ', locked'}">${open ? m.icon : '🔒'} ${m.name}<small>${open ? '⭐'.repeat(s) + '☆'.repeat(3 - s) : '&nbsp;'}</small></button>`;
    }).join('');
  }
  function wireMaps(){
    panel.querySelectorAll('.maps button').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.map; wake(); startMusic();
      if(i !== mapI || party) startMap(i, prog.done[i] > 0);
      hidePanel();
    }));
  }
  function showStart(){
    const resume = done > 0 && !party;
    showPanel(`
      <h2>🚂 Chomper's Toot Toot Delivery</h2>
      <div class="crew"><canvas class="crewc" aria-hidden="true"></canvas></div>
      <p>Flick the switches so Chomper's train goes to the right station!</p>
      <div class="key">
        <span>👆 Tap a switch</span><span>change the track (or keys 1-5)</span>
        <span>🛑 Big button / Space</span><span>stop and go</span>
        <span>🚂 Tap the train / T</span><span>toot toot!</span>
      </div>
      <div class="maps">${mapButtons()}</div>
      <div class="row"><button class="go" id="playBtn">${resume ? '🚂 Keep going' : '🚂 Play'}</button></div>
      <p class="small">No timer, no losing - just delivering!</p>`);
    wireMaps();
    $('playBtn').addEventListener('click', () => { wake(); startMusic(); if(party) startMap(Math.min(mapI + 1, prog.unlocked - 1), false); hidePanel(); });
  }
  function showEnd(){
    const last = mapI === MAPS.length - 1;
    showPanel(`
      <h2>🎉 Hooray!</h2>
      <div class="stars" aria-label="3 stars">⭐⭐⭐</div>
      <div class="crew"><canvas class="crewc" aria-hidden="true"></canvas></div>
      <p>Chomper delivered everything on <b>${MAPS[mapI].name}</b>!${party.newMap ? ' A new map is open!' : ''}</p>
      ${last ? '<p class="small">You finished every map! Play any map you like.</p>' : ''}
      <div class="row">
        ${last ? '<button class="go" id="againBtn">🔁 Play again</button>' : '<button class="go" id="nextBtn">Next map! ▶</button>'}
        <button class="ghost" id="stayBtn">👀 Look around</button>
      </div>
      <div class="maps">${mapButtons()}</div>`, true);
    wireMaps();
    const nb = $('nextBtn'); if(nb) nb.addEventListener('click', () => { startMap(mapI + 1, false); hidePanel(); });
    const ab = $('againBtn'); if(ab) ab.addEventListener('click', () => { startMap(mapI, false); hidePanel(); });
    $('stayBtn').addEventListener('click', () => { party.closed = true; hidePanel(); });
    // "Share my map" button (the panel is rebuilt each time, so there's only ever one)
    if(window.LR && LR.shareButton){
      const shareMsg = 'I delivered everything on ' + MAPS[mapI].name + " in Chomper's Toot Toot Delivery! 🚂";
      panel.querySelector('.row').appendChild(LR.shareButton(shareMsg, 'Share my map'));
    }
  }

  // ===== SIZE AND MAIN LOOP =====
  function swapXY(o){ if(o){ const t = o.x; o.x = o.y; o.y = t; } }
  function relayout(){
    const was = LY.land;
    LY = makeLayout(mapI, isLand()); groundCanvas = null;
    pan.x = pan.y = 0;
    if(LY.land === was){ if(train.arrivedAt) train.arrivedAt = stationFor(train.arrivedAt.id); return; }
    // everything moving keeps its place: the new layout is the old one turned on its side
    parts.forEach(swapXY); words.forEach(swapXY);
    flyers.forEach(f => { [f.x0, f.y0] = [f.y0, f.x0]; [f.x1, f.y1] = [f.y1, f.x1]; });
    if(whirly){ swapXY(whirly); [whirly.x1, whirly.y1] = [whirly.y1, whirly.x1]; whirly.a = Math.PI/2 - whirly.a; }
    crane.a = Math.PI/2 - crane.a; crane.rest = Math.PI/2 - crane.rest;
    if(train.loadSpots) train.loadSpots.forEach(s => { swapXY(s); s.a = Math.PI/2 - s.a; });
    if(train.arrivedAt) train.arrivedAt = stationFor(train.arrivedAt.id);
    pan.x = pan.y = 0;
  }
  function resize(){
    const r = board.getBoundingClientRect();
    CW = Math.max(100, r.width); CH = Math.max(100, r.height);
    PX = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(CW*PX); cvs.height = Math.round(CH*PX);
    if(LY && isLand() !== LY.screenLand) relayout();
    if(LY) updateCam(0, true);
  }
  new ResizeObserver(resize).observe(board);
  addEventListener('resize', resize);

  function step(dt){
    clock += dt;
    if(playing && !party){
      if(train.mode === 'run') updateTrain(dt);
      else if(train.mode === 'load') updateLoad(dt);
      else if(train.mode === 'unload') updateUnload(dt);
    }
    updateChuff(dt);
    updateCrossing(dt);
    updateLife(dt); updateParty(dt); updateParts(dt);
    updateCam(dt);
  }
  let last = performance.now();
  function loop(t){
    const raw = Math.min(0.05, (t - last)/1000); last = t;
    const n = Math.max(1, Math.ceil(timeScale));
    for(let i = 0; i < n; i++) step(raw*timeScale/n);
    updateHints();
    goBtn.classList.toggle('nudge', held && clock - heldAt > 6 && playing);
    draw();
    requestAnimationFrame(loop);
  }

  // ===== START =====
  resize();
  startMap(prog.cur, (prog.done[prog.cur] | 0) > 0);
  showStart();
  requestAnimationFrame(loop);

  // a small helper for automatic testing only (switched on by adding ?test to the address)
  if(/[?&]test\b/.test(location.search)) window.__ttd = {
    get state(){ const P = pieces(); return {map: mapI, mode: train.mode, cargo: train.cargo && train.cargo.kind, dest, done, total, switches: swState.slice(), need: neededSwitch(), hint: hintSw, held,
      train: {e: train.e, s: Math.round(train.s), v: Math.round(train.v), x: Math.round(P.loco.x), y: Math.round(P.loco.y), sx: Math.round(sx(P.loco.x)), sy: Math.round(sy(P.loco.y))},
      party: !!party, playing, land: LY.land, k: +cam.k.toFixed(3), follow: followMode(), unlocked: prog.unlocked, stars: prog.stars.slice(), world: [Math.round(LY.WW), Math.round(LY.WH)]}; },
    flip(n){ flip(n - 1); },
    startMap(m){ startMap(m, false); hidePanel(); },
    solve(){ let k; while((k = neededSwitch()) !== null) flip(k); },
    finishDelivery(){
      if(!train.cargo) return false;
      if(train.mode === 'load'){ train.cargo.w = [1, 1]; crane.load = null; train.mode = 'run'; }
      const st = stationFor(train.cargo.kind);
      train.e = st.edge; train.s = st.stopS; train.odo += 50;
      train.crumbs = [{o: train.odo - 600, e: st.edge, s: st.stopS - 600}, {o: train.odo, e: st.edge, s: st.stopS}];
      arrive(st); return true;
    },
    speed(k){ timeScale = k; },
    levers(){ const r = board.getBoundingClientRect(); return LY.switches.map(sw => ({k: sw.k, x: Math.round(r.left + sx(sw.lx)), y: Math.round(r.top + sy(sw.ly)), jx: Math.round(r.left + sx(sw.x)), jy: Math.round(r.top + sy(sw.y))})); },
    lookAt(k){ const sw = LY.switches[k - 1]; pan.x = sw.x - camBase.x; pan.y = sw.y - camBase.y; pan.hold = 5; },
    idle(){ lastInput = -100; },
    lockCam(c){ camLock = c; }, pieces: () => pieces(), stations: () => LY.stations.map(s => ({id: s.id, x: s.base.x, y: s.base.y})), depot: () => LY.depot.base,
    reset(){ prog = freshProg(); saveProg(); }
  };
})();
</script>
</body>
</html>
