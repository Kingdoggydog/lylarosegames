<style>
  :root{

  [hidden]{display:none!important}

  body{

  .wrap{max-width:1300px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}

  @media (min-width:1100px){

  /* short screens: everything on one row, no title - the game gets the space */
  @media (max-height:520px){
    h1{display:none}
    .stats{order:2;margin-right:auto}
    .snd{margin-left:0}
    .pill{font-size:13px;padding:5px 9px}

  /* the building site fills whatever space is left over */
  .stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}

  #c{width:100%;height:100%}

  .act{position:absolute;z-index:3;right:16px;bottom:16px;width:104px;height:104px;border-radius:50%;padding:0;

    .stats{position:fixed;z-index:4;top:calc(8px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));pointer-events:none}

    .act small{font-size:17px}

  }
  @media (prefers-reduced-motion: reduce){ .act.nudge{animation:none;outline:5px solid #FF4F9A} }

<script>
(() => {
  // ===== SETUP =====
  const $ = id => document.getElementById(id);
  const cvs = $('c'), ctx = cvs.getContext('2d');
  const board = $('board'), overlay = $('overlay'), panel = $('panel'), handEl = $('hand');
  const actBtn = $('act'), actIcon = $('actIcon'), actWord = $('actWord');
  const soundBtn = $('sound'), musicBtn = $('music'), newBtn = $('newBtn'), progPill = $('progPill');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"Chewy","Comic Sans MS",cursive';
  const TAU = Math.PI*2;
  const O = '#2F2350';                       // outline colour
  const KEY = 'lrg-busy-building-site-';

  const rand = (a, b) => a + Math.random()*(b - a);
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a)*u;
  const ease = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
  const easeIO = u => { u = clamp(u, 0, 1); return u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2; };
  const easeBack = u => { u = clamp(u, 0, 1); const c = 1.9; return 1 + (c + 1)*Math.pow(u - 1, 3) + c*Math.pow(u - 1, 2); };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const wrapA = a => { while(a > Math.PI) a -= TAU; while(a < -Math.PI) a += TAU; return a; };
  const seg = (u, a, b) => clamp((u - a)/(b - a), 0, 1);
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
  function rr(g, x, y, w, h, r){
    r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function ell(g, x, y, rx, ry, rot){ g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
  function circ(g, x, y, r){ g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, TAU); }
  function line(g, x1, y1, x2, y2){ g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  function poly(g, pts){ g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
  function fs(g, fill, stroke, lw){ g.fillStyle = fill; g.fill(); if(stroke){ g.strokeStyle = stroke; g.lineWidth = lw || 4; g.stroke(); } }
  function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  let muted = load(KEY + 'muted', false), musicOn = load(KEY + 'music', true);
  let townsBuilt = load(KEY + 'towns', 0);
  let clock = 0;

  // ===== SOUND AND MUSIC (all made in the browser, no sound files needed) =====
  let actx = null, master, sfxBus, musicBus, noiseBuf, eng = null, engKey = '';
  function audio(){
    if(actx) return actx;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
      sfxBus = actx.createGain(); sfxBus.connect(master);
      musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.26 : 0; musicBus.connect(master);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    } catch(e){ actx = null; }
    return actx;
  }
  function wake(){ if(audio() && actx.state === 'suspended') actx.resume(); }
  function tone(f, dur, type = 'sine', vol = 0.18, f2 = null, delay = 0, bus = null){
    if(!audio()) return;
    const t0 = actx.currentTime + Math.max(0, delay);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(bus || sfxBus); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(t0, dur, filterType, freq, q, vol, attack, bus, freq2){
    if(!audio()) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = actx.createBiquadFilter(); fl.type = filterType; fl.frequency.setValueAtTime(freq, t0); fl.Q.value = q;
    if(freq2) fl.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl).connect(g).connect(bus || sfxBus);
    src.start(t0, Math.random()*0.5); src.stop(t0 + dur + 0.05);
  }
  const now = () => actx ? actx.currentTime : 0;
  function hornAt(freqs, d, len, vol){
    if(!audio()) return;
    const t = actx.currentTime + d, g = actx.createGain(), lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1600;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.setValueAtTime(vol, t + len - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    lp.connect(g).connect(sfxBus);
    freqs.forEach(f => { const o = actx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(f*1.04, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05); o.connect(lp); o.start(t); o.stop(t + len + 0.02); });
  }
  const HORNS = { digger: [392, 494], tipper: [523, 659], dozer: [330, 415], rolla: [440, 554] };
  const sfx = {
    scoop(){ if(!audio()) return; noise(now(), 0.35, 'bandpass', 1800, 2.5, 0.08, 0.05, null, 700); tone(140, 0.2, 'sine', 0.14, 70, 0.15); },
    thud(){ if(!audio()) return; tone(130, 0.3, 'sine', 0.22, 55); noise(now(), 0.28, 'lowpass', 450, 0.7, 0.14, 0.01); },
    thunk(){ if(!audio()) return; tone(95, 0.3, 'sine', 0.25, 48); tone(240, 0.09, 'triangle', 0.12, 180); noise(now(), 0.18, 'lowpass', 700, 0.8, 0.12, 0.005); },
    tipRumble(){ if(!audio()) return; noise(now(), 1.2, 'lowpass', 380, 0.8, 0.14, 0.15, null, 160); noise(now() + 0.2, 0.9, 'bandpass', 900, 1, 0.05, 0.2); },
    squish(){ if(!audio()) return; noise(now(), 0.25, 'lowpass', 1100, 2, 0.1, 0.02, null, 220); tone(260, 0.2, 'sine', 0.09, 110); },
    boing(){ if(!audio()) return; const t = now(); const o = actx.createOscillator(), g = actx.createGain(), l = actx.createOscillator(), lg = actx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.18); o.frequency.exponentialRampToValueAtTime(380, t + 0.5);

    72,0,72,74,76,0,79,0,   77,0,76,0,74,0,72,0,

    if(beat === 0 || beat === 4) tone(hz(root - 12 + (beat === 4 ? 7 : 0)), S*1.6, 'triangle', 0.26, null, d, musicBus);
    if(beat === 2 || beat === 6) [0, (root === 45 || root === 50) ? 3 : 4, 7].forEach(n => tone(hz(root + 12 + n), 0.16, 'sine', 0.035, null, d, musicBus));
    const m = MELODY[i];
    if(m){ tone(hz(m), S*1.5, 'triangle', 0.07, null, d, musicBus); tone(hz(m + 12), 0.07, 'sine', 0.025, null, d, musicBus); }
    if(beat % 2 === 1) noise(t, 0.035, 'highpass', 7000, 0.7, 0.016, 0.003, musicBus);
    if(beat === 0 || beat === 4) tone(80, 0.12, 'sine', 0.2, 40, d, musicBus);

  }
  function scheduleMusic(){

  function sampleBumps(pts, gap){

  // ===== WORLD <-> SCREEN =====
  let CW = 300, CH = 300, PX = 1;
  const cam = {x: WW/2, y: WH/2, k: 1};
  const sx = x => (x - cam.x)*cam.k + CW/2, sy = y => (y - cam.y)*cam.k + CH/2;
  const toWorld = (px, py) => ({x: (px - CW/2)/cam.k + cam.x, y: (py - CH/2)/cam.k + cam.y});
  function Wt(g){ g.setTransform(PX*cam.k, 0, 0, PX*cam.k, PX*(CW/2 - cam.x*cam.k), PX*(CH/2 - cam.y*cam.k)); }
  function St(g){ g.setTransform(PX, 0, 0, PX, 0, 0); }

    let tk = baseK(), tx, ty;
    if(party && party.t > 0.6 && !party.closed){ tk = Math.max(fitK(), 0.2); tx = WW/2; ty = WH/2; }
    else { const v = V[active]; tx = v.x + Math.cos(v.a)*v.v*0.45; ty = v.y + Math.sin(v.a)*v.v*0.45; }
    const u = snap ? 1 : 1 - Math.exp(-dt*3.2);
    cam.k = lerp(cam.k, tk, snap ? 1 : 1 - Math.exp(-dt*2.5));
    cam.x = lerp(cam.x, tx, u); cam.y = lerp(cam.y, ty, u);

    cam.x = hw*2 >= WW + M*2 ? WW/2 : clamp(cam.x, hw - M, WW + M - hw);

  // ===== DRAWING HELPERS =====
  // cartoon eyes on top of a vehicle that looks forward (towards +x)
  function eyes(g, x, y, gap, r, happy, blink){

        g.strokeStyle = O; g.lineWidth = 3; g.lineCap = 'round';
        g.beginPath(); g.arc(x + r*0.35, y + dy, r*0.75, Math.PI*0.55, Math.PI*1.45); g.stroke();
      } else if(blink){
        g.strokeStyle = O; g.lineWidth = 3; line(g, x, y + dy - r*0.8, x, y + dy + r*0.8);
      } else {
        ell(g, x, y + dy, r, r*1.05); fs(g, '#fff', O, 2.5);
        g.fillStyle = O; circ(g, x + r*0.38, y + dy, r*0.56); g.fill();
        g.fillStyle = '#fff'; circ(g, x + r*0.55, y + dy - r*0.25, r*0.2); g.fill();
      }
    });
  }
  function tread(g, x, y, w, h, off){

    g.restore();

  function dirtLump(g, x, y, s, seed){

  function buildGround(){
    const gc = document.createElement('canvas'); gc.width = WW; gc.height = WH;
    const g = gc.getContext('2d');
    const R = rng(town*31 + 5);
    // grass with mowing stripes
    g.fillStyle = '#8FD16A'; g.fillRect(0, 0, WW, WH);
    g.fillStyle = '#86C962'; for(let x = -WH; x < WW; x += 120){ poly(g, [[x, 0], [x + 60, 0], [x + 60 + WH*0.4, WH], [x + WH*0.4, WH]]); g.fill(); }
    // the sandy building site
    rr(g, FEN + 16, FEN + 16, WW - FEN*2 - 32, WH - FEN*2 - 32, 60); g.fillStyle = '#E8C38A'; g.fill();
    g.save(); rr(g, FEN + 16, FEN + 16, WW - FEN*2 - 32, WH - FEN*2 - 32, 60); g.clip();
    for(let i = 0; i < 160; i++){ g.fillStyle = R() < 0.5 ? '#DDB57B' : '#F0CF98'; ell(g, R()*WW, R()*WH, 20 + R()*70, 12 + R()*40, R()*3); g.fill(); }
    for(let i = 0; i < 420; i++){ g.fillStyle = R() < 0.5 ? '#C9A06A' : '#F7E2BC'; circ(g, R()*WW, R()*WH, 2 + R()*4); g.fill(); }
    // grass tufts
    g.strokeStyle = '#7CBF55'; g.lineWidth = 3; g.lineCap = 'round';
    for(let i = 0; i < 60; i++){ const x = R()*WW, y = R()*WH; line(g, x, y, x - 4, y - 10); line(g, x + 4, y, x + 5, y - 12); line(g, x + 8, y, x + 13, y - 9); }
    g.restore();
    // flowers on the grass outside the fence
    for(let i = 0; i < 160; i++){
      let x = R()*WW, y = R()*WH;
      if(x > FEN - 10 && x < WW - FEN + 10 && y > FEN - 10 && y < WH - FEN + 10) continue;
      g.fillStyle = pick(['#FFFFFF', '#FFD43B', '#FF8FB8', '#B197FC']);
      for(let k = 0; k < 5; k++){ const a = k/5*TAU; circ(g, x + Math.cos(a)*4, y + Math.sin(a)*4, 3); g.fill(); }
      g.fillStyle = '#FAB005'; circ(g, x, y, 2.5); g.fill();
    }
    groundCanvas = gc;

  function drawFence(g){
    const x0 = FEN, y0 = FEN, x1 = WW - FEN, y1 = WH - FEN;
    const gaps = road.dir === 'h' ? {y: road.c} : {x: road.c};
    const sides = [[x0, y0, x1, y0], [x1, y0, x1, y1], [x1, y1, x0, y1], [x0, y1, x0, y0]];
    g.lineCap = 'butt';
    sides.forEach(([ax, ay, bx, by]) => {
      const pieces = [];
      if(gaps.y !== undefined && ax === bx){ const lo = Math.min(ay, by), hi = Math.max(ay, by); pieces.push([ax, lo, ax, gaps.y - 62], [ax, gaps.y + 62, ax, hi]); }

      else pieces.push([ax, ay, bx, by]);
      pieces.forEach(([a1, b1, a2, b2]) => {
        g.strokeStyle = O; g.lineWidth = 14; line(g, a1, b1, a2, b2);

  // ===== PARTICLES AND POP-UP WORDS =====
  function addPart(p){ if(parts.length < 500) parts.push(Object.assign({t: 0, z: 0, vz: 0, vx: 0, vy: 0, r: 6, life: 1}, p)); }

  function hearts(x, y, n){ for(let i = 0; i < n; i++) addPart({kind: 'heart', x: x + rand(-20, 20), y: y + rand(-10, 10), vx: rand(-20, 20), vy: rand(-90, -50), r: rand(7, 11), life: rand(1, 1.5)}); }
  function popWord(text, x, y, col){ words.push({text, x, y, t: 0, col: col || '#FF4F9A'}); }
  function updateParts(dt){
    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i]; p.t += dt;
      if(p.t >= p.life){ parts.splice(i, 1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      if(p.kind === 'dirt' || p.kind === 'conf'){ p.vz -= 700*dt; p.z += p.vz*dt; if(p.z < 0){ p.z = 0; p.vz *= -0.3; p.vx *= 0.6; p.vy *= 0.6; } }
      if(p.kind === 'puff'){ p.vx *= 0.96; p.vy *= 0.96; p.r += dt*16; }
      if(p.kind === 'steam'){ p.vx *= 0.97; p.vy *= 0.97; p.r += dt*14; }

  function drawParts(g){

      else if(p.kind === 'puff' || p.kind === 'steam'){ g.globalAlpha = (1 - u)*0.85; g.fillStyle = p.col; circ(g, p.x, p.y, p.r); g.fill(); g.globalAlpha = 1; }
      else if(p.kind === 'conf'){ g.save(); g.translate(p.x, p.y - p.z); g.rotate(p.t*(p.spin || 4)); g.fillStyle = p.col; g.globalAlpha = 1 - Math.max(0, u - 0.7)/0.3; g.fillRect(-p.r, -p.r*0.5, p.r*2, p.r); g.restore(); }
      else if(p.kind === 'spark'){ g.globalAlpha = 1 - u; drawTwinkle(g, p.x, p.y, p.r*(1 - u*0.5), p.col); g.globalAlpha = 1; }
      else if(p.kind === 'heart'){ g.globalAlpha = 1 - u; drawHeart(g, p.x, p.y, p.r); g.globalAlpha = 1; }
      else if(p.kind === 'fw'){ g.globalAlpha = 1 - u; g.fillStyle = p.col; circ(g, p.x, p.y, p.r*(1 - u*0.5)); g.fill(); g.globalAlpha = 1; }
    });
  }
  function drawTwinkle(g, x, y, r, col){

  function drawWords(g){

  // ===== DRIVING =====
  const MAXV = {digger: 230, tipper: 270, dozer: 230, rolla: 200};
  const pointer = {down: false, id: null, sx: 0, sy: 0, x0: 0, y0: 0, t0: 0, driving: false, pending: null, moved: false};
  const keys = new Set();
  let goTo = null;
  const front = (v, d) => ({x: v.x + Math.cos(v.a)*d, y: v.y + Math.sin(v.a)*d});
  function boundsPt(p){ return {x: clamp(p.x, FEN + VR + 4, WW - FEN - VR - 4), y: clamp(p.y, FEN + VR + 4, WH - FEN - VR - 4)}; }
  function driveInput(){
    // keyboard: drive the way the arrows point
    let kx = 0, ky = 0;
    if(keys.has('ArrowLeft') || keys.has('KeyA')) kx -= 1;
    if(keys.has('ArrowRight') || keys.has('KeyD')) kx += 1;
    if(keys.has('ArrowUp') || keys.has('KeyW')) ky -= 1;
    if(keys.has('ArrowDown') || keys.has('KeyS')) ky += 1;
    const v = V[active];
    if(kx || ky){ goTo = null; return {dir: Math.atan2(ky, kx), power: 1}; }
    let target = null;
    if(pointer.down && pointer.driving) target = boundsPt(toWorld(pointer.sx, pointer.sy));
    else if(goTo) target = goTo;
    if(!target) return null;
    const d = Math.hypot(target.x - v.x, target.y - v.y);
    // aiming at another truck? stop just beside it instead of shoving it along
    const stopAt = active === 'tipper' && VEH_ORDER.some(k => k !== active && Math.hypot(V[k].x - target.x, V[k].y - target.y) < 50) ? VR*2 + 14 : 30;
    if(d < stopAt){ if(!pointer.down) goTo = null; return null; }
    return {dir: Math.atan2(target.y - v.y, target.x - v.x), power: clamp((d - 20)/110, 0.25, 1)};
  }
  function updateVehicles(dt){
    const inp = (playing && !(party && !party.closed)) ? driveInput() : null;
    VEH_ORDER.forEach(k => {
      const v = V[k];
      v.blink = Math.max(0, v.blink - dt); if(Math.random() < dt*0.25) v.blink = 0.14;
      v.happy = Math.max(0, v.happy - dt); v.hop = Math.max(0, v.hop - dt*2.5);
      v.jump = Math.max(0, v.jump - dt*1.6); v.jumpCool = Math.max(0, v.jumpCool - dt);
      const busy = v.anim && v.anim.kind === 'tip';
      let tv = 0;
      if(k === active && inp && !busy){
        const diff = wrapA(inp.dir - v.a), turn = 4.6*dt;
        v.a = wrapA(v.a + clamp(diff, -turn, turn));
        const align = Math.abs(diff) < Math.PI/2 ? Math.max(0.3, Math.cos(diff)) : 0.25;
        tv = MAXV[k]*inp.power*align;
      }
      v.v = lerp(v.v, tv, 1 - Math.exp(-dt*(tv > v.v ? 3.5 : 6)));
      if(Math.abs(v.v) < 1) v.v = 0;
      const mx = Math.cos(v.a)*v.v*dt + v.bx*dt, my = Math.sin(v.a)*v.v*dt + v.by*dt;
      v.x += mx; v.y += my; v.dist += Math.hypot(mx, my)*(v.v >= 0 ? 1 : -1);
      v.bx *= Math.exp(-dt*6); v.by *= Math.exp(-dt*6);
      // tyre tracks
      if(v.v > 30){ v.trackD = (v.trackD || 0) + v.v*dt; if(v.trackD > 16){ v.trackD = 0; tracks.push({x: v.x, y: v.y, a: v.a, t: 0, kind: k}); if(tracks.length > 380) tracks.shift(); } }
      // fence: bump gently off it, honk and keep going
      const lo = FEN + VR, hiX = WW - FEN - VR, hiY = WH - FEN - VR;
      let bumped = false;
      if(v.x < lo){ v.x = lo; v.bx = 120; bumped = true; } if(v.x > hiX){ v.x = hiX; v.bx = -120; bumped = true; }
      if(v.y < lo){ v.y = lo; v.by = 120; bumped = true; } if(v.y > hiY){ v.y = hiY; v.by = -120; bumped = true; }
      if(bumped && k === active && Math.abs(v.v) > 60){ v.v *= 0.3; if(honkCool <= 0){ sfx.honk(k); sfx.thud(); popWord('Honk!', v.x, v.y, '#E8590C'); honkCool = 1.2; v.hop = 1; } }
      // shed roof
      const s = L.shed;
      if(v.x > s.x - VR && v.x < s.x + s.w + VR && v.y < s.y + 56 + VR && v.y > s.y - 20){ v.y = s.y + 56 + VR; }
      // ramp: whee!
      jobs.forEach(j => {
        if(j.type === 'ramp' && j.done && v.jumpCool <= 0 && v.v > 90 && Math.abs(v.x - j.at.x) < 90 && Math.abs(v.y - j.at.y + 20) < 40){
          v.jump = 1; v.jumpCool = 1.2; sfx.boing(); if(k === active) popWord('Wheee!', v.x, v.y - 20, '#4DABF7');
        }
      });
    });
    honkCool -= dt;
    // soft bumping: vehicles nudge each other, and slide round buildings, ponds and boulders
    for(let i = 0; i < 4; i++) for(let k = i + 1; k < 4; k++){
      const a = V[VEH_ORDER[i]], b = V[VEH_ORDER[k]];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = VR*2 - 6;
      if(d < m && d > 0.01){
        const p = (m - d)/2, nx = dx/d, ny = dy/d;
        const aw = VEH_ORDER[i] === active ? 1 : 0.35, bw = VEH_ORDER[k] === active ? 1 : 0.35, tot = aw + bw;
        a.x -= nx*p*2*aw/tot; a.y -= ny*p*2*aw/tot; b.x += nx*p*2*bw/tot; b.y += ny*p*2*bw/tot;
      }
    }
    const solids = getSolids();
    VEH_ORDER.forEach(k => {
      const v = V[k];
      solids.forEach(s => {
        const dx = v.x - s.x, dy = v.y - s.y, d = Math.hypot(dx, dy), m = s.r + VR*0.8;

      });
      // loose rocks and logs get a gentle nudge
      objs.forEach(o => {
        if(o.placed || o.placing || (V.dozer.carry === o)) return;
        const dx = o.x - v.x, dy = o.y - v.y, d = Math.hypot(dx, dy), m = o.r + VR*0.85;
        if(d < m && d > 0.01){ const p = m - d; o.x += dx/d*p*0.7; o.y += dy/d*p*0.7; v.x -= dx/d*p*0.3; v.y -= dy/d*p*0.3;
          o.x = clamp(o.x, FEN + o.r + 6, WW - FEN - o.r - 6); o.y = clamp(o.y, FEN + o.r + 6, WH - FEN - o.r - 6); }
      });
    });
  }
  function getSolids(){
    const s = [];
    s.push({x: pile.x, y: pile.y, r: 58});
    jobs.forEach(j => {
      if(j.type === 'fill' && !j.filled) s.push({x: j.at.x, y: j.at.y, r: 50});
      if(j.type === 'pond' && j.water > 0) s.push({x: j.at.x, y: j.at.y, r: 92});
      if(j.type === 'pond' && j.water <= 0 && j.depth > 1) s.push({x: j.at.x, y: j.at.y, r: 30 + j.depth*14});
    });
    builds.forEach(b => { if(b.type === 'house' || b.type === 'cabin') s.push({x: b.x, y: b.y - 34, r: 64}); if(b.type === 'playground'){ s.push({x: b.x - 50, y: b.y - 30, r: 70}); s.push({x: b.x + 90, y: b.y - 30, r: 52}); } });
    objs.forEach(o => { if(o.placed && !o.gone) s.push({x: o.x, y: o.y, r: o.r - 4}); });
    return s;
  }

  // ===== THE SPECIAL MOVES (big round button) =====
  function doAction(){
    if(!playing || (party && !party.closed)) return;
    lastAct = clock; setNudge(false);
    const v = V[active], j = curJob(), st = curStep();
    if(active === 'digger'){
      if(v.anim) return;
      const fp = front(v, 60);
      const atPile = Math.hypot(fp.x - pile.x, fp.y - pile.y) < 130 || Math.hypot(v.x - pile.x, v.y - pile.y) < 160;
      const pondJob = jobs.find(q => q.type === 'pond' && !q.done && q.water <= 0 && q.depth < 4 && Math.hypot(v.x - q.at.x, v.y - q.at.y) < 200);
      if(pondJob && (!st || st.kind === 'dig' || !atPile)){ v.anim = {kind: 'dig', t: 0, dur: 1.5, job: pondJob, side: 1, fired: {}}; sfx.scoop(); return; }
      if(atPile){
        if(v.bucket >= 3){ v.anim = {kind: 'full', t: 0, dur: 0.7}; popWord('Full!', v.x, v.y, '#E8590C'); sfx.honk('digger'); return; }
        v.anim = {kind: 'scoop', t: 0, dur: 1.05, fired: {}, ang: wrapA(Math.atan2(pile.y - v.y, pile.x - v.x) - v.a)};
        sfx.scoop(); return;
      }
      v.anim = {kind: 'air', t: 0, dur: 0.9, fired: {}, ang: 0}; sfx.scoop();
    } else if(active === 'tipper'){
      if(v.anim) return;
      const tipJob = jobs.find(q => !q.done && ((q.type === 'fill' && !q.filled) || (q.type === 'ramp' && !q.tipped)) && Math.hypot(v.x - q.at.x, v.y - q.at.y) < 190);
      if(v.load > 0 && tipJob && tipJob === j){ v.anim = {kind: 'tip', t: 0, dur: 2.0, job: tipJob, fired: {}}; sfx.tipRumble(); return; }
      if(v.load > 0){ v.anim = {kind: 'nope', t: 0, dur: 0.9}; sfx.honk('tipper'); popWord('Not here!', v.x, v.y, '#E8590C'); return; }
      v.anim = {kind: 'empty', t: 0, dur: 1.1}; sfx.hiss();
    } else if(active === 'dozer'){
      if(v.anim) return;
      v.anim = {kind: 'beep', t: 0, dur: 0.9}; sfx.beepbeep(); popWord('Beep beep!', v.x, v.y, '#E03131'); v.hop = 1;
    } else if(active === 'rolla'){
      if(v.anim) return;
      v.anim = {kind: 'toot', t: 0, dur: 1.0}; sfx.toot(); popWord('Toot toot!', v.x, v.y, '#2F9E44'); v.hop = 1;
      for(let i = 0; i < 6; i++){ const c = front(v, -22); addPart({kind: 'steam', x: c.x + rand(-6, 6), y: c.y + 18, vx: rand(-30, 30) - Math.cos(v.a)*40, vy: rand(-60, -20), r: rand(8, 14), life: rand(0.9, 1.4), col: '#fff'}); }
    }
  }
  function updateAnims(dt){
    const d = V.digger, t = V.tipper;
    // ----- digger arm -----
    const A = d.arm;
    if(d.anim){
      const an = d.anim; an.t += dt/an.dur; const u = an.t;
      const once = (key, at, fn) => { if(u >= at && !an.fired[key]){ an.fired[key] = true; fn(); } };
      if(an.kind === 'scoop' || an.kind === 'air'){
        A.ang = lerp(0, clamp(an.ang, -0.7, 0.7), Math.sin(Math.min(1, u)*Math.PI));
        A.ext = u < 0.4 ? ease(u/0.4) : 1 - ease((u - 0.55)/0.45)*(u > 0.55 ? 1 : 0);
        A.curl = seg(u, 0.4, 0.55); A.full = false;
        if(an.kind === 'scoop') once('bite', 0.45, () => { d.bucket = Math.min(3, d.bucket + 1); pile.size = Math.max(0.25, pile.size - 0.14); const e = armEnd(d); dirtSpray(e.x, e.y, 6); sfx.thud(); popWord(['Scoop!', 'Dig dig!', 'Yum!'][d.bucket - 1] || 'Scoop!', d.x, d.y, '#E8A500'); });
      } else if(an.kind === 'dig'){
        const side = an.side;
        if(u < 0.25){ A.ext = ease(u/0.25); A.ang = 0; A.curl = 0; }
        else if(u < 0.4){ A.ext = 1; A.curl = seg(u, 0.25, 0.4); }
        else if(u < 0.7){ const k = ease(seg(u, 0.4, 0.7)); A.ang = side*1.7*k; A.ext = lerp(1, 0.5, k); A.curl = 1; }
        else if(u < 0.82){ A.curl = 1 - seg(u, 0.7, 0.8); }
        else { const k = ease(seg(u, 0.82, 1)); A.ang = side*1.7*(1 - k); A.ext = 0.5*(1 - k); A.curl = 0; }
        A.full = u > 0.32 && u < 0.76;
        once('bite', 0.32, () => { const j = an.job; j.depth = Math.min(4, j.depth + 1); dirtSpray(j.at.x, j.at.y, 8); sfx.thud(); popWord(['Dig!', 'Deeper!', 'Dig dig!', 'Done!'][j.depth - 1], d.x, d.y, '#E8A500'); });
        once('dump', 0.76, () => {
          const e = armEnd(d); let h = heaps.find(q => q.job === an.job && Math.hypot(q.x - e.x, q.y - e.y) < 90);
          if(!h){ h = {x: e.x, y: e.y, size: 0, job: an.job}; heaps.push(h); }
          h.size = Math.min(1.2, h.size + 0.35); dirtSpray(e.x, e.y, 8); sfx.thunk();
        });
      } else if(an.kind === 'load'){
        if(u < 0.4){ const k = ease(u/0.4); A.ang = an.ang*k; A.ext = 0.8*k; A.curl = 1 - k*0.3; }
        else if(u < 0.6){ A.curl = 0; }
        else { const k = ease(seg(u, 0.6, 1)); A.ang = an.ang*(1 - k); A.ext = 0.8*(1 - k); }
        A.full = false;
        once('drop', 0.5, () => {
          if(Math.hypot(t.x - d.x, t.y - d.y) < 230){
            const n = Math.min(d.bucket, 3 - t.load); d.bucket -= n; t.load += n;
            dirtSpray(t.x, t.y, 10); sfx.thunk(); t.happy = 1.2; t.hop = 1;
            if(t.load >= 3){ popWord('Full up!', t.x, t.y, '#E8590C'); sfx.honk('tipper'); }
          }
        });
      } else if(an.kind === 'full'){
        A.ang = Math.sin(u*TAU*3)*0.25; A.ext = 0.3;
      }
      if(an.t >= 1){ d.anim = null; A.ang = 0; A.ext = 0; A.curl = 0; A.full = false; }
    } else {
      A.ext = lerp(A.ext, 0, 1 - Math.exp(-dt*6)); A.ang = lerp(A.ang, 0, 1 - Math.exp(-dt*6));
      // the digger fills Tipper by itself whenever Tipper is parked next to it
      if(d.bucket > 0 && t.load < 3 && !t.anim && Math.hypot(t.x - d.x, t.y - d.y) < 175 && Math.abs(t.v) < 150){
        d.anim = {kind: 'load', t: 0, dur: 1.3, fired: {}, ang: wrapA(Math.atan2(t.y - d.y, t.x - d.x) - d.a)};
        sfx.scoop();
      }
    }
    // ----- tipper tray -----
    if(t.anim){
      const an = t.anim; an.t += dt/an.dur; const u = an.t;
      if(an.kind === 'tip'){
        t.tray = u < 0.3 ? ease(u/0.3) : u < 0.75 ? 1 : 1 - ease((u - 0.75)/0.25);
        const j = an.job;
        if(u > 0.3 && u < 0.75){
          const r = front(t, -66);
          if(Math.random() < dt*30) addPart({kind: 'dirt', x: r.x + rand(-14, 14), y: r.y + rand(-14, 14), vx: (j.at.x - r.x)*1.4 + rand(-30, 30), vy: (j.at.y - r.y)*1.4 + rand(-30, 30), vz: rand(60, 160), r: rand(5, 9), life: 0.6, col: pick(['#8B5A2B', '#A9713B', '#C08A52'])});
          t.load = Math.max(0, 3*(1 - seg(u, 0.3, 0.72)));
          if(j.type === 'fill') j.fill = Math.max(j.fill, seg(u, 0.35, 0.8));
          else j.heap = Math.max(j.heap, seg(u, 0.35, 0.8));
        }
        if(!an.fired.done && u >= 0.8){
          an.fired.done = true; t.load = 0;
          if(j.type === 'fill'){ j.fill = 1; j.filled = true; puff(j.at.x, j.at.y, 8, 'rgba(201,146,88,0.8)'); sfx.thud(); }
          else { j.heap = 1; j.tipped = true; j.bumps = sampleBumps([{x: j.at.x - 84, y: j.at.y}, {x: j.at.x + 84, y: j.at.y}], 42); sfx.thud(); }
          t.happy = 1.5; popWord('Tip!', t.x, t.y, '#E8590C');
        }
      } else if(an.kind === 'nope'){ t.tray = Math.sin(u*Math.PI*2)*0.18 + 0.1*Math.sin(u*Math.PI); }
      else if(an.kind === 'empty'){ t.tray = Math.sin(Math.min(1, u)*Math.PI); }
      if(an.t >= 1){ t.anim = null; t.tray = 0; }
    }
    ['dozer', 'rolla'].forEach(k => { const v = V[k]; if(v.anim){ v.anim.t += dt/v.anim.dur; if(v.anim.t >= 1) v.anim = null; } });
  }
  function armEnd(d){
    const A = d.arm, len = 38 + A.ext*60, lx = 20 + Math.cos(A.ang)*len, ly = 13 + Math.sin(A.ang)*len;
    return {x: d.x + Math.cos(d.a)*lx - Math.sin(d.a)*ly, y: d.y + Math.sin(d.a)*lx + Math.cos(d.a)*ly};
  }

  // ===== BULLDOZER PUSHING AND ROLLA ROLLING =====
  function updatePush(dt){
    const d = V.dozer, j = curJob();
    if(d.carry){
      const o = d.carry;
      if(active !== 'dozer'){ d.carry = null; }
      else {
        const tx = d.x + Math.cos(d.a)*(64 + o.r*0.9), ty = d.y + Math.sin(d.a)*(64 + o.r*0.9);
        const u = 1 - Math.exp(-dt*18); o.x = lerp(o.x, tx, u); o.y = lerp(o.y, ty, u);
        if(o.kind === 'log') o.a = d.a + Math.PI/2; else o.a += d.v*dt*0.02;
        if(d.v > 20 && Math.random() < dt*12) puff(o.x + rand(-20, 20), o.y + rand(-20, 20), 1, 'rgba(232,195,138,0.9)');
        const sp = o.job.spots.filter(s => !s.used).sort((a, b) => dist(a, o) - dist(b, o))[0];
        if(sp && dist(sp, o) < 100){ sp.used = true; o.placing = {fx: o.x, fy: o.y, sp, t: 0}; d.carry = null; sfx.whoosh(); }
      }
    } else if(active === 'dozer' && j && (j.type === 'road' || j.type === 'logs') && Math.abs(d.v) > 15){
      const bp = front(d, 62);
      const o = j.objs.find(q => !q.placed && !q.placing && Math.hypot(bp.x - q.x, bp.y - q.y) < q.r + 34);
      if(o){ d.carry = o; sfx.thunk(); popWord('Push!', d.x, d.y, '#E03131'); d.happy = 0.8; }
    }
    objs.forEach(o => {
      if(!o.placing) return;
      const p = o.placing; p.t += dt/0.45;
      const u = easeIO(p.t); o.x = lerp(p.fx, p.sp.x, u); o.y = lerp(p.fy, p.sp.y, u);
      if(o.kind === 'log') o.a = lerp(o.a, 0, u*0.3);
      if(p.t >= 1){ o.placing = null; o.placed = true; o.x = p.sp.x; o.y = p.sp.y; if(o.kind === 'log') o.a = 0; sparkles(o.x, o.y, 10); sfx.ding(); popWord('Yay!', o.x, o.y, '#7B4FD6'); V.dozer.happy = 1.2; }
    });
  }
  function updateRoll(dt){
    const r = V.rolla, j = curJob();
    jobs.forEach(q => { if(q.bumps) q.bumps.forEach(b => { if(b.sq > 0) b.sq = Math.max(0, b.sq - dt*2); }); });
    if(!j || !j.bumps || j.done) return;
    if(!(j.type === 'path' || (j.type === 'ramp' && j.tipped))) return;
    const dp = front(r, 44);
    j.bumps.forEach(b => {

        b.flat = true; b.sq = 1; sfx.squish(); puff(b.x, b.y, 3, 'rgba(232,195,138,0.9)'); r.happy = 0.5;
        if(Math.random() < 0.35) popWord(pick(['Squish!', 'Flat!', 'Smooth!']), b.x, b.y, '#2F9E44');
      }
    });
  }

  // ===== JOBS FINISHING: SOMETHING REAL GETS BUILT =====
  function checkJob(dt){
    const j = curJob();
    if(!j || party) return;
    if(jobWait > 0){ jobWait -= dt; if(jobWait <= 0) startJob(J + 1); return; }
    if(j.done) return;
    // pond fills up with water by itself once it's deep enough
    if(j.type === 'pond' && j.depth >= 4 && !V.digger.anim && j.water <= 0){ j.water = 0.001; sfx.splash(); }
    if(j.type === 'pond' && j.water > 0 && j.water < 1){ j.water = Math.min(1, j.water + dt*0.7); if(j.water >= 1) finishJob(j); return; }
    const before = S;
    while(S < steps.length && stepDone(steps[S], j)) S++;
    if(S >= steps.length){ if(j.type !== 'pond') finishJob(j); return; }
    if(S !== before) openBubble(true);

  function finishJob(j, instant){

    if(instant && j.objs){ j.objs.forEach((o, i) => { const sp = j.spots[i]; sp.used = true; o.x = sp.x; o.y = sp.y; o.placed = true; o.placing = null; if(o.kind === 'log') o.a = 0; }); }
    if(j.type === 'fill'){ j.fill = 1; j.filled = true; builds.push({type: 'house', x: j.at.x, y: j.at.y + 42, col: j.col, who: j.who, t: instant ? 1 : 0, inside: !!instant}); }

    if(j.type === 'pond'){ j.depth = 4; j.water = 1; heaps = heaps.filter(h => h.job !== j); for(let i = 0; i < 3; i++) ducks.push({job: j, i, ph: rand(0, TAU), r: rand(36, 70), sp: rand(0.25, 0.45)*(i % 2 ? 1 : -1), x: j.at.x, y: j.at.y, a: 0}); }
    if(j.type === 'logs'){ j.objs.forEach(o => { o.placed = true; o.gone = true; }); builds.push({type: 'cabin', x: j.at.x, y: j.at.y + 30, who: j.who, t: instant ? 1 : 0, inside: !!instant}); }
    if(j.type === 'ramp'){ j.heap = 1; j.tipped = true; if(j.bumps) j.bumps.forEach(b => b.flat = true); builds.push({type: 'ramp', x: j.at.x, y: j.at.y + 30, t: instant ? 1 : 0}); }
    if(instant) return;
    // celebrate!
    const cx = j.type === 'road' ? V[active].x : at.x, cy = j.type === 'road' ? road.c : at.y;
    confetti(cx, cy, 50); sparkles(cx, cy, 16); sfx.jingle(); setTimeout(() => sfx.build(), 450);
    lenny.joy = 3; popWord(pick(['Hooray!', 'Great job!', 'Woo-hoo!', 'You did it!']), lenny.x, lenny.y - 60, '#FF4F9A');
    VEH_ORDER.forEach(k => V[k].happy = 2.5);
    if(j.who){
      const b = builds[builds.length - 1];
      setTimeout(() => { if(!jobs.includes(j)) return; movers.push({kind: j.who, x: b.x + (L.mirror ? 200 : -200), y: b.y + 50, tx: b.x, ty: b.y + 4, b, ph: rand(0, 5)}); sfx.neigh(); }, 1400);
    }
    if(j.type === 'pond') setTimeout(() => { sfx.quack(); sfx.quack(0.5); }, 900);
    save(KEY + 'progress', {town, done: jobs.filter(q => q.done).length});

  }

  // ===== THE PARTY AT THE END =====
  function startParty(){

  function updateParty(dt){

  // ===== THE TOWN COMES ALIVE =====
  function updateLife(dt){
    if(road.built && road.t < 1){ road.t = Math.min(1, road.t + dt*0.6); }
    builds.forEach(b => { if(b.t < 1) b.t = Math.min(1, b.t + dt*1.6); });
    // baby unicorns trot to their new homes
    for(let i = movers.length - 1; i >= 0; i--){
      const m = movers[i], dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy);
      if(d < 6){ m.b.inside = true; hearts(m.b.x, m.b.y - 60, 6); sfx.giggle(); movers.splice(i, 1); continue; }
      const sp = 110; m.x += dx/d*Math.min(d, sp*dt); m.y += dy/d*Math.min(d, sp*dt); m.face = dx < 0 ? -1 : 1;
    }
    ducks.forEach(dk => { dk.ph += dk.sp*dt; const c = dk.job.at; const nx = c.x + Math.cos(dk.ph)*dk.r*1.2, ny = c.y + Math.sin(dk.ph)*dk.r*0.8; dk.a = Math.atan2(ny - dk.y, nx - dk.x); dk.x = nx; dk.y = ny; });
    // cars on the finished road (Australians drive on the left!)
    if(road.built && road.t >= 0.95 && cars.length < 4 && Math.random() < dt*0.5){
      const dirn = Math.random() < 0.5 ? 1 : -1;
      cars.push({u: dirn > 0 ? -80 : roadLen() + 80, dirn, sp: rand(110, 160), col: pick(['#4DABF7', '#FF6B6B', '#FFD43B', '#69DB7C', '#F783AC', '#9775FA']), honk: 0, wait: 0});
    }
    if(road.built && road.t >= 1){
      chomperWait -= dt;
      if(chomperWait <= 0 && !cars.some(c => c.chomper)){
        chomperWait = rand(18, 26);
        const dirn = Math.random() < 0.5 ? 1 : -1;
        cars.push({u: dirn > 0 ? -80 : roadLen() + 80, dirn, sp: 150, col: '#FFD8A8', chomper: true, honk: 0, wait: 0, honked: false});
      }
    }
    for(let i = cars.length - 1; i >= 0; i--){
      const c = cars[i];
      // stop for any vehicle sitting on the road ahead, and give a friendly beep
      const ahead = roadPos(c.u + c.dirn*70, c.dirn);
      const blocked = VEH_ORDER.some(k => Math.hypot(V[k].x - ahead.x, V[k].y - ahead.y) < 62) || cars.some(o => o !== c && o.dirn === c.dirn && (o.u - c.u)*c.dirn > 0 && Math.abs(o.u - c.u) < 70);
      if(blocked){ c.wait += dt; if(c.wait > 0.6 && !c.beeped){ c.beeped = true; c.honk = 0.6; if(onScreen(ahead.x, ahead.y)) hornAt([660, 830], 0, 0.12, 0.05); } }
      else { c.wait = 0; c.beeped = false; c.u += c.dirn*c.sp*dt; }
      c.honk = Math.max(0, c.honk - dt);
      const p = roadPos(c.u, c.dirn); c.x = p.x; c.y = p.y; c.a = p.a;
      if(c.chomper && !c.honked && onScreen(c.x, c.y, -60)){ c.honked = true; c.honk = 1; sfx.honk('tipper'); popWord('Beep beep!', c.x, c.y, '#7B4FD6'); }
      if(c.u < -120 || c.u > roadLen() + 120) cars.splice(i, 1);
    }
    // the pile slowly fills back up
    pile.size = Math.min(1, pile.size + dt*0.05);
    for(let i = tracks.length - 1; i >= 0; i--){ tracks[i].t += dt; if(tracks[i].t > 7) tracks.splice(i, 1); }
    // steam puffs from Rolla's chimney, smoke from house chimneys
    const r = V.rolla;
    r.steam -= dt; if(r.steam <= 0){ r.steam = r.v > 10 ? 0.25 : 0.8; const c = {x: r.x + Math.cos(r.a)*-22 - Math.sin(r.a)*18, y: r.y + Math.sin(r.a)*-22 + Math.cos(r.a)*18}; addPart({kind: 'steam', x: c.x, y: c.y, vx: rand(-10, 10), vy: rand(-40, -20), r: 7, life: 1.2, col: 'rgba(255,255,255,0.9)'}); }
    builds.forEach(b => { if((b.type === 'house' || b.type === 'cabin') && b.inside && Math.random() < dt*0.8) addPart({kind: 'steam', x: b.x + (b.type === 'house' ? 35 : -22), y: b.y - 130, vx: rand(5, 15), vy: rand(-35, -20), r: 6, life: 1.6, col: 'rgba(255,255,255,0.8)'}); });
    // Lenny walks to wherever the next job is
    const j = curJob();
    let tgt = party ? {x: cam.x, y: cam.y + 40} : j ? bossSpot(j) : {x: lenny.x, y: lenny.y};
    if(party){ const b = builds[0]; tgt = b ? {x: b.x + (L.mirror ? 130 : -130), y: b.y + 40} : tgt; }
    const dx = tgt.x - lenny.x, dy = tgt.y - lenny.y, d = Math.hypot(dx, dy);
    if(d > 4){ const sp = 300; lenny.x += dx/d*Math.min(d, sp*dt); lenny.y += dy/d*Math.min(d, sp*dt); lenny.walk += dt*12; lenny.face = dx < 0 ? -1 : 1; } else lenny.walk = 0;
    lenny.joy = Math.max(0, lenny.joy - dt);
  }
  function roadLen(){ return road.dir === 'h' ? WW : WH; }
  function roadPos(u, dirn){
    if(road.dir === 'h') return {x: u, y: road.c + (dirn > 0 ? -26 : 26), a: dirn > 0 ? 0 : Math.PI};
    return {x: road.c + (dirn > 0 ? 26 : -26), y: u, a: dirn > 0 ? Math.PI/2 : -Math.PI/2};
  }
  function onScreen(x, y, m = 0){ const X = sx(x), Y = sy(y); return X > -m && X < CW + m && Y > -m && Y < CH + m; }

  // ===== WHERE TO GO NEXT (the big glowing arrow) =====
  function stepTarget(){
    const j = curJob(), st = curStep();
    if(!j || !st || jobWait > 0 || party) return null;
    if(active !== st.veh){ const v = V[st.veh]; return {x: v.x, y: v.y, veh: st.veh}; }
    const v = V[active];
    switch(st.kind){
      case 'push': {
        if(V.dozer.carry){ const o = V.dozer.carry; const sp = j.spots.filter(s => !s.used).sort((a, b) => dist(a, o) - dist(b, o))[0]; return sp ? {x: sp.x, y: sp.y} : null; }
        const o = j.objs.filter(q => !q.placed && !q.placing).sort((a, b) => dist(a, v) - dist(b, v))[0];
        return o ? {x: o.x, y: o.y} : null;
      }
      case 'scoop': return {x: pile.x, y: pile.y, act: true};
      case 'load': return {x: V.digger.x, y: V.digger.y};
      case 'tip': return {x: j.at.x, y: j.at.y, act: true};
      case 'dig': return {x: j.at.x, y: j.at.y, act: true};
      case 'roll': { const b = j.bumps && j.bumps.find(q => !q.flat); return b ? {x: b.x, y: b.y} : null; }
    }
    return null;
  }
  let tgtNow = null, edgeArrow = null;
  function setNudge(on){ if(on !== nudgeOn){ nudgeOn = on; actBtn.classList.toggle('nudge', on); } }
  function updateHints(){
    tgtNow = stepTarget();
    // pulse the action button when you're in the right place but haven't pressed it yet
    let near = false;
    if(tgtNow && tgtNow.act && !tgtNow.veh){
      const v = V[active], st = curStep();
      if(st.kind === 'scoop') near = Math.hypot(v.x - pile.x, v.y - pile.y) < 170 && !V.digger.anim && V.digger.bucket < 3;
      else near = Math.hypot(v.x - tgtNow.x, v.y - tgtNow.y) < 185 && !v.anim;
    }
    setNudge(near && clock - lastAct > 1.6 && Math.abs(V[active].v) < 80);

        <button class="go" id="goBtn">🏗️ New site</button>
        <button class="ghost" id="noBtn">Keep this one</button>
      </div>`, true);
    $('goBtn').addEventListener('click', () => { newTown(town + 1, true); hidePanel(); });
    $('noBtn').addEventListener('click', () => { if(party && party.shown) party.closed = true; hidePanel(); if(!was) playing = true; });
  }
  function newTown(n, announce){
    town = n;
    makeTown(town);
    save(KEY + 'progress', {town, done: 0});
    active = 'dozer'; setActIcon();
    newBtn.hidden = true;
    startJob(0);
    updateCam(0, true);
    if(announce){ sfx.babble(); }
  }

  // ===== SIZE AND MAIN LOOP =====
  function resize(){
    const r = board.getBoundingClientRect();
    CW = Math.max(100, r.width); CH = Math.max(100, r.height);
    PX = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(CW*PX); cvs.height = Math.round(CH*PX);
    updateCam(0, false);
  }
  new ResizeObserver(resize).observe(board);
  addEventListener('resize', resize);

  let last = performance.now();
  function loop(t){
    const dt = Math.min(0.05, (t - last)/1000); last = t;
    clock += dt;
    if(bubble.open){ bubble.t += dt; bubble.pop += dt; if(bubble.t > 7 && playing) bubble.open = false; }
    if(playing){
      updateVehicles(dt); updateAnims(dt); updatePush(dt); updateRoll(dt); checkJob(dt);
    }
    updateLife(dt); updateParty(dt); updateParts(dt);
    if(!camLock) updateCam(dt); else Object.assign(cam, camLock);
    updateHints();
    if(eng){ const v = V[active]; engineSet(active, playing ? clamp(Math.abs(v.v)/MAXV[active], 0, 1) + (v.anim ? 0.35 : 0) : -1); }
    draw();
    requestAnimationFrame(loop);
  }

  // ===== START =====
  const saved = load(KEY + 'progress', null);
  town = saved && Number.isFinite(saved.town) ? saved.town : 0;
  makeTown(town);
  const doneN = saved ? clamp(saved.done | 0, 0, jobs.length) : 0;
  for(let i = 0; i < doneN; i++) finishJob(jobs[i], true);
  if(doneN >= jobs.length){ finished = true; newBtn.hidden = false; J = jobs.length; steps = []; jobs.forEach(j => { if(j.who){ const b = builds.find(q => q.who === j.who); if(b) b.inside = true; } }); }
  else startJob(doneN);
  // start in the vehicle the first job needs
  const st0 = curStep(); active = st0 ? st0.veh : 'dozer';
  setActIcon(); updateHud();
  resize(); updateCam(0, true);
  if(saved && doneN > 0 && doneN < jobs.length){ lenny.x = bossSpot(curJob()).x; lenny.y = bossSpot(curJob()).y; }
  showStart();
  requestAnimationFrame(loop);

  // a small helper for automatic testing only (switched on by adding ?test to the address)
  if(/[?&]test\b/.test(location.search)) window.__bbs = {
    get state(){ return {town, J, S, active, step: curStep() && curStep().kind, need: curStep() && curStep().veh, jobs: jobs.map(j => ({type: j.type, done: j.done})), finished, party: !!party, bucket: V.digger.bucket, load: V.tipper.load, playing}; },
    V: () => V, jobs: () => jobs, target: () => stepTarget(), pile: () => pile,
    drive(x, y){ goTo = boundsPt({x, y}); }, act: doAction, jumpIn, place(k, x, y, a){ Object.assign(V[k], {x, y, a: a === undefined ? V[k].a : a}); },
    cam: () => cam, lockCam(c){ camLock = c; }, finish(i){ finishJob(jobs[i], true); }, start(i){ startJob(i); }, closeBubble(){ bubble.open = false; }, hideBoss(h){ hideBoss = h; }
  };
})();
</script>
</body>
</html>
