<style>
  :root{

  [hidden]{display:none!important}
  html,body{height:100%}

    /* fill the screen exactly, keeping clear of notches and rounded corners */
    height:100vh;height:100dvh;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));

  .wrap{max-width:1200px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}

  /* short screens (phone on its side): everything on one row, no title - the game gets the space */
  @media (max-height:520px){
    h1{display:none}
    .stats{order:2;margin-right:auto}
    .snd{margin-left:0}

  /* the train line fills whatever space is left over */
  .stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
  .board{position:relative;width:100cqw;height:min(100cqh,100cqw*1.05);border-radius:18px;overflow:hidden;background:#BFE6FF;box-shadow:0 10px 30px #5A2FA033;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
  canvas{display:block;width:100%;height:100%;touch-action:none}

    background:#FFC23D;color:#5A2FA0;box-shadow:0 5px 0 #D9901A;display:grid;place-items:center;touch-action:none;
    font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;font-size:23px;line-height:1}

  @keyframes tootpulse{to{transform:scale(1.13)}}
  @media (prefers-reduced-motion: reduce){ .toot.pulse{animation:none;outline:4px solid var(--purple)} }
  @media (max-height:520px), (max-width:420px){ .toot{width:70px;height:70px;font-size:19px;right:8px;bottom:8px} .toot i{font-size:19px} }
  .overlay{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:#2F2350A6;padding:12px;cursor:default}
  .panel{background:#fff;border-radius:18px;padding:14px 16px;text-align:center;max-width:390px;width:100%;max-height:100%;box-sizing:border-box;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px}

  @media (max-height:520px){

    .levels{grid-template-columns:repeat(8,1fr);gap:4px}

<script>
(() => {
  // ===== SETUP =====
  const $ = id => document.getElementById(id);
  const cvs = $('c');
  const ctx = cvs.getContext('2d');
  const board = $('board');
  const overlay = $('overlay');
  const ovTitle = $('ovTitle'), ovStars = $('ovStars'), ovBig = $('ovBig'), ovText = $('ovText'), ovKey = $('ovKey'), ovBtn = $('ovBtn');
  const levelsEl = $('levels');
  const tootBtn = $('toot');
  const soundBtn = $('sound'), musicBtn = $('music');
  const lvlEl = $('lvl'), stopsEl = $('stops'), scoreEl = $('score'), bestEl = $('best');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"Chewy","Comic Sans MS",cursive';
  const TAU = Math.PI*2;

  // The game world is at least 900 wide and 480 tall; the extra space on any screen shape becomes more sky or more track.
  let W = 900, H = 480, TY = 340;      // TY = the top of the rails
  let SC = 1, PX = 1, CW = 900, CH = 480; // SC = screen pixels per world unit, PX = canvas pixels per screen pixel
  let camX = 0;
  const KEY = 'lrg-chompers-choo-choo-';

  const rand = (a, b) => a + Math.random()*(b - a);
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // the same "random" numbers every time, so the scenery doesn't jump about
  function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
  function shade(hex, f){
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
    if(f < 0){ r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r)*f; g += (255 - g)*f; b += (255 - b)*f; }
    return 'rgb(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ')';
  }
  function rr(g, x, y, w, h, r){
    r = Math.max(0, Math.min(r, w/2, h/2));
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function ell(g, x, y, rx, ry, rot){ g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
  function line(g, x1, y1, x2, y2){ g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  function poly(g, pts){ g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }

  function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  // ===== THE TRAIN =====
  // Everything on the train is measured from the middle of the first carriage's door (trainX).
  const CAR = 200, GAP = 16, CAR2 = -(CAR + GAP);   // carriage length, gap, and where carriage 2's middle is
  const LOCO_FRONT = 356;                             // the front of the cowcatcher
  const SEATS = [-76, -40, 40, 76, CAR2 - 76, CAR2 - 40, CAR2 + 40, CAR2 + 76];
  const CARS = [{x: 0, body: '#69DB7C', roof: '#2F9E44'}, {x: CAR2, body: '#F783AC', roof: '#D6336C'}];
  const ACC = 75, DEC = 95;                           // speeding up (holding) and slowing down (let go)
  const O = '#2F2350';                                // outline colour

  // ===== THE LINES (levels) =====
  const THEMES = [
    {id: 'meadow', line: 'Meadow Line', emoji: '🌼', sky: ['#7CCBFF', '#DDF3FF'], back: '#94D46E', ground: '#7CC957', far: '#B2E08E', farD: '#8CCB6B', roof: '#FF6B6B', shift: 0,
      animals: ['cow', 'cow', 'sheep'], start: 'Chomperville', term: 'Meadow Junction',
      names: ['Daisy Dell', 'Buttercup Farm', 'Muddy Puddles', 'Haystack Hill', 'Clover Corner', 'Duckpond']},
    {id: 'mountain', line: 'Mountain Line', emoji: '⛰️', sky: ['#8FB8FF', '#E8F0FF'], back: '#8CC46C', ground: '#86C466', far: '#B7ACE0', farD: '#8D80C4', roof: '#4DABF7', shift: 2,
      animals: ['sheep', 'cow', 'sheep'], start: 'Foothill Halt', term: 'Summit Central',
      names: ['Pebble Peak', 'Echo Valley', 'Boulder Bend', 'Goat Rock', 'Tumbling Falls', 'Pinecone Pass']},
    {id: 'sea', line: 'Seaside Line', emoji: '🏖️', sky: ['#6FD0FF', '#FFF2D1'], back: '#FFE3A3', ground: '#FFDA8F', far: '#4FC7E0', farD: '#1C9DBF', roof: '#FF922B', shift: 5,
      animals: ['cow', 'sheep'], start: 'Harbour Halt', term: 'Lighthouse Terminus',
      names: ['Shell Beach', 'Sandcastle Stop', 'Seagull Point', 'Rockpool Bay', 'Starfish Sands', 'Ice Cream Corner']},
    {id: 'snow', line: 'Snowy Line', emoji: '❄️', sky: ['#A9CBEF', '#F2F7FF'], back: '#F4F8FF', ground: '#FFFFFF', far: '#E4EEFA', farD: '#C8DAF0', roof: '#9775FA', shift: -3,
      animals: ['sheep', 'sheep', 'cow'], start: 'Cosy Cottage', term: 'Jingle Junction',
      names: ['Snowball Stop', 'Frosty Fields', 'Icicle Halt', 'Sledging Slope', 'Mitten Meadow', 'Snowman Siding']}
  ];
  const LEVELS = 8;
  const lineName = L => THEMES[(L - 1) % 4].line.replace('Line', L > 4 ? 'Express' : 'Line');
  const TRIKE_COLS = ['#6BD49A', '#74C0FC', '#FFB86B', '#F783AC'];
  const STEGO_COLS = ['#FFA94D', '#B197FC', '#63E6BE', '#FFD43B'];
  const PTERO_COLS = ['#FF8FB1', '#74C0FC', '#B197FC'];
  const CONF_COLS = ['#FF6B6B', '#FFA94D', '#FFD43B', '#69DB7C', '#4DABF7', '#9775FA', '#F783AC'];

  function makeLevel(L){
    const T = THEMES[(L - 1) % 4], ex = L > 4, r = rng(L*7919 + 13);
    const rp = a => a[Math.floor(r()*a.length)];
    const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r()*(i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const n = Math.min(5, 2 + Math.ceil(L/2));               // stations between the start and the terminus
    const okay = 90 - (L - 1)*5;                              // how far off still counts as a stop (shorter platforms later)
    const good = 36 - (L - 1)*2, perfect = 12 - Math.floor((L - 1)/2);
    const nAnimals = [1, 1, 2, 2, 3, 3, 4, 4][L - 1];
    const names = shuffle(T.names.slice());
    const segs = n + 1;
    const animalSegs = new Set(shuffle([...Array(segs).keys()].filter(i => L > 1 || i > 0)).slice(0, nAnimals));
    const pteroAt = new Set(shuffle([...Array(n).keys()].map(i => i + 1)).slice(0, L <= 2 ? 1 : 2));
    const friend = () => r() < 0.5 ? {type: 'trike', col: rp(TRIKE_COLS)} : {type: 'stego', col: rp(STEGO_COLS)};
    const stations = [{x: 0, name: T.start, start: true, wait: [{type: 'trike', col: TRIKE_COLS[0]}, {type: 'stego', col: STEGO_COLS[0]}]}];
    const animals = [], tunnels = [];
    let x = 0;
    for(let s = 0; s < segs; s++){
      let cursor = x + LOCO_FRONT + 450;
      if(T.id === 'mountain'){ const tl = 460 + r()*260; tunnels.push({x0: cursor, x1: cursor + tl}); cursor += tl + 380; }
      if(animalSegs.has(s)){
        const ax = cursor + 350 + r()*250;
        animals.push({x: ax, kind: rp(T.animals), state: 'stand', t: 0, dx: 0, dy: 0, sc: 1, waitT: 0, seed: r()*9});
        cursor = ax + 200;
      }
      x = Math.max(x + 1700 + r()*500 + (ex ? 200 : 0), cursor + 520);
      if(s < n){
        const cnt = 1 + Math.floor(r()*2) + (r() < 0.3 ? 1 : 0);
        stations.push({x, name: names[s % names.length], wait: Array.from({length: cnt}, friend), ptero: pteroAt.has(s + 1)});
      } else {
        stations.push({x, name: T.term, term: true, wait: []});
      }
    }
    return {L, T, ex, n, okay, good, perfect, stations, animals, tunnels, end: x};
  }

  // ===== SAVED STUFF =====
  let best = load(KEY + 'best', 0)|0;
  let starsSaved = load(KEY + 'stars', []);
  if(!Array.isArray(starsSaved)) starsSaved = [];
  let unlocked = clamp(load(KEY + 'unlocked', 0)|0, 0, LEVELS - 1);   // highest line you can pick (0 = line 1)
  let muted = load(KEY + 'muted', false);
  let musicOn = load(KEY + 'music', true);
  let selected = unlocked + 1;       // the line picked on the panel
  let lastPlayed = 0;

  // ===== GAME STATE =====
  let lv = null, level = 1;
  let mode = 'intro';                // intro, board, drive, oops, reverse, finale, done
  let clock = 0, trainX = 0, v = 0, si = 0, lastChuff = 0, idleT = 1;
  let runScore = 0, levelPts = 0, graded = 0, perfects = 0, carried = 0, newBest = false;
  let seats = new Array(8).fill(null);
  let walkers = [], puffs = [], parts = [], words = [], flakes = [];
  let msg = null, hint = '', bd = null, finaleT = 0, beepT = 0, tootCd = 0, doorOpen = 0, blocked = false, animalNear = false;
  let starsNow = 0;
  const ch = {x: 0, y: 0, vx: 0, vy: 0, face: 1, walk: 0, moving: false, bumpT: 0, roarT: 0, happyT: 0, blinkT: 3, blink: 0, celebrate: false};
  const pointers = new Set(), keysDown = new Set();
  const holding = () => pointers.size > 0 || keysDown.size > 0;

  // ===== SOUND AND MUSIC (all made in the browser, no sound files needed) =====
  let actx = null, master, sfxBus, musicBus, noiseBuf;

  function audio(){
    if(actx) return actx;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
      sfxBus = actx.createGain(); sfxBus.connect(master);
      musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.35 : 0; musicBus.connect(master);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    } catch(e){ actx = null; }
    return actx;
  }
  function wake(){ if(audio() && actx.state === 'suspended') actx.resume(); }

  function tone(f, dur, type = 'sine', vol = 0.18, f2 = null, delay = 0, bus = null){
    if(!audio()) return;
    const t0 = actx.currentTime + Math.max(0, delay);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(bus || sfxBus); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  // a burst of filtered hiss (used for chuffs, steam and drums)
  function noise(t0, dur, filterType, freq, q, vol, attack, bus, freq2){
    if(!audio()) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = actx.createBiquadFilter(); fl.type = filterType; fl.frequency.setValueAtTime(freq, t0); fl.Q.value = q;
    if(freq2) fl.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl).connect(g).connect(bus || sfxBus);
    src.start(t0, Math.random()*0.5); src.stop(t0 + dur + 0.05);
  }
  // the steam whistle: three notes together with a little wobble, plus a breathy hiss
  function whistle(delay, dur, vol = 0.06){
    if(!audio()) return;
    const t = actx.currentTime + delay;
    const g = actx.createGain(), lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 3200;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.05);
    g.gain.setValueAtTime(vol, t + dur - 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g).connect(sfxBus);
    const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 6; vg.gain.value = 5; vib.connect(vg);
    [587, 740, 880].forEach(f => {
      const o = actx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(f*0.93, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.08);
      vg.connect(o.frequency); o.connect(lp); o.start(t); o.stop(t + dur + 0.02);
    });
    vib.start(t); vib.stop(t + dur + 0.02);
    noise(t, dur, 'bandpass', 2400, 1.2, vol*0.5, 0.04);
  }

  const sfx = {
    chuff(k){
      if(!audio()) return;
      const t = actx.currentTime, loud = 0.3 + 0.7*k;
      noise(t, 0.13 + 0.05*(1 - k), 'bandpass', 1000 + 500*k, 0.8, 0.13*loud, 0.006, null, 500);
      noise(t, 0.08, 'highpass', 4000, 0.7, 0.03*loud, 0.004);
      tone(95, 0.08, 'sine', 0.1*loud, 50);
    },
    hiss(){ if(audio()) noise(actx.currentTime, 0.7, 'highpass', 3000, 0.7, 0.025, 0.12); },
    toot(){ whistle(0, 0.5); whistle(0.58, 0.28, 0.05); },
    allAboard(){ whistle(0, 0.22, 0.05); whistle(0.3, 0.55, 0.06); },
    beep(){ tone(1050, 0.16, 'square', 0.045); },
    // a funny "wah wah wah waaah"
    oops(){
      if(!audio()) return;
      [392, 370, 349, 330].forEach((f, i) => {
        const t = actx.currentTime + i*0.28, d = i === 3 ? 0.75 : 0.24;
        const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t);
        if(i === 3){ const l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = 7; lg.gain.value = 9; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + d); }
        lp.type = 'lowpass'; lp.frequency.value = 1100;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(lp).connect(g).connect(sfxBus); o.start(t); o.stop(t + d + 0.02);
      });
    },
    perfect(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, null, i*0.08)); tone(2093, 0.6, 'sine', 0.07, null, 0.34); sfx.cheer(0.05); },
    good(){ tone(659, 0.18, 'triangle', 0.15); tone(880, 0.35, 'triangle', 0.15, null, 0.12); },
    okay(){ tone(587, 0.18, 'triangle', 0.13); tone(698, 0.3, 'triangle', 0.13, null, 0.12); },
    chime(){ tone(988, 0.5, 'sine', 0.12); tone(784, 0.7, 'sine', 0.12, null, 0.28); },
    hop(i){ tone(420 + i*60, 0.14, 'triangle', 0.09, 820 + i*80); },
    flap(){ if(audio()) noise(actx.currentTime, 0.12, 'lowpass', 700, 0.7, 0.06, 0.01); },
    moo(){
      if(!audio()) return;
      const t = actx.currentTime;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(900, t + 0.3); lp.frequency.linearRampToValueAtTime(450, t + 0.9);
      const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.12); g.gain.setValueAtTime(0.16, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 1);
      lp.connect(g).connect(sfxBus);
      [0, 3].forEach(det => { const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(135 + det, t); o.frequency.linearRampToValueAtTime(155 + det, t + 0.25); o.frequency.exponentialRampToValueAtTime(110 + det, t + 1); o.connect(lp); o.start(t); o.stop(t + 1.05); });
    },
    baa(){
      if(!audio()) return;
      const t = actx.currentTime;
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.2;
      const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      const am = actx.createOscillator(), amg = actx.createGain(); am.frequency.value = 15; amg.gain.value = 0.12; am.connect(amg).connect(g.gain);
      const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(390, t); o.frequency.linearRampToValueAtTime(350, t + 0.6);
      o.connect(bp).connect(g).connect(sfxBus); o.start(t); o.stop(t + 0.62); am.start(t); am.stop(t + 0.62);
    },
    clip(){ [0, 0.13, 0.26, 0.39].forEach((d, i) => tone(i % 2 ? 700 : 900, 0.05, 'sine', 0.12, null, d)); },
    cheer(vol = 0.06){ if(!audio()) return; const t = actx.currentTime; noise(t, 1.1, 'bandpass', 1500, 0.6, vol, 0.25); noise(t + 0.05, 0.9, 'bandpass', 2600, 1, vol*0.6, 0.2); },
    star(){ [659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'triangle', 0.15, null, i*0.09)); tone(1568, 0.6, 'sine', 0.08, null, 0.36); },
    fanfare(){
      [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i === 7 ? 0.7 : 0.16, 'triangle', 0.15, null, [0, 0.14, 0.28, 0.42, 0.62, 0.82, 0.96, 1.12][i]));
      [262, 330, 392].forEach(f => tone(f, 1.2, 'triangle', 0.06, null, 1.12));
      sfx.cheer(0.07);
    },
    go(){ tone(523, 0.12, 'triangle', 0.15); tone(784, 0.25, 'triangle', 0.16, null, 0.12); }
  };

  // ----- background music: a bouncy "chugga-chugga" train tune that loops -----
  // each line plays it in a different key
  const ROOTS = [48, 53, 55, 48, 48, 45, 53, 55];   // C, F, G, C, C, Am, F, G
  const MELODY = [
    72,0,76,0,79,0,76,0,   77,0,81,0,77,76,74,0,
    74,0,79,0,77,0,74,0,   72,76,79,84,79,0,0,0,
    76,0,76,77,79,0,76,0,  81,0,79,76,72,0,76,0,
    77,0,76,74,72,0,69,0,  74,0,71,0,67,0,0,0
  ];
  const hz = m => 440*Math.pow(2, (m - 69)/12);
  let bpm = 128, mNext = 0, mStep = 0, mTimer = null;
  const stepLen = () => 60/bpm/2;

  function playStep(i, t){
    const bar = Math.floor(i/8), beat = i % 8, sh = lv ? lv.T.shift : 0, root = ROOTS[bar] + sh, d = t - actx.currentTime, S = stepLen();
    // bouncy bass: oom ... pah
    if(beat === 0 || beat === 4) tone(hz(root - 12 + (beat === 4 ? 7 : 0)), S*1.6, 'triangle', 0.28, null, d, musicBus);
    // little chord stabs on the off-beats
    if(beat === 2 || beat === 6) [0, ROOTS[bar] === 45 ? 3 : 4, 7].forEach(n => tone(hz(root + 12 + n), 0.09, 'square', 0.018, null, d, musicBus));
    // the tune
    const m = MELODY[i];
    if(m){ tone(hz(m + sh), S*1.4, 'square', 0.026, null, d, musicBus); tone(hz(m + sh), S*1.8, 'triangle', 0.07, null, d, musicBus); }
    // drums: kick, snare, and a "chugga-chugga" shaker on every step
    if(beat === 0 || beat === 4) tone(110, 0.14, 'sine', 0.3, 42, d, musicBus);
    if(beat === 2 || beat === 6) noise(t, 0.1, 'bandpass', 1900, 0.8, 0.08, 0.003, musicBus);
    noise(t, 0.05, 'highpass', 6000, 0.7, beat % 2 ? 0.02 : 0.035, 0.003, musicBus);
  }
  function scheduleMusic(){
    if(!actx || actx.state !== 'running') return;
    if(mNext < actx.currentTime - 0.1) mNext = actx.currentTime + 0.05;
    while(mNext < actx.currentTime + 0.25){
      playStep(mStep, mNext);
      mNext += stepLen(); mStep = (mStep + 1) % 64;
    }
  }
  function startMusic(){
    if(!audio() || mTimer) return;
    mNext = actx.currentTime + 0.1; mStep = 0;
    mTimer = setInterval(scheduleMusic, 50);
  }

  // pause the sound when the page is hidden (and let go of the "hold")
  document.addEventListener('visibilitychange', () => {
    pointers.clear(); keysDown.clear();
    if(!actx) return;
    if(document.hidden) actx.suspend(); else actx.resume();
  });
  addEventListener('blur', () => { pointers.clear(); keysDown.clear(); });

  function setSoundBtn(){
    soundBtn.textContent = muted ? '🔇' : '🔊'; soundBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
    musicBtn.textContent = musicOn ? '🎵 On' : '🎵 Off'; musicBtn.setAttribute('aria-label', musicOn ? 'Music on' : 'Music off');
    if(actx){
      master.gain.setValueAtTime(muted ? 0 : 1, actx.currentTime);
      musicBus.gain.cancelScheduledValues(actx.currentTime);
      musicBus.gain.setValueAtTime(musicOn ? 0.35 : 0, actx.currentTime);
    }
  }
  soundBtn.addEventListener('click', () => { muted = !muted; save(KEY + 'muted', muted); wake(); startMusic(); setSoundBtn(); soundBtn.blur(); });
  musicBtn.addEventListener('click', () => { musicOn = !musicOn; save(KEY + 'music', musicOn); wake(); startMusic(); setSoundBtn(); musicBtn.blur(); });
  setSoundBtn();

  // ===== STARTING A LINE =====
  function startLevel(L, keepScore){
    level = L; lastPlayed = L;
    lv = makeLevel(L);
    if(!keepScore) runScore = 0;
    trainX = 0; v = 0; si = 0; levelPts = 0; graded = 0; perfects = 0; carried = 0; newBest = false;
    seats = new Array(8).fill(null);
    walkers = []; puffs = []; parts = []; words = []; msg = null; hint = ''; doorOpen = 0; finaleT = 0;
    ch.face = 1; ch.celebrate = false; ch.happyT = 1.2;
    setupWaiting();
    makeFlakes();
    overlay.hidden = true;
    mode = 'board';
    beginBoard(0);
    say(lineName(L) + '!', '#7B4FD6');
    sfx.go();
    updateHud();
  }
  // put the waiting dinosaur friends on every platform
  function setupWaiting(){
    walkers = [];
    lv.stations.forEach((st, i) => {
      const spots = [-290, -225, -150, -80, -10].filter(o => o <= lv.okay - 30);
      st.wait.forEach((f, k) => {
        const off = spots[Math.round(k*(spots.length - 1)/Math.max(1, st.wait.length - 1))] + (k*37 % 20) - 10;
        walkers.push({type: f.type, col: f.col, st: i, x: st.x + (st.wait.length === 1 ? -150 : off), y: 0, phase: 'wait', t: rand(0, 3), face: 1, alpha: 1, sc: 1, wave: 0, bob: 0});
      });
    });
  }
  function makeFlakes(){
    flakes = [];
    if(lv.T.id !== 'snow') return;
    for(let i = 0; i < (reduced ? 25 : 70); i++) flakes.push({x: rand(0, 1600), y: rand(0, 900), r: rand(1.5, 4), s: rand(20, 55), w: rand(0, TAU)});
  }

  // ===== STOPPING AT A STATION =====
  function doGrade(err, backed){
    const st = lv.stations[si];
    const a = Math.abs(err || 0);
    let pts = 0, add = 10, text = '', col = '#7B4FD6';
    if(backed){ pts = 0; add = 10; text = 'Phew! Backed up!'; col = '#4DABF7'; sfx.okay(); }
    else if(a <= lv.perfect){ pts = 3; add = 100; text = 'PERFECT STOP!'; col = '#FF4F9A'; perfects++; sfx.perfect(); ch.happyT = 2; sparkleBurst(trainX, TY - 60, 26); }
    else if(a <= lv.good){ pts = 2; add = 60; text = 'Good stop!'; col = '#2FB344'; sfx.good(); ch.happyT = 1.4; sparkleBurst(trainX, TY - 60, 10); }
    else { pts = 1; add = 30; text = 'Okay stop!'; col = '#F08C00'; sfx.okay(); ch.happyT = 0.8; }
    levelPts += pts; graded++;
    runScore += add;
    say(text, col);
    pop('+' + add, trainX, TY - 150, '#FFB000');
    updateHud();
    mode = 'board';
    beginBoard(si);
  }

  function beginBoard(i){
    const st = lv.stations[i];
    const waiting = walkers.filter(w => w.st === i && w.phase === 'wait');
    const need = waiting.length + (st.ptero ? 1 : 0);
    const seated = seats.map((p, k) => p ? k : -1).filter(k => k >= 0).sort((a, b) => seats[a].since - seats[b].since);
    const free = 8 - seated.length;
    const leavers = st.term ? seated : seated.slice(0, Math.max(0, need - free));
    // friends waiting on the platform go to whichever door is nearer
    waiting.sort((a, b) => Math.abs(a.x - trainX) - Math.abs(b.x - trainX));
    bd = {i, st, t: 0, leavers, joiners: waiting, lDone: 0, jStarted: 0, ptero: st.ptero ? 'due' : 'none', closing: 0};
    if(i > 0) sfx.chime();
  }

  function doorOf(seatIdx){ return trainX + (seatIdx < 4 ? 0 : CAR2); }

  function updateBoard(dt){
    const b = bd, platY = TY + 30;
    b.t += dt;
    if(!b.closing) doorOpen = Math.min(1, doorOpen + dt/0.4);
    // friends getting off (the oldest passengers, or everyone at the terminus)
    const leaveStart = 0.45;
    while(b.lDone < b.leavers.length && b.t > leaveStart + b.lDone*0.3){
      const k = b.leavers[b.lDone++], p = seats[k];
      if(!p) continue;
      seats[k] = null;
      const dx = doorOf(k);
      walkers.push({type: p.type, col: p.col, st: -1, x: dx, y: -42, phase: 'out', t: 0, face: b.st.term ? (b.lDone % 2 ? 1 : -1) : (dx < trainX - 100 ? -1 : 1), alpha: 1, sc: 1, wave: 1, bob: 0,
        cheerX: dx + (b.lDone % 2 ? 1 : -1)*(30 + b.lDone*22)});
      sfx.hop(b.lDone);
    }
    // friends getting on
    const joinStart = leaveStart + b.leavers.length*0.3 + 0.25;
    while(b.jStarted < b.joiners.length && b.t > joinStart + b.jStarted*0.35){
      const w = b.joiners[b.jStarted++];
      const d0 = trainX, d1 = trainX + CAR2;
      w.door = Math.abs(w.x - d0) <= Math.abs(w.x - d1) ? 0 : 1;
      w.phase = 'toDoor'; w.t = 0;
    }
    // the pterodactyl who is always late
    if(b.ptero === 'due' && b.t > joinStart + 0.6){
      b.ptero = 'flying';
      const col = pick(PTERO_COLS);
      walkers.push({type: 'ptero', col, st: -2, x: camX + W + 80, y: -(TY - 60), phase: 'fly', t: 0, face: -1, alpha: 1, sc: 1, wave: 0, bob: 0,
        fromX: camX + W + 80, fromY: -(TY - 60), door: 0, flapT: 0, say: 1.8});
      pop('Wait for me!', camX + W - 150, TY - 250, '#FF4F9A');
    }
    const busy = walkers.some(w => w.phase === 'toDoor' || w.phase === 'hopIn' || w.phase === 'fly' || w.phase === 'out');
    const allIn = b.jStarted >= b.joiners.length && b.lDone >= b.leavers.length && b.ptero !== 'due';
    if(!b.closing && allIn && !busy && b.t > 1.3){
      if(b.st.term){ startFinale(); return; }
      b.closing = 0.01;
    }
    if(b.closing){
      b.closing += dt;
      doorOpen = Math.max(0, doorOpen - dt/0.35);
      if(b.closing > 0.55){
        bd = null; doorOpen = 0;
        si = b.i + 1;
        mode = 'drive';
        sfx.allAboard(); ch.roarT = 0.5; whistleSteam();
        say('All aboard!', '#7B4FD6');
        updateHud();
      }
    }
    void platY;
  }

  function startFinale(){
    mode = 'finale'; finaleT = 0; ch.celebrate = true; ch.happyT = 99;
    runScore += 50;
    pop('+50', trainX + 150, TY - 170, '#FFB000');
    sfx.fanfare();
    say('Hooray! ' + lv.stations[si].name + '!', '#FF4F9A');
    confetti(reduced ? 40 : 140);
    updateHud();
  }

  function finishLevel(){
    mode = 'done';
    const max = 3*graded;
    const ratio = max ? levelPts/max : 1;
    starsNow = ratio >= 0.8 ? 3 : ratio >= 0.5 ? 2 : 1;
    starsSaved[level - 1] = Math.max(starsSaved[level - 1] || 0, starsNow); save(KEY + 'stars', starsSaved);
    if(level < LEVELS && unlocked < level){ unlocked = level; save(KEY + 'unlocked', unlocked); }
    if(runScore > best){ best = runScore; newBest = true; save(KEY + 'best', best); }
    selected = Math.min(LEVELS, level + 1);
    sfx.star();
    updateHud();
    showPanel('done');
  }

  // ===== TOOTING =====
  function toot(){
    if(mode === 'intro' || mode === 'done' || tootCd > 0) return;
    tootCd = 0.75;
    wake(); startMusic();
    sfx.toot(); ch.roarT = 0.7;
    whistleSteam();
    pop('TOOT TOOT!', trainX + 230, TY - 190, '#FF8A3D');
    const front = trainX + LOCO_FRONT;
    let shooed = 0;
    lv.animals.forEach(a => {
      if(!onTrack(a)) return;
      const gap = a.x - front;
      if(gap > -60 && gap < 1300){
        a.state = 'trot'; a.t = 0; shooed++;
        runScore += 20;
        pop(a.kind === 'cow' ? 'Moo-ve along!' : 'Baa-bye!', a.x, TY - 120, '#2FB344');
        pop('+20', a.x, TY - 160, '#FFB000');
        setTimeout(() => { a.kind === 'cow' ? sfx.moo() : sfx.baa(); sfx.clip(); }, 250);
      }
    });
    if(shooed) updateHud();
    // friends on the platform love a toot
    walkers.forEach(w => { if(w.phase === 'wait') w.wave = 1.2; });
    seats.forEach(p => { if(p) p.wave = 1.2; });
  }
  tootBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); tootBtn.classList.add('down'); toot(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => tootBtn.addEventListener(t, () => tootBtn.classList.remove('down')));
  tootBtn.addEventListener('click', e => { if(e.detail === 0) toot(); tootBtn.blur(); });

  function onTrack(a){
    if(a.state === 'stand') return true;
    if(a.state === 'amble') return a.t < 2.2;
    if(a.state === 'trot') return a.t < 0.35;
    return false;
  }

  // ===== EFFECTS =====
  function say(text, col){ msg = {text, col, t: 0}; }
  function pop(text, x, y, col, screen){ words.push({text, x, y, col, t: 0, life: 1.4, screen: !!screen}); }
  function puff(x, y, r, vx, vy, life){ puffs.push({x, y, r, vx, vy, life, t: 0}); }
  function whistleSteam(){ for(let i = 0; i < 6; i++) puff(trainX + 206 + rand(-3, 3), TY - 108, rand(5, 9), rand(-15, 15), rand(-120, -70), rand(0.5, 0.9)); }
  function sparkleBurst(x, y, n){
    for(let i = 0; i < (reduced ? Math.ceil(n/3) : n); i++){
      const a = rand(0, TAU), s = rand(80, 260);
      parts.push({type: 'star', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 120, rot: rand(0, TAU), vr: rand(-6, 6), life: rand(0.8, 1.3), col: pick(['#FFE066', '#FF9ACB', '#FFFFFF'])});
    }
  }
  function confetti(n){
    for(let i = 0; i < n; i++){
      parts.push({type: 'conf', x: camX + rand(0, W), y: rand(-200, -20), vx: rand(-60, 60), vy: rand(40, 180), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(3, 5), col: pick(CONF_COLS)});
    }
  }

  // ===== THE MAIN UPDATE =====
  function update(dt){
    clock += dt;
    tootCd = Math.max(0, tootCd - dt);
    // Chomper's little animations
    ch.bumpT = Math.max(0, ch.bumpT - dt); ch.roarT = Math.max(0, ch.roarT - dt); ch.happyT = Math.max(0, ch.happyT - dt);
    ch.blinkT -= dt; if(ch.blinkT <= 0){ ch.blink = 0.13; ch.blinkT = rand(2, 5); }
    ch.blink = Math.max(0, ch.blink - dt);
    if(msg){ msg.t += dt; if(msg.t > 2.2 && mode !== 'finale') msg = null; }
    hint = '';
    blocked = false;

    if(mode === 'board') updateBoard(dt);
    else if(mode === 'drive') updateDrive(dt);
    else if(mode === 'oops'){
      v = Math.max(0, v - 170*dt); trainX += v*dt;
      if(v === 0){ mode = 'reverse'; beepT = 0; ch.face = -1; }
    } else if(mode === 'reverse'){

  function updateDrive(dt){
    const st = lv.stations[si];
    const front = trainX + LOCO_FRONT;

    let near = null, gap = 1e9;
    lv.animals.forEach(a => { if(!onTrack(a)) return; const g = a.x - 56 - front; if(g > -20 && g < gap){ gap = g; near = a; } });
    let bDec = 0;
    if(near){
      const stopPt = gap - 24;
      if(stopPt <= 0){ v = 0; blocked = true; }
      else if(v > 0){ const need = v*v/(2*stopPt); if(need > DEC*0.75){ blocked = true; bDec = Math.max(DEC*0.75, need); } }
      if(v === 0 && gap < 260){

        if(near.state === 'stand' && near.waitT > 0.8){
          near.state = 'amble'; near.t = 0;
          near.kind === 'cow' ? sfx.moo() : sfx.baa();

  function updateWalkers(dt){

        const st = lv.stations[w.st];
        const excited = mode === 'drive' && si === w.st && trainX - st.x > -800;
        w.bob = excited ? Math.abs(Math.sin(w.t*7))*10 : Math.abs(Math.sin(w.t*2))*2;

  // copied from Chomper's Car Crunch so he looks just the same
  const PU = '#A47BF0', PD = '#8A60DC', TUM = '#EEE2FF', PL = '#FF9ACB', OC = '#5A2FA0';
  function leg(x, lift, col){
    ctx.lineWidth = 4; ctx.strokeStyle = OC; ctx.fillStyle = col;
    rr(ctx, x - 7, -26 - lift, 14, 24, 6); ctx.stroke(); ctx.fill();
    ell(ctx, x + 5, -4 - lift, 13, 6.5); ctx.stroke(); ctx.fill();
    ctx.fillStyle = '#F6EEFF';
    [8, 12.5, 17].forEach(dx => { ell(ctx, x + dx, -4 - lift, 2.2, 2.2); ctx.fill(); });
    ell(ctx, x + 1, -26 - lift*0.4, 13, 14); ctx.stroke(); ctx.fillStyle = col; ctx.fill();
  }
  function drawChomper(){
    const c = ch, S = 1.1;
    const moving = false;
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.fillStyle = 'rgba(50,25,80,0.22)'; ell(ctx, 0, 2, 44, 13); ctx.fill();
    ctx.scale(c.face*S, S);
    let sx = 1, sy = 1;
    if(c.bumpT > 0){ const u = c.bumpT/0.25; sx = 1 + 0.14*u; sy = 1 - 0.12*u; }
    const roarU = c.roarT > 0 ? Math.sin(clamp(1.1 - c.roarT, 0, 1)*Math.PI) : 0;
    sx *= 1 + 0.06*roarU; sy *= 1 + 0.12*roarU;
    if(c.celebrate){ sy *= 1 + Math.abs(Math.sin(clock*8))*0.06; }
    ctx.scale(sx, sy);
    const sw = Math.sin(c.walk), l1 = moving ? Math.max(0, sw)*10 : 0, l2 = moving ? Math.max(0, -sw)*10 : 0;
    const bob = moving ? -Math.abs(sw)*4 : Math.sin(clock*2.4)*1.2;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    leg(-12, l2, PD);                           // back leg
    ctx.save(); ctx.translate(0, bob);
    const wag = Math.sin(clock*(moving ? 9 : 3))*5;
    // pink back plates, peeking out from behind
    ctx.fillStyle = PL; ctx.strokeStyle = OC; ctx.lineWidth = 2.5;
    [[-52, -38, 6], [-38, -50, 8], [-24, -62, 9], [-8, -70, 9], [6, -99, 7], [21, -102, 7]].forEach(([x, y, r]) => { ell(ctx, x, y, r, r); ctx.fill(); ctx.stroke(); });
    // tail, body and head: outline first, then fill, so they join up smoothly
    const shapes = [
      () => { ctx.beginPath(); ctx.moveTo(-20, -54); ctx.quadraticCurveTo(-58, -48, -80, -24 + wag); ctx.quadraticCurveTo(-56, -22, -16, -24); ctx.closePath(); },
      () => ell(ctx, 0, -42, 30, 29),
      () => ell(ctx, 18, -77, 28, 25),
      () => ell(ctx, 40, -68, 21, 15)
    ];
    ctx.lineWidth = 6; ctx.strokeStyle = OC; shapes.forEach(f => { f(); ctx.stroke(); });
    ctx.fillStyle = PU; shapes.forEach(f => { f(); ctx.fill(); });
    // lighter tummy with little stripes
    ctx.fillStyle = TUM; ell(ctx, 10, -38, 17, 21); ctx.fill();
    ctx.strokeStyle = 'rgba(164,123,240,0.35)'; ctx.lineWidth = 2;
    [-46, -36, -26].forEach(y => { ctx.beginPath(); ctx.moveTo(1, y); ctx.quadraticCurveTo(10, y + 3, 20, y); ctx.stroke(); });
    // freckle spots
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    [[-15, -48, 4], [-7, -58, 3], [-40, -34, 3], [8, -92, 3]].forEach(([x, y, r]) => { ell(ctx, x, y, r, r); ctx.fill(); });
    ctx.restore();
    leg(8, l1, PU);                             // front leg
    ctx.save(); ctx.translate(0, bob);
    // tiny arms (waving when happy)
    ctx.save(); ctx.translate(24, -46);
    ctx.rotate(c.happyT > 0 || roarU > 0 ? -0.7 + Math.sin(clock*22)*0.5 : 0.35 + (moving ? sw*0.25 : 0));
    ctx.strokeStyle = OC; ctx.lineWidth = 11; line(ctx, 0, 0, 13, 3);
    ctx.strokeStyle = PU; ctx.lineWidth = 6.5; line(ctx, 0, 0, 13, 3);
    ctx.fillStyle = '#fff'; ell(ctx, 17, 1, 2.3, 2.3); ctx.fill(); ell(ctx, 16, 6, 2.3, 2.3); ctx.fill();
    ctx.restore();
    // eyes
    const roaring = c.roarT > 0.15;
    const happy = c.happyT > 0 || roaring || c.celebrate;
    [[13, -85], [31, -86]].forEach(([x, y]) => {
      if(happy){
        ctx.strokeStyle = '#2B1B45'; ctx.lineWidth = 3.4;
        ctx.beginPath(); ctx.arc(x, y + 4, 6.5, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
      } else {
        const ey = c.blink > 0 ? 0.15 : 1;
        ctx.fillStyle = '#fff'; ell(ctx, x, y, 8.5, 10.5*ey); ctx.fill();
        ctx.strokeStyle = OC; ctx.lineWidth = 2.2; ctx.stroke();
        if(ey > 0.5){
          ctx.fillStyle = '#2B1B45'; ell(ctx, x + 2, y + 1.5, 5.3, 6.2); ctx.fill();
          ctx.fillStyle = '#fff'; ell(ctx, x + 3.8, y - 2, 2.1, 2.1); ctx.fill(); ell(ctx, x + 0.5, y + 4, 1.1, 1.1); ctx.fill();
        }
      }
    });
    // nose and rosy cheek
    ctx.fillStyle = OC; ell(ctx, 53, -74, 1.9, 1.5); ctx.fill(); ell(ctx, 57.5, -71, 1.7, 1.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,180,0.55)'; ell(ctx, 40, -61, 6.5, 3.8); ctx.fill();
    // mouth: a big grin, or a wide-open roar (a big TOOT here)
    if(roaring){
      const o = clamp(roarU*1.3, 0.35, 1);
      ctx.fillStyle = '#5B1F4F'; ell(ctx, 47, -60, 12, 10*o); ctx.fill(); ctx.strokeStyle = OC; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#FF7FAE'; ell(ctx, 47, -60 + 5*o, 7, 3.5*o); ctx.fill();
      ctx.fillStyle = '#fff'; ell(ctx, 41, -60 - 8*o, 2.3, 2.8); ctx.fill(); ell(ctx, 53, -60 - 8*o, 2.3, 2.8); ctx.fill();
    } else {
      ctx.fillStyle = '#6B2A63';
      ctx.beginPath(); ctx.moveTo(32, -63); ctx.quadraticCurveTo(46, -49, 58, -62); ctx.quadraticCurveTo(46, -57, 32, -63); ctx.fill();
      ctx.strokeStyle = OC; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(31, -63); ctx.quadraticCurveTo(46, -49, 59, -63); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(49, -58.5); ctx.lineTo(53, -59.5); ctx.lineTo(51.5, -55.5); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  }

  // ===== DRAWING THE DINOSAUR FRIENDS (all facing right, feet at 0,0) =====
  function eye(x, y, s){
    ctx.fillStyle = '#fff'; ell(ctx, x, y, 4.6*s, 5.6*s); ctx.fill(); ctx.strokeStyle = O; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.fillStyle = '#2B1B45'; ell(ctx, x + 1.2*s, y + 0.8*s, 2.9*s, 3.5*s); ctx.fill();
    ctx.fillStyle = '#fff'; ell(ctx, x + 2*s, y - 1*s, 1.2*s, 1.2*s); ctx.fill();
  }
  function smile(x, y, w){ ctx.strokeStyle = O; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - w*0.6, w, Math.PI*0.2, Math.PI*0.8); ctx.stroke(); }
  function drawTrike(col, walk){
    const D = shade(col, -0.18);
    ctx.lineJoin = 'round'; ctx.strokeStyle = O; ctx.lineWidth = 2.5;
    const l = Math.sin(walk)*3;
    [[-12, l], [-4, -l], [8, -l], [15, l]].forEach(([x, dl], k) => { ctx.fillStyle = k % 2 ? col : D; rr(ctx, x - 4, -12 - Math.max(0, dl), 9, 12, 3); ctx.fill(); ctx.stroke(); });
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(-16, -22); ctx.quadraticCurveTo(-30, -18, -34, -8); ctx.quadraticCurveTo(-24, -11, -14, -12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ell(ctx, 0, -20, 21, 14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = shade(col, 0.45); ell(ctx, 2, -14, 12, 6); ctx.fill();
    // frill with spots
    ctx.fillStyle = '#FF922B'; ell(ctx, 15, -32, 15, 14); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFD43B'; [[6, -40], [14, -44], [22, -42], [6, -30]].forEach(([x, y]) => { ell(ctx, x, y, 2.4, 2.4); ctx.fill(); });
    // head and horns
    ctx.fillStyle = col; ell(ctx, 26, -24, 13, 11); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFF4D6'; ctx.lineWidth = 2;
    poly(ctx, [[23, -33], [27, -46], [30, -33]]); ctx.fill(); ctx.stroke();
    poly(ctx, [[35, -29], [43, -35], [38, -25]]); ctx.fill(); ctx.stroke();
    eye(28, -26, 1);
    smile(31, -18, 5);
    ctx.fillStyle = 'rgba(255,120,180,0.5)'; ell(ctx, 22, -19, 4, 2.5); ctx.fill();
  }
  function drawStego(col, walk, suitcase){
    const D = shade(col, -0.18);
    ctx.lineJoin = 'round'; ctx.strokeStyle = O; ctx.lineWidth = 2.5;
    const l = Math.sin(walk)*3;
    [[-16, l], [-6, -l], [10, -l], [19, l]].forEach(([x, dl], k) => { ctx.fillStyle = k % 2 ? col : D; rr(ctx, x - 5, -14 - Math.max(0, dl), 10, 14, 3); ctx.fill(); ctx.stroke(); });
    // tail with spikes
    ctx.fillStyle = '#FFF4D6'; ctx.lineWidth = 2;
    poly(ctx, [[-44, -18], [-50, -30], [-40, -20]]); ctx.fill(); ctx.stroke();
    poly(ctx, [[-50, -14], [-60, -20], [-48, -12]]); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(-22, -30); ctx.quadraticCurveTo(-42, -22, -54, -12); ctx.quadraticCurveTo(-38, -12, -20, -16); ctx.closePath(); ctx.fill(); ctx.stroke();
    // back plates
    [[-18, -36], [-6, -42], [7, -42], [18, -36]].forEach(([x, y], k) => { ctx.fillStyle = k % 2 ? '#FF8787' : '#FFD43B'; poly(ctx, [[x - 7, y + 6], [x, y - 12], [x + 7, y + 6]]); ctx.fill(); ctx.stroke(); });
    ctx.fillStyle = col; ell(ctx, 0, -24, 27, 16); ctx.fill(); ctx.stroke();
    ctx.fillStyle = shade(col, 0.45); ell(ctx, 3, -16, 16, 6); ctx.fill();
    // neck and little head
    ctx.fillStyle = col; ell(ctx, 30, -18, 12, 9); ctx.fill(); ctx.stroke();
    eye(32, -21, 0.85);
    smile(36, -14, 4);
    if(suitcase){
      // a red suitcase, held by its handle
      ctx.strokeStyle = O; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(46, -12, 5, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#E8504F'; rr(ctx, 35, -12, 22, 15, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFD43B'; ell(ctx, 41, -5, 3, 3); ctx.fill(); ctx.fillStyle = '#74C0FC'; ctx.fillRect(47, -8, 6, 5);
    }
  }
  function drawPtero(col, flap, flying){
    const D = shade(col, -0.2);
    ctx.lineJoin = 'round'; ctx.strokeStyle = O; ctx.lineWidth = 2.5;
    if(flying){
      const f = Math.sin(flap*14);
      ctx.fillStyle = D;
      ctx.beginPath(); ctx.moveTo(-2, -24); ctx.quadraticCurveTo(-26, -34 - f*18, -44, -26 - f*30); ctx.quadraticCurveTo(-26, -18, -4, -16); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.strokeStyle = O; ctx.lineWidth = 3; line(ctx, -3, -8, -4, 0); line(ctx, 4, -8, 5, 0);
    }
    ctx.fillStyle = col; ctx.strokeStyle = O; ctx.lineWidth = 2.5;
    ell(ctx, 0, -18, 10, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = shade(col, 0.5); ell(ctx, 3, -14, 5, 7); ctx.fill();
    if(flying){
      const f = Math.sin(flap*14);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(2, -24); ctx.quadraticCurveTo(24, -38 - f*20, 38, -30 - f*32); ctx.quadraticCurveTo(22, -20, 4, -16); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = D; ctx.beginPath(); ctx.moveTo(-6, -26); ctx.quadraticCurveTo(-14, -14, -6, -6); ctx.quadraticCurveTo(-2, -16, -6, -26); ctx.fill(); ctx.stroke();
    }
    // head with a crest and a long beak
    ctx.fillStyle = col;
    poly(ctx, [[2, -38], [-14, -46], [0, -32]]); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFC23D'; poly(ctx, [[12, -38], [32, -32], [12, -29]]); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; ell(ctx, 7, -34, 9, 8); ctx.fill(); ctx.stroke();
    eye(9, -36, 0.8);
  }
  function drawFriend(type, col, walk, extra, flying){
    if(type === 'trike') drawTrike(col, walk);
    else if(type === 'stego') drawStego(col, walk, true);
    else drawPtero(col, walk, flying);
    void extra;
  }
  // a friend sitting inside a carriage window: we draw the whole dinosaur and the window only shows their head
  function drawFriendInWindow(p, wx, wy){
    const s = 0.85;
    const head = p.type === 'trike' ? [26, -24] : p.type === 'stego' ? [30, -18] : [8, -34];
    ctx.save(); ctx.translate(wx - head[0]*s, wy - head[1]*s); ctx.scale(s, s);
    if(p.type === 'trike') drawTrike(p.col, 0); else if(p.type === 'stego') drawStego(p.col, 0, false); else drawPtero(p.col, 0, false);
    ctx.restore();
  }

  function drawWalkers(){
    const list = walkers.slice().sort((a, b) => a.y - b.y);
    list.forEach(w => {
      const x = w.x - camX;
      if(x < -90 || x > W + 90) return;
      const y = TY + 30 + w.y - w.bob;
      ctx.save(); ctx.globalAlpha = w.alpha;
      if(w.phase !== 'fly'){ ctx.fillStyle = 'rgba(50,25,80,0.18)'; ell(ctx, x, TY + 31, 20, 5); ctx.fill(); }
      ctx.translate(x, y); ctx.scale(w.face*w.sc, w.sc);
      const walking = w.phase === 'toDoor' || w.phase === 'leave' || w.phase === 'cheer';
      drawFriend(w.type, w.col, walking ? w.t*12 : 0, null, w.phase === 'fly');
      ctx.restore();
      if(w.wave > 0 && w.phase !== 'fly' && w.phase !== 'hopIn'){
        const hx = x + w.face*(w.type === 'stego' ? 12 : 10), hy = y - (w.type === 'ptero' ? 30 : 30);
        waveHand(w.col, hx, hy, w.wave);
      }
    });
  }

  // ===== COWS AND SHEEP (facing the train, so they're drawn facing left) =====
  function drawCow(munch){
    ctx.lineJoin = 'round'; ctx.strokeStyle = O; ctx.lineWidth = 3;
    [-30, -18, 18, 30].forEach(x => { ctx.fillStyle = '#fff'; rr(ctx, x - 5, -26, 10, 26, 3); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#3B3355'; ctx.fillRect(x - 4, -6, 8, 5); });
    ctx.strokeStyle = O; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-40, -52); ctx.quadraticCurveTo(-52, -40, -48, -22); ctx.stroke();
    ctx.fillStyle = '#3B3355'; ell(ctx, -48, -20, 4, 6); ctx.fill();
    ctx.fillStyle = '#fff'; rr(ctx, -42, -62, 84, 40, 18); ctx.fill(); ctx.stroke();
    ctx.save(); rr(ctx, -42, -62, 84, 40, 18); ctx.clip();
    ctx.fillStyle = '#3B3355'; ell(ctx, -18, -50, 13, 10); ctx.fill(); ell(ctx, 16, -34, 11, 9); ctx.fill(); ell(ctx, 34, -58, 8, 6); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#FFB3C7'; ell(ctx, 8, -22, 8, 5); ctx.fill();
    // head, going down to munch now and then
    const hy = munch*10;
    ctx.save(); ctx.translate(0, hy);
    ctx.fillStyle = '#E8E0D0'; ctx.strokeStyle = O; ctx.lineWidth = 2.5;
    poly(ctx, [[36, -72], [30, -84], [42, -76]]); ctx.fill(); ctx.stroke();
    poly(ctx, [[54, -74], [58, -86], [48, -76]]); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.lineWidth = 3; rr(ctx, 32, -76, 28, 32, 11); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFB3C7'; ell(ctx, 50, -48, 14, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#C2587A'; ell(ctx, 46, -48, 2, 2.5); ctx.fill(); ell(ctx, 55, -48, 2, 2.5); ctx.fill();
    eye(40, -64, 0.9); eye(52, -65, 0.9);
    ctx.fillStyle = '#FFD43B'; ctx.strokeStyle = O; ctx.lineWidth = 2; ell(ctx, 38, -38, 6, 6); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function drawSheep(munch){
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#2F2350'; ctx.lineWidth = 4;
    [-18, -8, 10, 20].forEach(x => line(ctx, x, -24, x, 0));
    ctx.fillStyle = '#F8F4EC'; ctx.strokeStyle = O; ctx.lineWidth = 2.5;
    const puffsXY = [[-24, -38], [-10, -48], [8, -48], [22, -38], [-16, -28], [2, -26], [18, -28], [0, -38]];
    puffsXY.forEach(([x, y]) => { ell(ctx, x, y, 14, 13); ctx.stroke(); });
    puffsXY.forEach(([x, y]) => { ell(ctx, x, y, 14, 13); ctx.fill(); });
    ctx.save(); ctx.translate(0, munch*10);
    ctx.fillStyle = '#3B3355'; ell(ctx, 36, -44, 11, 13); ctx.fill();
    ell(ctx, 26, -48, 7, 3.5, -0.4); ctx.fill();
    ctx.fillStyle = '#F8F4EC'; [[30, -56], [37, -59], [43, -55]].forEach(([x, y]) => { ell(ctx, x, y, 5, 5); ctx.fill(); });
    eye(37, -46, 0.75); eye(44, -45, 0.6);
    ctx.fillStyle = '#FFB3C7'; ell(ctx, 42, -36, 3, 2); ctx.fill();
    ctx.restore();
  }
  function drawAnimals(front){
    lv.animals.forEach(a => {
      const inFront = a.dy > 0;
      if(inFront !== front) return;
      const x = a.x + a.dx - camX;
      if(x < -120 || x > W + 120) return;
      const munch = a.state === 'stand' || a.state.startsWith('off') ? Math.max(0, Math.sin(clock*1.3 + a.seed))**6 : 0;
      ctx.save();
      ctx.fillStyle = 'rgba(50,25,80,0.18)'; ell(ctx, x, TY + a.dy + 1, 40*a.sc, 7*a.sc); ctx.fill();
      ctx.translate(x, TY + a.dy - (a.hop || 0)); ctx.scale(-a.sc, a.sc);
      if(a.kind === 'cow') drawCow(munch); else drawSheep(munch);
      ctx.restore();
    });
  }

  // ===== STEAM, SPARKLES, CONFETTI =====
  function drawPuffs(){
    puffs.forEach(p => {
      const u = p.t/p.life;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.85*(1 - u)) + ')';
      ell(ctx, p.x - camX, p.y, p.r, p.r); ctx.fill();
    });
  }
  function star5(g, x, y, r, col){
    g.fillStyle = col; g.beginPath();
    for(let i = 0; i < 10; i++){ const rad = i % 2 ? r*0.45 : r, t = -Math.PI/2 + i*Math.PI/5; g.lineTo(x + Math.cos(t)*rad, y + Math.sin(t)*rad); }
    g.closePath(); g.fill();
  }
  function drawParts(){
    parts.forEach(p => {
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life*2));
      ctx.translate(p.x - camX, p.y); ctx.rotate(p.rot);
      if(p.type === 'star') star5(ctx, 0, 0, 9, p.col);
      else { ctx.fillStyle = p.col; ctx.fillRect(-6, -3, 12, 6); }
      ctx.restore();
    });
  }
  function drawFlakes(){
    if(!flakes.length) return;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    flakes.forEach(f => { const x = f.x*W/1600, y = f.y*H/900; ell(ctx, x, y, f.r, f.r); ctx.fill(); });
  }

  // ===== THE HUD (drawn in screen pixels so it stays readable on every screen) =====
  function hudText(text, x, y, size, col, stroke){
    ctx.font = size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    if(stroke){ ctx.lineWidth = Math.max(4, size/5); ctx.strokeStyle = stroke; ctx.strokeText(text, x, y); }
    ctx.fillStyle = col; ctx.fillText(text, x, y);
  }
  function drawHud(){
    ctx.setTransform(PX, 0, 0, PX, 0, 0);
    const k = CH < 300 ? 0.82 : 1;
    // the line map along the top: stations, the train, and the terminus flag
    const mw = Math.min(460, CW*0.56), mx = CW/2 - mw/2, my = 16*k;
    const endX = lv.end;
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; rr(ctx, mx - 12, my - 9*k, mw + 24, 18*k, 9*k); ctx.fill();
    ctx.fillStyle = '#C9B8F0'; rr(ctx, mx, my - 2.5, mw, 5, 2.5); ctx.fill();
    const prog = clamp(trainX/endX, 0, 1);
    ctx.fillStyle = '#7B4FD6'; rr(ctx, mx, my - 2.5, mw*prog, 5, 2.5); ctx.fill();
    lv.stations.forEach((st, i) => {
      const x = mx + mw*st.x/endX;
      if(st.term){ hudText('🏁', x, my - 1, 16*k, '#000'); return; }
      const done = i < si || (i === si && (mode === 'board' || mode === 'finale'));
      const next = i === si && mode === 'drive';
      ctx.fillStyle = done ? '#2FB344' : next ? '#FFC23D' : '#fff';
      ctx.strokeStyle = O; ctx.lineWidth = 2;
      const r = (next ? 6 + Math.sin(clock*7) : 5)*k;
      ell(ctx, x, my, r, r); ctx.fill(); ctx.stroke();
    });
    // the little train on the map
    const tx = mx + mw*prog;
    ctx.fillStyle = '#FF5A5F'; ctx.strokeStyle = O; ctx.lineWidth = 2;
    rr(ctx, tx - 9*k, my - 8*k, 18*k, 10*k, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3B3355'; ctx.fillRect(tx + 3*k, my - 13*k, 4*k, 5*k);

    // next stop, with a helper bar that shows how close the door is to the STOP sign
    if(mode === 'drive' || mode === 'oops' || mode === 'reverse'){
      const st = lv.stations[si];
      const err = trainX - st.x;
      const pw = Math.min(300, CW - 40), px = CW/2 - pw/2, py = my + 14*k;
      const showBar = err > -520;
      const ph = (showBar ? 50 : 26)*k;
      ctx.fillStyle = 'rgba(255,255,255,0.88)'; rr(ctx, px, py, pw, ph, 10); ctx.fill();
      ctx.font = '800 ' + Math.round(14*k) + 'px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#2F2350';
      ctx.fillText((st.term ? 'Last stop: ' : 'Next stop: ') + st.name, CW/2, py + 13*k);
      if(showBar){
        const bw = pw - 50, bx = CW/2 - bw/2, by = py + 35*k, range = 300;
        const sc = (bw/2)/range;
        ctx.fillStyle = '#EDE6FA'; rr(ctx, bx, by - 5*k, bw, 10*k, 5*k); ctx.fill();
        ctx.fillStyle = '#FFE8A3'; ctx.fillRect(CW/2 - lv.okay*sc, by - 5*k, lv.okay*2*sc, 10*k);
        ctx.fillStyle = '#B2F2BB'; ctx.fillRect(CW/2 - lv.good*sc, by - 5*k, lv.good*2*sc, 10*k);
        ctx.fillStyle = '#E8504F'; ctx.fillRect(CW/2 - 1.5, by - 8*k, 3, 16*k);
        if(!lv.ex && mode === 'drive' && v > 0){
          const pe = clamp(err + v*v/(2*DEC), -range, range);
          ctx.strokeStyle = 'rgba(123,79,214,0.6)'; ctx.lineWidth = 2;
          poly(ctx, [[CW/2 + pe*sc - 6, by - 14*k], [CW/2 + pe*sc + 6, by - 14*k], [CW/2 + pe*sc, by - 5*k]]); ctx.stroke();
        }
        const de = clamp(err, -range, range);
        ctx.fillStyle = Math.abs(err) <= lv.good ? '#2FB344' : Math.abs(err) <= lv.okay ? '#F08C00' : '#7B4FD6';
        ctx.strokeStyle = O; ctx.lineWidth = 2;
        poly(ctx, [[CW/2 + de*sc - 8, by - 16*k], [CW/2 + de*sc + 8, by - 16*k], [CW/2 + de*sc, by - 3*k]]); ctx.fill(); ctx.stroke();
      }
    }
    // an animal is on the track ahead, off the edge of the screen
    lv.animals.forEach(a => {
      if(!onTrack(a) || mode !== 'drive') return;
      const sx = (a.x - camX)*SC;
      if(sx < CW + 20 || a.x - (trainX + LOCO_FRONT) > 1500) return;
      const y = (TY - 60)*SC, b = Math.sin(clock*8)*3;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#FF4F9A'; ctx.lineWidth = 3;
      rr(ctx, CW - 92, y - 22 + b, 80, 40, 14); ctx.fill(); ctx.stroke();
      hudText((a.kind === 'cow' ? '🐄' : '🐑') + ' ▶', CW - 52, y - 2 + b, 20, '#FF4F9A');
    });

    // big messages, hints and popping words
    const msgY = Math.max(64*k + 26, ((TY - 140)*SC + 76*k)/2);
    if(msg){
      const s = reduced ? 1 : Math.min(1, msg.t*5)*(1 + 0.15*Math.max(0, 1 - msg.t*3));
      const fade = mode === 'finale' ? 1 : Math.max(0, Math.min(1, (2.2 - msg.t)*4));
      const size = Math.min(52, CW/12);
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(CW/2, msgY); ctx.scale(s, s); ctx.rotate(-0.04);
      hudText(msg.text, 0, 0, size, msg.col, '#fff');
      ctx.restore();
    }
    if(hint && mode !== 'intro'){
      const hy = msg ? msgY + Math.min(52, CW/12)*0.9 : msgY;
      ctx.font = '800 ' + Math.round(15*k) + 'px Nunito, system-ui, sans-serif';
      const tw = ctx.measureText(hint).width + 26;
      ctx.fillStyle = 'rgba(47,35,80,0.78)'; rr(ctx, CW/2 - tw/2, hy - 15*k, tw, 30*k, 15*k); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(hint, CW/2, hy + 1);
    }
    words.forEach(w => {
      const u = w.t/w.life;
      const pop = reduced ? 1 : w.t < 0.12 ? 0.3 + w.t/0.12*0.8 : 1;
      const alpha = u > 0.7 ? Math.max(0, (1 - u)/0.3) : 1;
      const x = w.screen ? w.x*SC : (w.x - camX)*SC, y = (w.y - w.t*30)*SC;
      const size = Math.max(16, Math.min(28, 26*SC));
      ctx.font = size + 'px ' + FONT;
      const tw = ctx.measureText(w.text).width;
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(clamp(x, tw/2 + 8, CW - tw/2 - 8), clamp(y, 30, CH - 20)); ctx.scale(pop, pop);
      hudText(w.text, 0, 0, size, w.col, 'rgba(47,35,80,0.9)');
      ctx.restore();
    });
  }

  function draw(){
    if(!lv) return;
    camX = trainX - Math.max(330, W*0.3);
    ctx.setTransform(cvs.width/W, 0, 0, cvs.height/H, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawFar();
    drawMid();
    drawTunnelsBack();
    lv.stations.forEach(drawStationBack);
    drawAnimals(false);
    drawTrack();
    drawTrain();
    drawTunnelsFront();
    drawPuffs();
    lv.stations.forEach(drawPlatform);
    drawWalkers();
    drawAnimals(true);
    drawParts();
    drawFlakes();
    drawHud();
  }

  // ===== HUD PILLS AND PANELS =====
  function updateHud(){
    lvlEl.textContent = '🚂 Line ' + level;
    const total = lv ? lv.stations.length - 1 : 4;
    stopsEl.textContent = '🚉 ' + graded + '/' + total;
    stopsEl.setAttribute('aria-label', 'Stations stopped at: ' + graded + ' of ' + total);
    scoreEl.textContent = '⭐ ' + runScore;
    bestEl.textContent = '🏆 Best: ' + best;
  }
  function buildLevels(){
    levelsEl.innerHTML = '';
    for(let L = 1; L <= LEVELS; L++){
      const T = THEMES[(L - 1) % 4], b = document.createElement('button');
      const locked = L - 1 > unlocked, s = starsSaved[L - 1] || 0;
      b.type = 'button'; b.disabled = locked;
      b.innerHTML = '<b>' + (locked ? '🔒' : T.emoji) + '</b>' + L + '<small>' + (s ? '★'.repeat(s) + '☆'.repeat(3 - s) : '&nbsp;') + '</small>';
      b.setAttribute('aria-label', 'Line ' + L + ': ' + lineName(L) + (locked ? ' (locked)' : s ? ', ' + s + ' stars' : ''));
      b.setAttribute('aria-pressed', L === selected ? 'true' : 'false');
      b.addEventListener('click', () => { selected = L; buildLevels(); setPlayText(); previewLevel(); });
      levelsEl.appendChild(b);
    }
  }
  function setPlayText(){
    ovBtn.textContent = mode === 'done' && selected === lastPlayed + 1 ? 'Next line: ' + lineName(selected) + ' ▶' : 'Play ' + lineName(selected) + ' ▶';
  }
  function buildKey(){
    const rows = [['👆 Hold anywhere', 'go faster'], ['✋ Let go', 'slow down'], ['⌨️ Space / →', 'go (keyboard)'], ['📯 TOOT / T', 'shoo cows and sheep']];
    ovKey.innerHTML = rows.map(r => '<span>' + r[0] + '</span><span>' + r[1] + '</span>').join('');
  }
  function showPanel(kind){
    buildLevels();
    if(kind === 'done'){
      const s = starsNow;
      ovTitle.textContent = 'Hooray! ' + lineName(level) + ' done!';
      ovStars.hidden = false; ovStars.textContent = '★'.repeat(s) + '☆'.repeat(3 - s);
      ovStars.setAttribute('aria-label', s + ' stars out of 3');
      ovBig.hidden = false; ovBig.textContent = (newBest ? '🏆 New best! ' : '') + 'Score: ' + runScore;
      ovText.textContent = 'Perfect stops: ' + perfects + ' of ' + graded + '  ·  Friends carried: ' + carried + (level === LEVELS ? '  ·  You drove every line - you are a super train driver!' : '');
    } else {
      ovTitle.textContent = 'All aboard!';
      ovStars.hidden = true; ovBig.hidden = true;
      ovText.textContent = 'Chomper is driving the train! Hold anywhere to go faster, let go to slow down. Stop so the carriage door lines up with the STOP sign to pick up dinosaur friends. Toot to shoo cows off the track!';
    }
    setPlayText();
    overlay.hidden = false;
    setTimeout(() => { try { ovBtn.focus({preventScroll: true}); } catch(e){} }, 50);
  }
  ovBtn.addEventListener('click', () => {
    wake(); startMusic();
    const keep = mode === 'done' && selected === lastPlayed + 1;
    startLevel(selected, keep);
  });
  // show the picked line's scenery behind the panel
  function previewLevel(){
    if(mode !== 'intro') return;
    level = selected; lv = makeLevel(selected); trainX = 0; v = 0; si = 0;
    seats = new Array(8).fill(null); setupWaiting(); makeFlakes(); updateHud();
  }

  // ===== CONTROLS =====
  board.addEventListener('pointerdown', e => {
    if(overlay.contains(e.target) || e.target.closest('button')) return;
    pointers.add(e.pointerId);
    try { board.setPointerCapture(e.pointerId); } catch(err){}
    wake(); startMusic();
    e.preventDefault();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => board.addEventListener(t, e => pointers.delete(e.pointerId)));
  board.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if(!overlay.hidden){
      if(e.code === 'Enter' || e.code === 'Space'){
        const a = document.activeElement;
        if(a && a.tagName === 'BUTTON' && overlay.contains(a)) return;   // let the focused button do its thing
        e.preventDefault(); ovBtn.click();
      }
      return;
    }
    if(e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'KeyD'){
      keysDown.add(e.code); e.preventDefault(); wake(); startMusic();
    } else if(e.code === 'KeyT' || e.code === 'ArrowUp' || e.code === 'KeyW'){
      e.preventDefault(); if(!e.repeat) toot();
    }
  });
  addEventListener('keyup', e => keysDown.delete(e.code));

  // ===== SIZE AND LOOP =====
  function resize(){
    const r = board.getBoundingClientRect(), dpr = Math.min(2.5, window.devicePixelRatio || 1);
    if(r.width < 2 || r.height < 2) return;
    CW = r.width; CH = r.height;
    SC = Math.min(r.width/900, r.height/480);
    W = r.width/SC; H = r.height/SC;
    TY = H - 140;
    cvs.width = Math.round(r.width*dpr); cvs.height = Math.round(r.height*dpr);
    PX = cvs.width/r.width;
  }
  addEventListener('resize', resize);
  // also redraw at the right size whenever the board itself changes size (turning the device, etc.)
  if(window.ResizeObserver) new ResizeObserver(resize).observe(board);

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    if(lv) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  selected = clamp(selected, 1, LEVELS);
  previewLevel();
  buildKey();
  showPanel('intro');
  updateHud();
  requestAnimationFrame(loop);
  /* end of game code */
})();
</script>
</body>
