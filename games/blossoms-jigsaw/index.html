<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blossom's Jigsaw Puzzles - Free Jigsaw Puzzle Game for Kids | Lyla Rose Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@600;800&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg1:#FDE2EC;
    --bg2:#E3F0FF;
    --purple:#7B4FD6;
    --purple-d:#5A2FA0;
    --pink:#FF4F9A;
    --gold:#FFC23D;
    --ink:#2F2350;
    --card:#FFFFFFD9;
    --cw:160px;   /* gallery card width (set by the game to fit the screen) */
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);
    background-color:var(--bg1);
    color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif;
    /* fill the screen exactly, keeping clear of notches and rounded corners */
    height:100vh;height:100dvh;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    box-sizing:border-box;
    overflow:hidden;
  }
  .wrap{max-width:1400px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  /* the bar along the top: back link, title and the buttons */
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
  .back{order:1}
  .snd{order:2;margin-left:auto;display:flex;gap:6px}
  h1{order:3;flex-basis:100%;font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;font-size:clamp(24px,5.5vw,38px);margin:0;line-height:1;color:var(--purple);text-shadow:2px 2px 0 #fff;text-wrap:balance}
  @media (min-width:900px){
    h1{order:2;flex:1 1 auto;min-width:0;font-size:clamp(24px,2.6vw,38px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .snd{order:3;margin-left:0}
  }
  /* short screens: everything on one row, no title - the game gets the space */
  @media (max-height:560px){
    h1{display:none}
  }
  /* the game fills whatever space is left over */
  .stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
  .board{position:relative;width:100cqw;height:100cqh;border-radius:18px;overflow:hidden;background:#FFF4F8;box-shadow:0 10px 30px #5A2FA033;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
  .board:focus-visible{box-shadow:0 0 0 4px var(--gold),0 10px 30px #5A2FA033}
  canvas#c{display:block;width:100%;height:100%;touch-action:none}

  button{font:inherit;font-weight:800;cursor:pointer;border:none;border-radius:12px;padding:12px 18px;background:var(--purple);color:#fff;font-size:17px;min-height:48px;min-width:48px}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  button.ghost{background:var(--card);color:var(--ink);padding:8px 12px;font-size:16px}
  button.ghost svg{width:26px;height:26px;display:block}
  button.ghost[aria-pressed="false"] svg{opacity:.45}
  .back{font-weight:800;color:var(--purple-d);text-decoration:none;background:var(--card);padding:0 14px;border-radius:999px;font-size:15px;min-height:48px;display:inline-flex;align-items:center;box-sizing:border-box;white-space:nowrap}
  .back:hover{text-decoration:underline}

  /* ----- the panels that sit over the game (start, pictures, sizes) ----- */
  .overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:#2F2350A6;padding:12px;box-sizing:border-box}
  .overlay.soft{background:#FFF4F8B3}
  .panel{background:#fff;border-radius:18px;padding:14px 16px;text-align:center;max-width:400px;width:100%;max-height:100%;box-sizing:border-box;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px #2F235033}
  .panel h2{font-family:"Chewy",cursive;font-weight:400;font-size:30px;margin:0;color:var(--purple);line-height:1.05}
  .panel p{margin:0;font-size:15px}
  .panel .key{font-size:14px;display:grid;grid-template-columns:auto auto;justify-content:center;gap:2px 10px;text-align:left}
  .big{background:var(--pink);box-shadow:0 5px 0 #C9306F;font-size:20px}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #C9306F}
  .hero{width:120px;height:120px;margin:-4px auto -6px;display:block}

  /* the picture gallery (it doubles as the sticker book) */
  .panel.gal{max-width:none;width:auto;padding:10px 12px 12px;gap:6px}
  .galhead{display:flex;align-items:center;justify-content:center;gap:10px}
  .galhead h2{font-size:26px}
  .count{font-weight:800;background:#FFF3C4;border-radius:999px;padding:3px 10px;font-size:15px;white-space:nowrap}
  .pics{display:grid;grid-template-columns:repeat(4,var(--cw));gap:10px;justify-content:center;padding:4px}
  .pic{position:relative;padding:0;background:#fff;border-radius:14px;box-shadow:0 3px 0 #D9C9F5,0 0 0 2px #EDE3FF;overflow:visible;display:flex;flex-direction:column;align-items:stretch;min-height:0}
  .pic:active{transform:translateY(2px)}
  .pic canvas.prev{display:block;width:100%;aspect-ratio:4/3;border-radius:14px 14px 0 0}
  .pic .stars{display:flex;justify-content:center;gap:1px;padding:2px 0 3px;font-size:15px;line-height:1;color:#E6DAFF}
  .pic .stars .on{color:#FFB800;text-shadow:0 1px 0 #D08700}
  .pic canvas.stk{position:absolute;right:-6px;top:-8px;width:34%;aspect-ratio:1;pointer-events:none;filter:drop-shadow(0 2px 2px #2F235040)}
  .pic .slot{position:absolute;right:4px;top:4px;width:24%;aspect-ratio:1;border-radius:50%;border:2.5px dashed #FFFFFFE6;box-sizing:border-box;background:#FFFFFF40}

  /* picking a size */
  .panel.sizes{max-width:560px;gap:10px}
  .sizehead{display:flex;align-items:center;justify-content:center;gap:10px}
  .sizehead canvas{flex:0 1 auto;min-width:0;height:clamp(90px,32vh,280px);width:auto;max-width:calc(100% - 60px);aspect-ratio:4/3;border-radius:12px;box-shadow:0 0 0 3px #EDE3FF}
  .sizehead .ghost{flex:none}
  .sizebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .size{background:#fff;color:var(--ink);box-shadow:0 4px 0 #C9B8F0,0 0 0 2px #E6DAFF;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;border-radius:16px}
  .size svg{width:min(64px,100%);height:auto;display:block}
  .size b{font-size:22px;line-height:1;font-family:"Chewy",cursive;font-weight:400;color:var(--purple)}
  .size.pick{background:#FFF3C4;box-shadow:0 0 0 4px var(--gold),0 4px 0 #D9901A}
  .size .done{position:absolute;right:4px;top:3px;color:#FFB800;font-size:18px;text-shadow:0 1px 0 #D08700}
  .size:active{transform:translateY(3px)}

  /* the card that pops up when a puzzle is finished (it sits beside the picture) */
  .finish{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:6px;pointer-events:none}
  .fcard{pointer-events:auto;background:#fff;border-radius:18px;padding:10px;box-shadow:0 8px 24px #2F235040;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:100%;max-height:100%;box-sizing:border-box;animation:cardin .5s cubic-bezier(.3,1.5,.5,1) backwards}
  @keyframes cardin{from{transform:scale(.4);opacity:0}}
  .fstick{display:flex;flex-direction:column;align-items:center;gap:2px}
  .fstick canvas{width:var(--st,110px);height:var(--st,110px);display:block;filter:drop-shadow(0 3px 3px #2F235040)}
  .fstick .stars{font-size:20px;line-height:1;color:#E6DAFF;letter-spacing:1px}
  .fstick .stars .on{color:#FFB800;text-shadow:0 1px 0 #D08700}
  .fbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .fbtn{width:64px;height:64px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
  .fbtn svg{width:60%;height:60%;display:block}
  .fbtn.go{background:var(--pink);box-shadow:0 4px 0 #C9306F}
  .fbtn:active{transform:translateY(3px)}
  .finish.tallcard .fcard{flex-direction:column;flex-wrap:nowrap}
  /* the round "share my sticker" button: white with a pink ring, its words shown only as a little "Link copied!" bubble */
  .fbtn.lr-share{position:relative;padding:0;border-radius:50%;gap:0;min-width:0;min-height:0}
  .fbtn.lr-share svg{width:46%;height:46%;stroke-width:2.6}
  .fbtn.lr-share span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .fbtn.lr-share.done span{width:auto;height:auto;overflow:visible;clip:auto;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#2F2350;color:#fff;font-size:14px;padding:5px 9px;border-radius:10px;pointer-events:none}

  /* the big pointing hand that shows what to do */
  .hand{position:absolute;z-index:3;left:0;top:0;width:58px;height:76px;pointer-events:none;transform-origin:29px 2px;filter:drop-shadow(0 3px 3px #2F235040)}
  .hand svg{width:100%;height:100%;display:block}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion: reduce){ .fcard{animation:none} }

  /* short screens: more compact panels so the buttons always fit */
  @media (max-height:520px){
    .panel{padding:10px 14px;gap:6px;max-width:560px}
    .panel h2{font-size:25px}
    .panel p{font-size:14px}
    .panel .key{display:none}
    .hero{width:84px;height:84px}
    .galhead h2{font-size:22px}
    .sizehead canvas{height:clamp(80px,30vh,200px)}
  }
  /* PHONES ONLY: the game fills the whole screen; the buttons float in the top corners */
  @media (max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) {
    body{padding:0;background:#FFF4F8}
    .wrap{display:block;max-width:none;height:100%}
    h1{display:none}
    .stage{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);display:block}
    .board{width:100%;height:100%;border-radius:0;box-shadow:none}
    .board:focus-visible{box-shadow:inset 0 0 0 4px var(--gold)}
    /* back, music and sound: small round buttons in the top-left corner */
    .bar{display:block}
    .back,#music,#sound,#gal,#eye{position:fixed;z-index:5;top:calc(4px + env(safe-area-inset-top,0px));width:44px;height:44px;min-width:44px;min-height:44px;padding:0;border-radius:50%;justify-content:center;align-items:center;display:inline-flex;background:#FFFFFFB3;box-shadow:0 2px 6px #2F235026;font-size:0;line-height:1}
    #gal[hidden],#eye[hidden]{display:none!important}
    .back{left:calc(4px + env(safe-area-inset-left,0px))}
    .back::before{content:"←";content:"←" / "";font-size:22px;font-weight:800}
    #music{left:calc(52px + env(safe-area-inset-left,0px))}
    #sound{left:calc(100px + env(safe-area-inset-left,0px));font-size:20px}
    #music::before{content:"🎵";content:"🎵" / "";font-size:20px}
    #music[aria-label="Music off"]::before{opacity:.4}
    #music[aria-label="Music off"]::after{content:"";position:absolute;left:11px;right:11px;top:50%;height:3px;border-radius:2px;background:#C92A2A;transform:rotate(-40deg)}
    /* the picture and eye buttons: top-right corner */
    #eye{right:calc(4px + env(safe-area-inset-right,0px))}
    #gal{right:calc(52px + env(safe-area-inset-right,0px))}
    button.ghost svg{width:26px;height:26px}
    .overlay{padding:52px 8px 8px}
    @media (orientation: landscape) { .overlay{padding:50px 8px 6px} }
  }
</style>

<script>
(() => {
  // ===== SETUP =====
  const $ = id => document.getElementById(id);
  const cvs = $('c'), ctx = cvs.getContext('2d');
  const board = $('board');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PHONE = matchMedia('(max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape)');
  const FONT = '"Chewy","Comic Sans MS",cursive';
  const TAU = Math.PI*2;
  const O = '#2F2350';                      // outline colour
  const KEY = 'lrg-blossoms-jigsaw-';

  const rand = (a, b) => a + Math.random()*(b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ----- Rainbow the flying unicorn (from Glitter Sky Unicorn) - middle of her body at 0,0, faces right -----
  const PAL = ['#ff9fcf', '#ffcf8a', '#fff08a', '#9ff0c4', '#8fd4ff', '#c8a8ff', '#ffffff'];

  // ----- Chomper the friendly purple dinosaur (from Chomper's Digger / Car Wash) - faces right, feet at 0,0 -----

  function soapBubble(g, x, y, r){

  // =====================================================================
  //  THE PUZZLE PICTURES
  //  Each picture is drawn in code at 800 x 600. draw(g, t, live): t = the clock,
  //  live = seconds since the finished picture came alive (0 = still, as a puzzle).
  //  To add a new picture: add another { id, name, focus, sound, draw } to SCENES.
  //  (focus = the middle and size of the round sticker cut from the picture)
  // =====================================================================
  const PW = 800, PH = 600;

  // ----- little background helpers -----
  function sky(g, stops, h){
    const gr = g.createLinearGradient(0, 0, 0, h || PH);
    stops.forEach((c, i) => gr.addColorStop(i/(stops.length - 1), c));
    g.fillStyle = gr; g.fillRect(0, 0, PW, PH);
  }
  function sun(g, x, y, r, t){
    const sg = g.createRadialGradient(x, y, r*0.3, x, y, r*2.6);
    sg.addColorStop(0, 'rgba(255,240,150,0.9)'); sg.addColorStop(1, 'rgba(255,240,150,0)');
    g.fillStyle = sg; circF(g, x, y, r*2.6);
    g.strokeStyle = 'rgba(255,214,80,0.55)'; g.lineWidth = 6; g.lineCap = 'round';
    const rot = (t || 0)*0.3;
    for(let i = 0; i < 10; i++){ const a = rot + i*TAU/10; line(g, x + Math.cos(a)*r*1.3, y + Math.sin(a)*r*1.3, x + Math.cos(a)*r*1.75, y + Math.sin(a)*r*1.75); }
    g.fillStyle = '#FFE58A'; circF(g, x, y, r);
    g.strokeStyle = '#E8A93A'; g.lineWidth = 3;
    g.beginPath(); g.arc(x - r*0.32, y - r*0.08, r*0.14, Math.PI*1.1, Math.PI*1.9); g.stroke();
    g.beginPath(); g.arc(x + r*0.32, y - r*0.08, r*0.14, Math.PI*1.1, Math.PI*1.9); g.stroke();
    g.beginPath(); g.arc(x, y + r*0.12, r*0.3, 0.15*Math.PI, 0.85*Math.PI); g.stroke();
    g.fillStyle = 'rgba(255,143,184,0.55)'; ovalF(g, x - r*0.55, y + r*0.2, r*0.14, r*0.09); ovalF(g, x + r*0.55, y + r*0.2, r*0.14, r*0.09);
  }
  function puff(g, x, y, r){ g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
  function cloud(g, x, y, s, alpha){
    g.globalAlpha = alpha == null ? 1 : alpha;
    g.fillStyle = '#FFFFFF';
    g.beginPath();
    puff(g, x, y, 34*s); puff(g, x - 38*s, y + 10*s, 26*s); puff(g, x + 40*s, y + 8*s, 28*s);
    puff(g, x - 14*s, y - 20*s, 28*s); puff(g, x + 18*s, y - 16*s, 24*s);
    g.rect(x - 60*s, y + 8*s, 120*s, 26*s);
    g.fill();
    g.globalAlpha = 1;
  }
  function hill(g, y0, amp, waves, ph, col, bottom){
    g.fillStyle = col; g.beginPath(); g.moveTo(0, bottom || PH);
    for(let x = 0; x <= PW; x += 10) g.lineTo(x, y0 + Math.sin(x/PW*Math.PI*waves + ph)*amp);
    g.lineTo(PW, bottom || PH); g.closePath(); g.fill();
  }
  const hillY = (x, y0, amp, waves, ph) => y0 + Math.sin(x/PW*Math.PI*waves + ph)*amp;
  function clump(g, x, y, r, col){
    g.fillStyle = col; g.beginPath();
    for(let i = 0; i < 5; i++){ const a = i/5*TAU; puff(g, x + Math.cos(a)*r*0.55, y + Math.sin(a)*r*0.4, r*0.6); }
    g.fill();
  }
  function tulip(g, x, y, col, s){
    s = s || 1;
    g.strokeStyle = '#4E9E45'; g.lineWidth = 3*s; g.lineCap = 'round'; line(g, x, y, x, y - 20*s);
    g.fillStyle = col;
    g.beginPath(); g.moveTo(x - 8*s, y - 30*s); g.lineTo(x - 8*s, y - 20*s); g.quadraticCurveTo(x, y - 12*s, x + 8*s, y - 20*s); g.lineTo(x + 8*s, y - 30*s); g.lineTo(x + 4*s, y - 25*s); g.lineTo(x, y - 31*s); g.lineTo(x - 4*s, y - 25*s); g.closePath(); g.fill();
  }
  function daisy(g, x, y, s, col){
    s = s || 1;
    g.fillStyle = col || '#FFFFFF';
    for(let k = 0; k < 6; k++){ const a = k/6*TAU; ell(g, x + Math.cos(a)*6*s, y - 10*s + Math.sin(a)*6*s, 4*s, 2.4*s, a); g.fill(); }
    g.fillStyle = '#FFD43B'; circF(g, x, y - 10*s, 3.4*s);

  function grassTufts(g, R, y0, y1, n, col){
    g.strokeStyle = col; g.lineWidth = 3; g.lineCap = 'round';
    for(let i = 0; i < n; i++){
      const x = R()*PW, y = y0 + R()*(y1 - y0);

  }
  function butterfly(g, x, y, s, col, flap){
    const f = 0.35 + 0.65*Math.abs(Math.cos(flap));
    g.save(); g.translate(x, y); g.scale(s, s);
    g.fillStyle = col; g.strokeStyle = O; g.lineWidth = 1.6;
    g.save(); g.scale(f, 1);
    ell(g, -8, -5, 8, 7, -0.4); g.fill(); g.stroke(); ell(g, 8, -5, 8, 7, 0.4); g.fill(); g.stroke();
    ell(g, -6, 5, 5.5, 5, 0.4); g.fill(); g.stroke(); ell(g, 6, 5, 5.5, 5, -0.4); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.7)'; circF(g, -8, -6, 2.4); circF(g, 8, -6, 2.4);

  function sparkle(g, x, y, r, a, col){ g.globalAlpha = clamp(a, 0, 1); star4(g, x, y, r, 0, col || '#FFFFFF'); g.globalAlpha = 1; }
  // things that float up and loop (bubbles, hearts, notes) - worked out from the time alone
  function floaters(n, L, seed, fn){
    for(let i = 0; i < n; i++){
      const h1 = hash(seed + i*3.1), h2 = hash(seed + i*7.7), h3 = hash(seed + i*1.3);

    g.fillStyle = fg; g.beginPath(); g.moveTo(0, PH); for(let x = 0; x <= PW; x += 10) g.lineTo(x, 522 + Math.sin(x/PW*TAU)*8); g.lineTo(PW, PH); g.closePath(); g.fill();

    const a1 = th - al, ex = D_PIV.x + Math.cos(a1)*D_L1, ey = D_PIV.y + Math.sin(a1)*D_L1;
    return {a1, a2: Math.atan2(D_PIV.y + Math.sin(th)*d - ey, D_PIV.x + Math.cos(th)*d - ex)};
  }

      for(let i = skip ? 1 : 0; i <= n; i++){ const t = i/n, a = (1 - t)**3, b = 3*(1 - t)**2*t, c = 3*(1 - t)*t*t, d = t**3;

    for(let i = 1; i < 18; i++){ const a = lerp(a0, a1, i/18); P(cx + Math.cos(a)*r, h + Math.sin(a)*r); }

  function buildPuzzle(){

  // ----- keyboard: Tab / arrows choose a piece, Enter picks it up, arrows move it, Enter drops it -----
  function readingOrder(){ return loose.filter(p => !p.placed).slice().sort((a, b) => (Math.round(a.y/80) - Math.round(b.y/80)) || (a.x - b.x)); }
  function selectNearest(x, y){
    const list = readingOrder(); if(!list.length){ sel = null; return; }

  addEventListener('keydown', e => {
    const a = document.activeElement;

    const onBoard = a === board || a === document.body || a === cvs;

    const arrows = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]};
    if(kbHold && sel){
      if(arrows[e.code]){ e.preventDefault(); if(!e.repeat){ const [dx, dy] = arrows[e.code]; sel.x += dx*14; sel.y += dy*14; } kbKeys.add(e.code); }

    } else if(arrows[e.code]){
      e.preventDefault();
      if(!sel){ sel = list[0]; sfx.tap(); return; }
      // the nearest piece in that direction (or just the next one)
      const [dx, dy] = arrows[e.code];
      let best = null, bd = 1e9;
      list.forEach(q => { if(q === sel) return; const vx = q.x - sel.x, vy = q.y - sel.y, along = vx*dx + vy*dy; if(along <= 5) return; const d = along + Math.abs(vx*dy - vy*dx)*2; if(d < bd){ bd = d; best = q; } });

      if(e.repeat) return;

      kbHold = true; lift(sel);
    }
  });

  // ----- hints: after 10 seconds of nothing, a piece glows and its spot twinkles -----

  // =====================================================================

  // make the cards as big as they can be while all of them still fit

    let best = {cw: 60, c: 4};
    for(let c = 1; c <= n; c++){
      const rw = Math.ceil(n/c);

  function openGallery(){

  const sizeBtnsEl = $('sizeBtns');

  function setEye(){ eyeBtn.setAttribute('aria-pressed', ghostOn ? 'true' : 'false'); eyeBtn.setAttribute('aria-label', ghostOn ? 'Hide the faint picture on the board' : 'Show the faint picture on the board'); }

  setEye();

  // ----- start panel -----
  $('key').innerHTML = [['👆 Drag a piece', 'onto the picture'], ['👁️ Eye button', 'hide the faint picture'], ['⌨️ Tab or arrows', 'choose a piece'], ['⌨️ Enter', 'pick up, then drop']].map(r => '<span>' + r[0] + '</span><span>' + r[1] + '</span>').join('');
  $('playBtn').addEventListener('click', () => { wake(); startMusic(); sfx.tap(); openGallery(); });

  // =====================================================================
  //  UPDATE (everything that moves)
  // =====================================================================
  function update(dt){
    clock += dt; modeT += dt;
    pieces.forEach(p => {
      const A = p.anim;
      if(A){
        A.t += dt;
        if(A.t >= 0){
          const k = clamp(A.t/A.dur, 0, 1), u = A.kind === 'out' ? easeBack(k) : ease(k);
          p.x = lerp(A.x0, A.x1, u); p.y = lerp(A.y0, A.y1, u); p.sc = lerp(A.s0, A.s1, ease(k));
          if(k >= 1){ if(A.kind === 'home') landed(p); else { p.anim = null; p.x = A.x1; p.y = A.y1; p.sc = A.s1; } }
        }
      } else if(!p.placed) p.sc += (p.tsc - p.sc)*Math.min(1, dt*14);
      const up = (drag && drag.p === p) || (kbHold && sel === p);
      p.lift += ((up ? 1 : 0) - p.lift)*Math.min(1, dt*12);
      p.wig = Math.max(0, p.wig - dt*2.4);
      p.rot = reduced ? 0 : Math.sin(clock*24)*0.08*p.wig;
    });
    if(mode === 'intro' && pieces.every(p => !p.anim)){
      mode = 'play'; modeT = 0; idleT = placedEver < 1 ? 7.5 : 0;     // first time ever: show how straight away
    }
    // dragging with a finger or mouse
    if(drag){
      const p = drag.p;
      p.x = clamp(drag.wx - drag.ox*p.sc, view.x0, view.x1);
      p.y = clamp(drag.wy - drag.oy*p.sc, view.y0, view.y1);
    }
    // moving with the arrow keys
    if(kbHold && sel){
      let dx = 0, dy = 0;
      if(kbKeys.has('ArrowLeft')) dx--; if(kbKeys.has('ArrowRight')) dx++;
      if(kbKeys.has('ArrowUp')) dy--; if(kbKeys.has('ArrowDown')) dy++;
      sel.x = clamp(sel.x + dx*460*dt, view.x0, view.x1);
      sel.y = clamp(sel.y + dy*460*dt, view.y0, view.y1);
    }
    // hints
    if(mode === 'play' && !drag && !kbHold){
      idleT += dt;
      if(!hint && idleT > 10) startHint();
    }
    if(hint){ hint.t += dt; if(hint.p.placed || mode !== 'play') clearHint(); }

    blos.clapT = Math.max(0, blos.clapT - dt); blos.cheerT = Math.max(0, blos.cheerT - dt);
    blos.sayT = Math.max(0, blos.sayT - dt); blos.giggleT = Math.max(0, blos.giggleT - dt);

      q.life -= dt;

    if(mode === 'done'){

    }
  }

  // =====================================================================
  //  DRAWING
  // =====================================================================
  const bg = document.createElement('canvas'), bgc = bg.getContext('2d');
  function toW(g){ g.setTransform(PX*S, 0, 0, PX*S, PX*OX, PX*OY); }
  function drawBg(){
    bg.width = cvs.width; bg.height = cvs.height;
    const g = bgc; g.setTransform(PX, 0, 0, PX, 0, 0);
    const gr = g.createLinearGradient(0, 0, CW*0.3, CH);
    gr.addColorStop(0, '#FFF0F6'); gr.addColorStop(1, '#EAF3FF');
    g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
    // little hearts and stars dotted about
    const R = rng(77);
    for(let i = 0; i < Math.round(CW*CH/9000); i++){
      const x = R()*CW, y = R()*CH, k = R();
      g.globalAlpha = 0.18;
      if(k < 0.5) heart(g, x, y, 5 + R()*4, pick2(R, ['#FF8FB8', '#B197FC', '#74C0FC']));
      else star5(g, x, y, 5 + R()*4, pick2(R, ['#FFD43B', '#FF8FB8', '#69DB7C']));
    }
    g.globalAlpha = 1;
    toW(g);
    // the spots where the loose pieces wait
    regions.forEach(Rg => {
      const w = Rg.x1 - Rg.x0, h = Rg.y1 - Rg.y0; if(w < 20 || h < 20) return;
      g.fillStyle = 'rgba(177,151,252,0.1)'; rr(g, Rg.x0, Rg.y0, w, h, 24); g.fill();
      g.setLineDash([10/S, 8/S]); g.lineWidth = 2/S; g.strokeStyle = 'rgba(155,120,230,0.28)'; g.stroke(); g.setLineDash([]);
    });
    // the puzzle board: a white frame with a soft shadow
    const fw = 12/S + 6;
    g.fillStyle = 'rgba(90,47,160,0.16)'; rr(g, -fw, -fw + 6/S, PW + fw*2, PH + fw*2, 22); g.fill();
    g.fillStyle = '#FFFFFF'; rr(g, -fw, -fw, PW + fw*2, PH + fw*2, 22); g.fill();
    g.fillStyle = '#F6F0FF'; rr(g, 0, 0, PW, PH, 6); g.fill();
    g.strokeStyle = '#E6DAFF'; g.lineWidth = 3/S; g.stroke();
  }
  const pick2 = (R, a) => a[Math.floor(R()*a.length)];

  function drawPiece(p){
    const k = S*p.sc, bob = hint && hint.p === p && !reduced ? Math.sin(clock*6)*6 : 0;
    ctx.save(); ctx.translate(p.x, p.y + bob); ctx.rotate(p.rot); ctx.scale(p.sc, p.sc); ctx.translate(-p.hx, -p.hy);
    if(p.lift > 0.03){
      ctx.save(); ctx.translate(7*p.lift/k, 11*p.lift/k);
      ctx.fillStyle = 'rgba(47,35,80,' + (0.24*p.lift).toFixed(3) + ')'; ctx.fill(p.path);
      ctx.restore();
    }
    ctx.save(); ctx.translate(0, 3/k); ctx.fillStyle = '#C3AEEB'; ctx.fill(p.path); ctx.restore();
    let glow = 0;
    if(hint && hint.p === p) glow = 0.55 + 0.45*Math.sin(clock*7);
    else if(sel === p && lastKb) glow = kbHold ? 1 : 0.7 + 0.3*Math.sin(clock*6);
    if(glow > 0){ ctx.lineJoin = 'round'; ctx.lineWidth = 12/k; ctx.strokeStyle = 'rgba(255,194,61,' + glow.toFixed(3) + ')'; ctx.stroke(p.path); ctx.lineWidth = 5/k; ctx.strokeStyle = 'rgba(255,255,255,' + (glow*0.9).toFixed(3) + ')'; ctx.stroke(p.path); }
    if(p.spr) ctx.drawImage(p.spr, p.bx0, p.by0, p.bw, p.bh);
    ctx.restore();
  }
  function drawBlossomHere(){
    const b = blos, s = b.s;
    const hop = b.hop > 0 && !reduced ? Math.abs(Math.sin(b.hop*9))*18*b.hop : 0;
    let arms = 'rest', clap = 0, point = 1;
    if(b.cheerT > 0) arms = 'up';
    else if(b.clapT > 0 || b.giggleT > 0){ arms = 'clap'; clap = Math.abs(Math.sin((b.clapT + b.giggleT)*16)); }
    else if(hint && mode === 'play'){ arms = 'point'; point = hint.p.x < b.x ? -1 : 1; }
    else if(mode !== 'play' && mode !== 'intro' && mode !== 'done'){ arms = 'up'; }
    const happy = b.cheerT > 0 || b.clapT > 0 || b.giggleT > 0;
    let lookX = 0, lookY = 0;
    const target = drag ? drag.p : (kbHold ? sel : hint ? hint.p : null);
    if(target){ lookX = clamp((target.x - b.x)/300, -1, 1); lookY = clamp((target.y - (b.y - 110*s))/300, -1, 1); }
    ctx.fillStyle = 'rgba(0,0,0,0.13)'; ovalF(ctx, b.x, b.y + 2*s, 36*s, 7*s);
    ctx.save(); ctx.translate(b.x, b.y - hop); ctx.scale(s, s);
    drawBlossom(ctx, {t: clock, mood: happy ? 'happy' : 'normal', arms, clap, point, lookX, lookY, talk: b.sayT > 0 && !happy});
    ctx.restore();
  }
  function drawBubble(){
    const b = blos; if(b.sayT <= 0) return;
    const a = Math.min(1, b.sayT*3, (3.6 - b.sayT)*6 + 0.2);
    const fs = clamp(Math.min(CW, CH)*0.075, 22, 40)/S;
    ctx.font = fs + 'px ' + FONT;
    const tw = ctx.measureText(b.say).width, w = tw + fs*1.1, h = fs*1.6;
    const headY = b.y - 185*b.s;
    let x = tallL ? b.x - w*0.55 : b.x + w*0.45, y = headY - h*0.8;
    x = clamp(x, view.x0 + w/2, view.x1 - w/2); y = clamp(y, view.y0 + h/2, view.y1 - h/2);
    const sc = reduced ? 1 : 0.85 + 0.15*easeBack(clamp((3.6 - b.sayT)*3, 0, 1));
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#FF8FB8'; ctx.lineWidth = 4/S; ctx.lineJoin = 'round';
    rr(ctx, -w/2, -h/2, w, h, h/2); ctx.fill(); ctx.stroke();
    const tx = clamp(b.x - x, -w/2 + h*0.4, w/2 - h*0.4);
    ctx.beginPath(); ctx.moveTo(tx - h*0.22, h/2 - 2/S); ctx.lineTo(tx + (b.x - x - tx)*0.4, h/2 + h*0.45); ctx.lineTo(tx + h*0.22, h/2 - 2/S); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(tx - h*0.2, h/2 - 5/S, h*0.4, 5/S);
    ctx.fillStyle = '#E64980'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.say, 0, fs*0.06);
    ctx.restore();
  }
  function drawHintSpot(){
    if(!hint || mode !== 'play') return;
    const p = hint.p, pulse = 0.5 + 0.5*Math.sin(clock*7);
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8/S; ctx.strokeStyle = 'rgba(255,194,61,' + (0.35 + pulse*0.5).toFixed(3) + ')'; ctx.stroke(p.path);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.18 + pulse*0.22).toFixed(3) + ')'; ctx.fill(p.path);
    ctx.restore();
    for(let i = 0; i < 6; i++){
      const a = clock*1.6 + i*TAU/6, rx = pw*0.32, ry = ph*0.32;
      const tw = 0.5 + 0.5*Math.sin(clock*8 + i*2);
      star4(ctx, p.hx + Math.cos(a)*rx, p.hy + Math.sin(a)*ry, (6 + tw*8)/Math.max(0.6, S), clock*2, 'rgba(255,255,255,' + (0.5 + tw*0.5).toFixed(3) + ')');
    }
  }
  function drawParts(){
    parts.forEach(q => {
      const a = clamp(q.life/q.max*2, 0, 1);
      if(q.type === 'spark') { ctx.globalAlpha = a; star4(ctx, q.x, q.y, q.r*(0.6 + a*0.4), clock*4, q.col); }
      else { ctx.globalAlpha = a; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.col; ctx.fillRect(-q.r/2, -q.r/4, q.r, q.r/2); ctx.restore(); }
    });
    ctx.globalAlpha = 1;
  }
  function draw(){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    toW(ctx);
    const playing = mode === 'intro' || mode === 'play' || mode === 'done';
    // the picture on the board: faint (to help), the placed pieces, or the whole thing come alive
    ctx.save(); rr(ctx, 0, 0, PW, PH, 6); ctx.clip();
    if(playing){
      if(mode === 'done' && liveOn){
        try { SCENES[sceneIdx].draw(ctx, STILL_T + liveL, Math.max(0.0001, liveL)); } catch(e){ ctx.drawImage(still, 0, 0, PW, PH); }
      } else {
        if(ghostOn && still){ ctx.globalAlpha = 0.3; ctx.drawImage(still, 0, 0, PW, PH); ctx.globalAlpha = 1; }
        if(layer) ctx.drawImage(layer, 0, 0, PW, PH);
        if(mode === 'done' && still){ ctx.globalAlpha = clamp(doneT/0.6, 0, 1); ctx.drawImage(still, 0, 0, PW, PH); ctx.globalAlpha = 1; }
      }
    } else {
      ctx.globalAlpha = 0.45; ctx.drawImage(preview(sceneIdx), 0, 0, PW, PH); ctx.globalAlpha = 1;
    }
    ctx.restore();
    drawHintSpot();
    drawBlossomHere();
    if(playing) loose.forEach(p => { if(!(drag && drag.p === p)) drawPiece(p); });
    pieces.forEach(p => { if(p.placed && p.anim) drawPiece(p); });
    if(drag) drawPiece(drag.p);
    drawParts();
    drawBubble();
    updateHand();
  }

  // ----- the pointing hand that shows where a piece goes -----
  let handOn = false;
  function updateHand(){
    if(!hint || mode !== 'play' || drag || kbHold || hint.t < 0.4){ if(handOn){ handEl.hidden = true; handOn = false; } return; }
    const u = ((hint.t - 0.4) % 2.4)/2.4, p = hint.p;
    const m = u < 0.18 ? 0 : u < 0.75 ? easeIO((u - 0.18)/0.57) : 1;
    const x = OX + lerp(p.x, p.hx, m)*S, y = OY + lerp(p.y, p.hy, m)*S;
    const press = u < 0.18 ? u/0.18 : u > 0.85 ? 1 - (u - 0.85)/0.15 : 1;
    if(!handOn){ handEl.hidden = false; handOn = true; }
    handEl.style.opacity = (0.35 + 0.65*press).toFixed(3);
    handEl.style.transform = 'translate(' + (x - 29).toFixed(1) + 'px,' + (y - 2).toFixed(1) + 'px) scale(' + (0.9 + 0.1*press).toFixed(3) + ')';
  }

  // ----- the little picture of Blossom on the start panel -----
  const hero = $('hero'), hctx = hero.getContext('2d');
  function drawHero(){
    hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.clearRect(0, 0, 240, 240);
    hctx.save(); hctx.translate(120, 232); hctx.scale(1.18, 1.18);
    drawBlossom(hctx, {t: clock, mood: (clock % 5) < 1.2 ? 'happy' : 'normal', arms: 'clap', clap: 1});
    hctx.restore();
    // a jigsaw piece in her paws
    hctx.save(); hctx.translate(120, 146 + Math.sin(clock*2.4)*2); hctx.rotate(-0.15 + Math.sin(clock*1.5)*0.08); hctx.scale(0.62, 0.62);
    const pc = new Path2D('M-30 -30 H-10 C-10 -44 10 -44 10 -30 H30 V-10 C44 -10 44 10 30 10 V30 H-30 Z');
    hctx.fillStyle = '#C3AEEB'; hctx.save(); hctx.translate(0, 4); hctx.fill(pc); hctx.restore();
    const gr = hctx.createLinearGradient(-30, -40, 40, 30); gr.addColorStop(0, '#FF8FB8'); gr.addColorStop(0.5, '#FFD43B'); gr.addColorStop(1, '#74C0FC');
    hctx.fillStyle = gr; hctx.fill(pc); hctx.lineWidth = 3; hctx.strokeStyle = O; hctx.stroke(pc);
    hctx.restore();
  }

  // =====================================================================
  //  SIZE AND LOOP
  // =====================================================================
  let spriteS = 0;
  function resize(){
    const r = board.getBoundingClientRect(), dpr = Math.min(2.5, window.devicePixelRatio || 1);
    if(r.width < 2 || r.height < 2) return;
    CW = r.width; CH = r.height; PX = dpr;
    cvs.width = Math.round(CW*PX); cvs.height = Math.round(CH*PX);
    layout();
    if(pieces.length && (mode === 'intro' || mode === 'play' || mode === 'done')){
      const rebuilt = buildStill(false);
      if(!rebuilt && Math.abs(S - spriteS)/S > 0.02){ pieces.forEach(makeSprite); buildLayer(); }
      spriteS = S;
      relayoutPieces();
    }
    drawBg();
    placeCard();
    fitGallery();
  }
  addEventListener('resize', resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(board);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(still && pieces.length){ buildStill(true); } });

  let last = performance.now(), oops = 0;
  function loop(t){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, Math.max(0, (t - last)/1000)); last = t;
    try {
      update(dt); draw();
      if(!overlays.start.hidden) drawHero();
    } catch(e){ if(oops++ < 3) console.error(e); }
  }

  // for automatic testing only (does nothing for players)
  if(/[?&]test\b/.test(location.search)){
    window.__jig = {
      info(){
        const r = board.getBoundingClientRect();
        const sc = (x, y) => ({x: r.left + OX + x*S, y: r.top + OY + y*S});
        return {mode, S, tallL, size, scene: sceneIdx, ts: slotInfo.ts, view, pw, ph,
          blos: {...sc(blos.x, blos.y), s: blos.s},
          pieces: pieces.map(p => ({id: p.id, placed: p.placed, anim: !!p.anim, sc: p.sc, ...sc(p.x, p.y), home: sc(p.hx, p.hy), w: pw*p.sc*S, h: ph*p.sc*S}))};
      },
      live(L){ if(mode === 'done'){ liveOn = true; liveL = L; doneT = Math.max(doneT, 0.8); } }
    };
  }

  resize();
  buildGallery();
  requestAnimationFrame(loop);
  setTimeout(() => { try { $('playBtn').focus({preventScroll: true}); } catch(e){} }, 50);
  /* end of game code */
})();
</script>
