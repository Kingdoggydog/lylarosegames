<script>
(() => {

  const $ = id => document.getElementById(id);

  const soundBtn = $('sound'), musicBtn = $('music');
  const scorePill = $('scorePill'), scoreNEl = $('scoreN'), ballsPill = $('ballsPill'), ballIconsEl = $('ballIcons'), partyPill = $('partyPill'), partyNEl = $('partyN');

  const FONT = '"Chewy","Comic Sans MS",cursive';
  const TAU = Math.PI*2;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a)*u;
  const easeBack = u => { u = clamp(u, 0, 1); const c = 1.7; return 1 + (c + 1)*Math.pow(u - 1, 3) + c*Math.pow(u - 1, 2); };
  const hash = n => { const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };
  function ell(x, y, rx, ry, rot){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
  function circ(x, y, r){ ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); }
  function rr(g, x, y, w, h, r){
    r = Math.max(0, Math.min(r, w/2, h/2));
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function star4(g, x, y, r, rot, col){
    g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col;
    g.beginPath();
    for(let i = 0; i < 8; i++){ const a = i*Math.PI/4, q = i % 2 ? r*0.32 : r; g.lineTo(Math.cos(a)*q, Math.sin(a)*q); }
    g.closePath(); g.fill(); g.restore();
  }
  function star5(g, x, y, r, rot, inner){
    g.beginPath();

  function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }

  const fmt = n => Math.round(n).toLocaleString('en-AU');

  // ===== SAVED STUFF (only on this device) =====
  let best = load(KEY + 'best', 0)|0;

  let musicOn = load(KEY + 'music', true);

  // ===== THE TABLE =====
  // Everything on the table is measured in "table units": the table is 600 wide and 900-1400 tall
  // (taller on tall phones so it fills the screen). Things near the top are measured from the top,
  // things near the flippers from the bottom, and the middle stretches.
  const W = 600;
  const BR = 14;                              // ball radius
  const X0 = 20, XS = 545, XR = 585;          // left wall, the wall beside the spring lane, right wall
  const MID = (X0 + XS)/2;                    // the middle of the playing area (282.5)
  const MX = x => 2*MID - x;                  // mirror a left-side x to the right side

  const MAXV = 1750;                          // speed limit

  let S = 1, offX = 0, offY = 0;              // table units -> screen pixels

  let rampPath = [], rampLen = 0, rampMouth = null, lenny = null, starsY = 0, partyY = 0, laneTopY = 0;

    const s = Object.assign({x1, y1, x2, y2, e: 0.42, draw: true}, o || {});
    s.dx = x2 - x1; s.dy = y2 - y1; s.len2 = s.dx*s.dx + s.dy*s.dy || 1;
    return s;
  }

  function buildTable(){

    segs = [];
    // the round top of the table, from the left wall over to the right wall

      const a1 = Math.PI + Math.PI*i/N, a2 = Math.PI + Math.PI*(i + 1)/N;
      segs.push(seg(cx + Math.cos(a1)*R, cy + Math.sin(a1)*R, cx + Math.cos(a2)*R, cy + Math.sin(a2)*R, {draw: false, e: 0.3}));
    }
    // outer walls

    segs.push(seg(XR, cy, XR, b - 6, {draw: false}));
    // the wall between the playing area and the spring lane
    laneTopY = t + 250;

    { const L = Math.hypot(gate.dx, gate.dy); gate.nx = gate.dy/L; gate.ny = -gate.dx/L; if(gate.ny > 0){ gate.nx = -gate.nx; gate.ny = -gate.ny; } }
    segs.push(gate);
    // a little slide on the top-left that sends balls coming down the left wall back into the middle
    segs.push(seg(X0, t + 300, 58, t + 346, {rail: true}));
    // side lanes, inner lanes and the slopes down to the flippers (left side, then the mirror on the right)
    [1, -1].forEach(sd => {
      const X = x => sd > 0 ? x : MX(x);
      segs.push(seg(X(X0), b - 240, X(62), b - 250, {rail: true, e: 0.2}));        // floor of the side lane (the rainbow bridge)
      segs.push(seg(X(62), b - 420, X(62), b - 250, {rail: true}));                // inner lane wall

      // smoothly on to the horn (no little dip where it could get stuck)
      const ax = 62, ay = b - 250, pvx = 162.5, pvy = b - 160, dd = Math.hypot(pvx - ax, pvy - ay);

      segs.push(seg(X(ax), ay, X(ax + Math.cos(ang)*lt), ay + Math.sin(ang)*lt, {rail: true, e: 0.3}));

    // cotton candy cloud bumpers
    bumpers = [

      {x: MX(212), y: t + 262, r: 33, col: '#B5E4FF', col2: '#7CC7FF', face: 1, flash: 0, cd: 0},
      {x: MID, y: t + 350, r: 33, col: '#D7C2FF', col2: '#B79CFF', face: 2, flash: 0, cd: 0}
    ];
    // the five glitter stars - a smile shape across the middle
    const hf = b - t;
    starsY = b - 470 - Math.max(0, hf - 1000)*0.45;
    stars = [0, 1, 2, 3, 4].map(i => ({x: MID + (i - 2)*68, y: starsY + (i - 2)*(i - 2)*9, r: 17, lit: stars[i] ? stars[i].lit : false, flash: 0, cd: 0, i}));
    partyY = Math.min(starsY + 105, b - 300);
    // heart kickers above the flippers
    hearts = [{x: 122, y: b - 335, r: 22, flash: 0, cd: 0}, {x: MX(122), y: b - 335, r: 22, flash: 0, cd: 0}];
    // the rainbow ramp: two posts mark its entrance; a ball going up between them rides the rainbow
    rampMouth = {x1: 70, y1: t + 430, x2: 148, y2: t + 398};

  const ROOTS = [53, 48, 50, 46, 53, 48, 46, 48];   // F, C, Dm, Bb, F, C, Bb, C

        after(0.15, () => sfx.cheer());
        popWord('All the stars!', MID, starsY - 80, '#FF4F9A', 34, 1.8);
      }
    } else {
      sfx.tink();
      add(25, st.x, st.y, false);
    }
  }
  function hitHeart(hk){
    if(hk.cd > 0) return;
    hk.cd = 0.1; hk.flash = 1;
    add(50, hk.x, hk.y - 10, false);
    meter(2);
    sfx.kick();
    burst(hk.x, hk.y, 6, 'heart', ['#FF8FB8', '#FF4F9A', '#FFFFFF'], 120);
  }
  function hitLenny(bl){
    if(lenny.cd > 0) return;
    lenny.cd = 1.3; lenny.hitT = 1.3;
    sfx.hey(); after(0.3, () => sfx.giggle());
    popWord('Hey!', lenny.cx + 34, lenny.cy - 40, '#7B4FD6', 30, 1.1);
    add(500, lenny.cx, lenny.cy - 20);
    meter(12);
    bananas.push({x: lenny.cx, y: lenny.cy + 10, vx: rand(-70, 70), vy: -170, rot: rand(0, TAU), vr: rand(-7, 7), t: 0, paid: false});
  }
  function startRamp(bl){
    bl.mode = 'ramp'; bl.rampS = 0;
    sfx.ramp();
    popWord('Rainbow ramp!', rampMouth.x2 + 30, rampMouth.y2 - 20, '#FF4F9A', 24, 1.1);
  }
  function finishRamp(bl){
    const n = rampPath.length, a = rampPath[n - 3], b = rampPath[n - 1];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    bl.mode = 'play';
    bl.x = b[0]; bl.y = b[1];
    bl.vx = (b[0] - a[0])/L*380; bl.vy = (b[1] - a[1])/L*380;
    bl.stillT = 0; bl.ax = bl.x; bl.ay = bl.y;
    if(bl.fromParty){ bl.fromParty = false; burst(bl.x, bl.y, 14, 'spark'); return; }
    add(2000, bl.x - 40, bl.y);
    meter(22);
    if(!flyer){ flyer = {t: 0}; sfx.wheee(); }
    burst(bl.x, bl.y, 16, 'spark', ['#FF8FB8', '#FFE066', '#8BE38F', '#7CC7FF', '#B79CFF']);
  }

  // ===== PHYSICS =====
  // bounce the ball off a straight wall (the ball is round, so it also bounces off the ends nicely)
  function hitSeg(bl, s){
    let u = ((bl.x - s.x1)*s.dx + (bl.y - s.y1)*s.dy)/s.len2;
    u = u < 0 ? 0 : u > 1 ? 1 : u;
    const cx = s.x1 + s.dx*u, cy = s.y1 + s.dy*u;
    let nx = bl.x - cx, ny = bl.y - cy;
    const d2 = nx*nx + ny*ny;
    if(d2 >= BR*BR) return 0;
    if(s.oneWay && (bl.x - s.x1)*s.nx + (bl.y - s.y1)*s.ny < 0) return 0;
    let d = Math.sqrt(d2);
    if(d < 0.001){ const L = Math.sqrt(s.len2); nx = -s.dy/L; ny = s.dx/L; d = 0; } else { nx /= d; ny /= d; }
    bl.x = cx + nx*BR; bl.y = cy + ny*BR;
    const vn = bl.vx*nx + bl.vy*ny;
    if(vn < 0){
      bl.vx -= (1 + s.e)*vn*nx; bl.vy -= (1 + s.e)*vn*ny;
      // a touch of rolling friction along the wall
      const tx = -ny, ty = nx, vt = bl.vx*tx + bl.vy*ty;
      bl.vx -= vt*0.01*tx; bl.vy -= vt*0.01*ty;
      return -vn;
    }
    return 0;
  }
  // bounce off a round thing (which may be moving: mvx, mvy). kick = a springy push outwards
  function hitCircle(bl, c, e, kick, mvx, mvy){
    let nx = bl.x - c.x, ny = bl.y - c.y;
    const rr2 = BR + c.r, d2 = nx*nx + ny*ny;
    if(d2 >= rr2*rr2) return -1;
    let d = Math.sqrt(d2);
    if(d < 0.001){ nx = 0; ny = -1; d = 0; } else { nx /= d; ny /= d; }
    bl.x = c.x + nx*rr2; bl.y = c.y + ny*rr2;
    mvx = mvx || 0; mvy = mvy || 0;
    const vn = (bl.vx - mvx)*nx + (bl.vy - mvy)*ny;
    let hit = 0;
    if(vn < 0){ bl.vx -= (1 + e)*vn*nx; bl.vy -= (1 + e)*vn*ny; hit = -vn; }
    if(kick){
      const out = bl.vx*nx + bl.vy*ny;
      if(out < kick){ bl.vx += (kick - out)*nx; bl.vy += (kick - out)*ny; }
    }
    return hit;
  }
  // bounce off a unicorn horn - it may be swinging, which is what flicks the ball
  function hitFlip(bl, f){
    const tx = f.x + Math.cos(f.A)*f.L, ty = f.y + Math.sin(f.A)*f.L;
    const dx = tx - f.x, dy = ty - f.y, L2 = dx*dx + dy*dy;
    let u = ((bl.x - f.x)*dx + (bl.y - f.y)*dy)/L2;
    u = u < 0 ? 0 : u > 1 ? 1 : u;
    const cx = f.x + dx*u, cy = f.y + dy*u;
    const rad = f.r0 + (f.r1 - f.r0)*u, rr2 = BR + rad;
    let nx = bl.x - cx, ny = bl.y - cy;
    const d2 = nx*nx + ny*ny;
    if(d2 >= rr2*rr2) return;
    let d = Math.sqrt(d2);
    if(d < 0.001){ nx = dy/Math.sqrt(L2); ny = -dx/Math.sqrt(L2); if(ny > 0){ nx = -nx; ny = -ny; } } else { nx /= d; ny /= d; }
    bl.x = cx + nx*rr2; bl.y = cy + ny*rr2;
    // how fast the horn's surface is moving where it touches the ball
    const fvx = -f.W*(cy - f.y), fvy = f.W*(cx - f.x);
    const vn = (bl.vx - fvx)*nx + (bl.vy - fvy)*ny;
    if(vn < 0){
      bl.vx -= (1 + 0.32)*vn*nx; bl.vy -= (1 + 0.32)*vn*ny;
      if(f.W !== 0 && -vn > 220 && clock - f.sparkT > 0.12){
        f.sparkT = clock;
        burst(cx + nx*rad, cy + ny*rad, 9, 'spark', ['#FFFFFF', '#FFE066', '#FFF3B0', '#FFB3D9'], 180);
        sfx.tink();
      }
    }
    if(f.held && f.W === 0) bl.cradleT = clock;
  }

  function updateFlippers(h){
    for(const f of flips){
      const target = f.held ? f.up : f.rest, sp = f.held ? 26 : 14;
      const old = f.a;
      if(f.a > target) f.a = Math.max(target, f.a - sp*h); else f.a = Math.min(target, f.a + sp*h);
      const da = (f.a - old)/h;
      f.A = f.side ? Math.PI - f.a : f.a;
      f.W = f.side ? -da : da;
    }
  }
  let simT = 0;
  function updateLenny(){
    const L = lenny, w = TAU/L.per;
    L.ang = L.amp*Math.sin(simT*w);
    const dang = L.amp*Math.cos(simT*w)*w;
    L.x = L.px + L.len*Math.sin(L.ang); L.y = L.py + L.len*Math.cos(L.ang);
    const cl = L.len + 32;
    L.cx = L.px + cl*Math.sin(L.ang); L.cy = L.py + cl*Math.cos(L.ang);
    L.vx = cl*dang*Math.cos(L.ang); L.vy = -cl*dang*Math.sin(L.ang);
  }

  function stepBall(bl, h){
    bl.px = bl.x; bl.py = bl.y;
    bl.vy += G*h;
    bl.x += bl.vx*h; bl.y += bl.vy*h;
    // walls
    let wallHit = 0;
    for(let i = 0; i < segs.length; i++){ const v = hitSeg(bl, segs[i]); if(v > wallHit) wallHit = v; }
    if(wallHit > 380 && clock - bl.hitWallT > 0.12){ bl.hitWallT = clock; sfx.wall(wallHit); }
    // the spring in the lane
    if(bl.x > XS && bl.y + BR > plunger.y - 3 && bl.vy > -60){
      // resting on the spring (it rides down with the spring while you pull)
      const hard = bl.vy > 200 && bl.y + BR > plunger.y;
      bl.y = plunger.y - BR; bl.vy = hard ? -bl.vy*0.25 : 0;
      bl.vx *= 0.9;
      bl.x += (565 - bl.x)*0.2;
    }
    for(const p of posts) hitCircle(bl, p, 0.5, 0);
    for(const bm of bumpers){ if(hitCircle(bl, bm, 0.6, 760) >= 0) hitBumper(bm, bl); }
    for(const st of stars){ if(hitCircle(bl, st, 0.55, 0) > 40) hitStar(st); }
    for(const hk of hearts){ if(hitCircle(bl, hk, 0.5, 620) >= 0) hitHeart(hk); }
    if(hitCircle(bl, lenny, 0.65, 0, lenny.vx, lenny.vy) >= 0) hitLenny(bl);
    for(const f of flips) hitFlip(bl, f);
    // speed limit (except in the spring lane, where the launch needs a big push)
    const sp2 = bl.vx*bl.vx + bl.vy*bl.vy;
    if(sp2 > MAXV*MAXV && bl.x < XS){ const k = MAXV/Math.sqrt(sp2); bl.vx *= k; bl.vy *= k; }
    // left the spring lane for the first time: the ball saver switches on
    if(!bl.inField && bl.x < XS - 4){
      bl.inField = true;
      if(!bl.party && !bl.saverGiven){ bl.saverGiven = true; saveT = 15; }
    }
    // up through the rainbow entrance?
    const m = rampMouth;
    const side = (px, py) => (m.x2 - m.x1)*(py - m.y1) - (m.y2 - m.y1)*(px - m.x1);
    if(bl.vy < -90 && side(bl.px, bl.py) > 0 && side(bl.x, bl.y) <= 0){
      const u = ((bl.x - m.x1)*(m.x2 - m.x1) + (bl.y - m.y1)*(m.y2 - m.y1))/((m.x2 - m.x1)**2 + (m.y2 - m.y1)**2);
      if(u > 0.05 && u < 0.95){ startRamp(bl); return; }
    }
    // down a side lane, or down the middle?
    if(bl.y > BOT - 262 && bl.x < 62){ lose(bl, 0); return; }
    if(bl.y > BOT - 262 && bl.x > MX(62) && bl.x < XS){ lose(bl, 1); return; }
    if(bl.y > BOT - 10 && bl.x < XS){ lose(bl, 'bottom'); return; }
    // safety net: if a ball ever escapes the table, put it back in the spring lane
    if(!(isFinite(bl.x) && isFinite(bl.y)) || bl.x < X0 - 12 || bl.x > XR + 12 || bl.y < TOP - 30 || bl.y > BOT + 40){
      Object.assign(bl, {x: 565, y: plunger.rest - BR, vx: 0, vy: 0, inField: false, stillT: 0});
      launchWait = 0.8;
    }
  }
  function ballsTouch(a, b){
    let nx = b.x - a.x, ny = b.y - a.y;
    const d2 = nx*nx + ny*ny;
    if(d2 >= 4*BR*BR || d2 < 0.0001) return;
    const d = Math.sqrt(d2); nx /= d; ny /= d;
    const push = (2*BR - d)/2;
    a.x -= nx*push; a.y -= ny*push; b.x += nx*push; b.y += ny*push;
    const rv = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;
    if(rv < 0){ const j = -rv*0.95; a.vx -= j*nx; a.vy -= j*ny; b.vx += j*nx; b.vy += j*ny; }
  }
  function stepAll(h){
    simT += h;
    updateFlippers(h);
    updateLenny();
    // the spring
    plunger.y = plunger.rest + plunger.pull*34;
    for(const bl of balls) if(bl.mode === 'play') stepBall(bl, h);
    for(let i = 0; i < balls.length; i++){
      if(balls[i].mode !== 'play') continue;
      for(let j = i + 1; j < balls.length; j++) if(balls[j].mode === 'play') ballsTouch(balls[i], balls[j]);
    }
  }
  function physics(dt){
    acc += dt;
    let n = 0;
    while(acc >= STEP && n < 40){ stepAll(STEP); acc -= STEP; n++; }
    if(n >= 40) acc = 0;
  }

  // ===== UPDATE =====
  function update(dt){
    clock += dt;
    const run = playing && !paused;
    if(run){
      // the spring: pulled by a finger on it or the Down / Space key, otherwise it pops by itself
      const pulling = kbPull || [...ptrs.values()].includes('P');
      const lb = laneBall();
      if(lb && pulling){
        const was = plunger.pull;
        plunger.pull = Math.min(1, plunger.pull + dt*1.8);
        if(Math.floor(was*8) !== Math.floor(plunger.pull*8)) sfx.pull();
      } else if(lb && plunger.pull === 0){
        launchWait -= dt;
        if(launchWait <= 0){ launch(autoPower()*rand(0.97, 1.04)); launchWait = 1.4; }
      } else if(!lb){ plunger.pull = Math.max(0, plunger.pull - dt*6); launchWait = Math.max(launchWait, 0.9); }
      physics(dt);
    } else if(!paused){
      // before the game starts: the table still sparkles and Lenny still swings
      simT += dt; updateLenny();
      updateFlippers(dt);
    }
    if(run){
      if(saveT > 0) saveT = Math.max(0, saveT - dt);
      if(partyT > 0){
        partyT -= dt;
        partyNEl.textContent = Math.max(0, Math.ceil(partyT));
        if(!reduced && Math.random() < dt*14) addConfetti(false);
        if(partyT <= 0) endParty();
      }
      if(starsDoneT > 0){ starsDoneT -= dt; if(starsDoneT <= 0) stars.forEach(s => { s.lit = false; s.flash = 1; }); }
      for(const br of bridges){
        br.glow = Math.max(0, br.glow - dt*1.5);
        if(!br.lit && br.relight > 0){ br.relight -= dt; if(br.relight <= 0){ br.lit = true; br.glow = 1; sfx.tink(); } }
      }
      if(nextBallT > 0){ nextBallT -= dt; if(nextBallT <= 0) serveBall(); }
      if(endT > 0){ endT -= dt; if(endT <= 0) endGame(); }
      for(let i = later.length - 1; i >= 0; i--){ later[i].t -= dt; if(later[i].t <= 0){ const fn = later[i].fn; later.splice(i, 1); fn(); } }
      // balls: riding the rainbow, being caught, rolling about
      for(const bl of balls){
        if(bl.mode === 'ramp'){
          bl.rampS += dt*rampLen/1.15;
          if(bl.rampS >= rampLen){ finishRamp(bl); continue; }
          let k = 1; while(k < rampPath.length - 1 && rampPath[k][2] < bl.rampS) k++;
          const a = rampPath[k - 1], b = rampPath[k], u = (bl.rampS - a[2])/Math.max(0.001, b[2] - a[2]);
          bl.x = lerp(a[0], b[0], u); bl.y = lerp(a[1], b[1], u);
          bl.rot += dt*12;
          if(!reduced && Math.random() < dt*30) parts.push({x: bl.x + rand(-6, 6), y: bl.y + rand(-6, 6), vx: 0, vy: 20, life: 0, max: 0.5, kind: 'spark', col: pick(['#FF8FB8', '#FFE066', '#8BE38F', '#7CC7FF', '#B79CFF']), r: rand(3, 6), rot: 0});
        } else if(bl.mode === 'caught'){
          bl.catchT -= dt;
          if(bl.catchT <= 0) release(bl);
        } else if(bl.mode === 'play'){
          bl.rot += bl.vx*dt/BR;
          // stuck? if the ball hasn't really moved for 5 seconds, give it a friendly nudge
          const inLane = bl.x > XS;
          const moved = Math.hypot(bl.x - bl.ax, bl.y - bl.ay);
          if(moved > 22 || inLane || clock - bl.cradleT < 0.2){ bl.ax = bl.x; bl.ay = bl.y; bl.stillT = 0; }
          else {
            bl.stillT += dt;
            if(bl.stillT > 5){
              bl.stillT = 0;
              bl.vx += rand(-220, 220); bl.vy = -rand(420, 620);
              burst(bl.x, bl.y, 10, 'spark');
              popWord('Boop!', bl.x, bl.y - 30, '#7B4FD6', 22, 0.9);
              sfx.kick();
            }
          }
        }
        // the sparkle trail
        if(bl.mode === 'play' || bl.mode === 'ramp'){
          bl.trail.push({x: bl.x, y: bl.y, t: clock});
          while(bl.trail.length && clock - bl.trail[0].t > 0.28) bl.trail.shift();
        } else bl.trail.length = 0;
      }
      if(balls.some(b => b.mode === 'gone')) balls = balls.filter(b => b.mode !== 'gone');
      // bananas Lenny drops
      for(const bn of bananas){
        bn.t += dt; bn.vy += 700*dt; bn.x += bn.vx*dt; bn.y += bn.vy*dt; bn.rot += bn.vr*dt;
        if(!bn.paid && bn.t > 0.7){ bn.paid = true; add(1000, bn.x, bn.y); popWord('Banana!', bn.x, bn.y - 50, '#E0A100', 26, 1); sfx.banana(); burst(bn.x, bn.y, 8, 'spark', ['#FFE066', '#FFFFFF']); }
      }
      bananas = bananas.filter(bn => bn.t < 1.4);
      if(flyer){ flyer.t += dt; if(flyer.t > 2.6) flyer = null; }
      if(babies){ babies.t += dt; if(babies.t > 3.2) babies = null; }
      if(catcher){ catcher.t += dt; if(catcher.t > 1.3) catcher = null; }
    }
    // timers on things that flash and wobble
    for(const bm of bumpers){ bm.flash = Math.max(0, bm.flash - dt*4); bm.cd -= dt; }
    for(const st of stars){ st.flash = Math.max(0, st.flash - dt*3); st.cd -= dt; }
    for(const hk of hearts){ hk.flash = Math.max(0, hk.flash - dt*5); hk.cd -= dt; }
    lenny.cd -= dt; lenny.hitT = Math.max(0, lenny.hitT - dt);
    for(const f of flips){
      f.blink = Math.max(0, f.blink - dt);
      if(!reduced && Math.random() < dt*0.25) f.blink = 0.14;   // blink now and then
    }
    for(const p of parts){ p.life += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 1 - dt*2.5; p.vy *= 1 - dt*2.5; if(p.kind !== 'puff') p.vy += 90*dt; p.rot += dt*3; }
    parts = parts.filter(p => p.life < p.max);
    for(const c of confetti){ c.life += dt; c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt; c.vx += Math.sin(clock*3 + c.rot)*20*dt; }
    confetti = confetti.filter(c => c.y < BOT + 20 && c.life < 9);
    for(const w of words){ w.t += dt; }
    words = words.filter(w => w.t < w.life);
    // the score counts up quickly
    if(shownScore !== score){ shownScore = score - shownScore < 20 ? score : shownScore + Math.ceil((score - shownScore)*Math.min(1, dt*10)); updateHud(false); }
  }

  function updateHud(withBalls){
    scoreNEl.textContent = fmt(shownScore);
    scorePill.setAttribute('aria-label', 'Score: ' + fmt(score));
    if(withBalls){
      let h = '';
      for(let i = 0; i < 3; i++) h += '<span class="bl' + (i < ballsLeft ? '' : ' used') + '"></span>';
      ballIconsEl.innerHTML = h;
      ballsPill.setAttribute('aria-label', 'Balls left: ' + ballsLeft);
    }
  }

  // ===== LAYOUT (works out how big the table is for this screen) =====
  function layout(){
    phone = PHONE.matches;
    const oldTop = TOP, oldBot = BOT;
    let top = 0;
    H = clamp(W*CH/CW, 900, 1400);
    S = Math.min(CW/W, CH/H);
    // on phones the round buttons and the score sit in the top corners - if they would cover the
    // table, leave a strip at the top of the table for them
    if(phone && (CW - W*S)/2 < 150){
      const strip = 50;
      H = clamp(W*CH/CW, 900, 1500);
      S = Math.min(CW/W, CH/H);
      top = strip/S;
      if(H - top < 900){ H = 900 + top; S = Math.min(CW/W, CH/H); top = strip/S; H = Math.max(H, 900 + top); S = Math.min(CW/W, CH/H); }
    }
    TOP = top; BOT = H;
    offX = (CW - W*S)/2; offY = (CH - H*S)/2;
    buildTable();
    // keep any balls in the same place on the table if the screen changed shape mid-game
    if(oldBot){
      const mid = (oldTop + oldBot)/2;
      const move = o => { o.y += o.y > mid ? BOT - oldBot : TOP - oldTop; };
      balls.forEach(b => { move(b); if(b.mode === 'play' && b.x > XS) b.y = Math.min(b.y, plunger.rest - BR); b.ax = b.x; b.ay = b.y; b.trail.length = 0; });
      bananas.forEach(move);
    }
    updateLenny();
    drawBackground();
  }

  // ===== THE BACKGROUND AND THE TABLE (drawn once for each screen size) =====
  const RAIN = ['#FF8FB8', '#FFB86B', '#FFE066', '#8BE38F', '#7CC7FF', '#B79CFF'];
  const bgc = document.createElement('canvas');
  function tablePath(g){
    g.beginPath();
    g.moveTo(X0, BOT); g.lineTo(X0, dome.cy);
    g.arc(dome.cx, dome.cy, dome.R, Math.PI, Math.PI*2);
    g.lineTo(XR, BOT); g.closePath();
  }
  function fluffy(g, x, y, s, col){
    g.fillStyle = col;
    [[-26, 4, 16], [26, 4, 16], [-8, -8, 20], [12, -6, 18], [0, 8, 18]].forEach(([a, b, r]) => { g.beginPath(); g.arc(x + a*s, y + b*s, r*s, 0, TAU); g.fill(); });
  }
  function drawBackground(){
    bgc.width = cvs.width; bgc.height = cvs.height;
    const g = bgc.getContext('2d');
    g.setTransform(PX, 0, 0, PX, 0, 0);
    // soft sky
    const sky = g.createLinearGradient(0, 0, 0, CH);
    sky.addColorStop(0, '#CFE6FF'); sky.addColorStop(0.6, '#EFE3FF'); sky.addColorStop(1, '#FDE2EC');
    g.fillStyle = sky; g.fillRect(0, 0, CW, CH);
    const sideL = offX, sideR = CW - offX - W*S, side = Math.min(sideL, sideR);
    if(Math.max(sideL, sideR) > 30){
      // a big rainbow behind the table, clouds and twinkles either side
      g.save(); g.globalAlpha = 0.42; g.lineWidth = Math.max(10, CH*0.03);
      const rad = Math.max(CW*0.55, CH*0.75);
      RAIN.forEach((c, i) => { g.strokeStyle = c; g.beginPath(); g.arc(CW/2, CH*1.08, rad - i*g.lineWidth, Math.PI, TAU); g.stroke(); });
      g.restore();
      for(let i = 0; i < 12; i++){
        const left = i % 2 === 0, sw = left ? sideL : sideR;
        if(sw < 30) continue;
        const x = left ? hash(i)*sw*0.8 + sw*0.1 : CW - sw + hash(i)*sw*0.8 + sw*0.1;
        const y = hash(i + 20)*CH*0.9 + CH*0.05, s = clamp(sw/260, 0.35, 1.1)*(0.7 + hash(i + 40)*0.5);
        g.globalAlpha = 0.85; fluffy(g, x, y, s, '#FFFFFF'); g.globalAlpha = 1;
      }
      for(let i = 0; i < 26; i++){

  // ----- Rainbow, flying across the top (drawn like in Glitter Sky Unicorn) -----

      ctx.save();
      ctx.strokeStyle = 'rgba(123,79,214,0.5)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(MID, BOT - 18, 30, -Math.PI/2, -Math.PI/2 + TAU*saveT/15); ctx.stroke();
      ctx.restore();
    }
  }

  function drawParts(){
    for(const p of parts){
      const u = p.life/p.max;
      ctx.globalAlpha = 1 - u;
      if(p.kind === 'puff'){ ctx.fillStyle = p.col; circ(p.x, p.y, p.r*(1 + u)); ctx.fill(); }
      else if(p.kind === 'heart'){ heartPath(ctx, p.x, p.y, p.r); ctx.fillStyle = p.col; ctx.fill(); }
      else star4(ctx, p.x, p.y, p.r*(1 - u*0.5), p.rot, p.col);
    }
    ctx.globalAlpha = 1;
    for(const c of confetti){
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.fillStyle = c.col; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h*Math.abs(Math.cos(c.rot*1.3)) + 1);
      ctx.restore();
    }
  }
  function drawWords(){
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for(const w of words){
      const u = w.t/w.life;
      const pop = easeBack(Math.min(1, w.t*6));
      ctx.globalAlpha = u > 0.75 ? (1 - u)/0.25 : 1;
      ctx.font = Math.round(w.size*pop) + 'px ' + FONT;
      const y = w.y - w.t*28;
      const x = clamp(w.x, X0 + ctx.measureText(w.text).width/2 + 4, XS - ctx.measureText(w.text).width/2 - 4);
      ctx.lineWidth = Math.max(4, w.size*0.2); ctx.strokeStyle = '#FFFFFF'; ctx.strokeText(w.text, x, y);
      ctx.fillStyle = w.col; ctx.fillText(w.text, x, y);
    }
    ctx.restore();
  }
  function drawFlyer(){
    if(!flyer) return;
    const u = flyer.t/2.6;
    const x = lerp(-110, W + 110, u), y = TOP + 118 + Math.sin(u*TAU)*14;
    ctx.save();
    ctx.beginPath(); rr(ctx, 0, 0, W, H, 30); ctx.clip();
    drawRainbowFlying(x, y, 0.8, clock, u > 0.1 && u < 0.8);
    // "Wheee!" bubble
    if(u > 0.08 && u < 0.85){
      const bx = x + 70, by = y - 78;
      ctx.fillStyle = 'rgba(255,255,255,0.95)'; rr(ctx, bx - 44, by - 20, 88, 38, 18); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - 24, by + 14); ctx.lineTo(bx - 34, by + 32); ctx.lineTo(bx - 10, by + 16); ctx.closePath(); ctx.fill();
      ctx.font = '24px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FF4F9A'; ctx.fillText('Wheee!', bx, by);
    }
    ctx.restore();
  }

  // ===== DRAW =====
  function draw(){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgc, 0, 0);
    ctx.setTransform(PX*S, 0, 0, PX*S, PX*offX, PX*offY);
    drawPartyLetters();
    drawBridges();
    drawStars();
    drawHearts();
    // the rainbow shines while a ball rides it
    if(balls.some(b => b.mode === 'ramp')){
      ctx.save(); ctx.globalAlpha = 0.35 + 0.2*Math.sin(clock*12);
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); rampPath.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      ctx.restore();
    }
    drawBumpers();
    drawLenny();
    bananas.forEach(drawBanana);
    drawSpring();
    drawBabies();
    ctx.save(); ctx.beginPath(); rr(ctx, 0, 0, W, H, 30); ctx.clip();
    flips.forEach(drawHead);
    ctx.restore();
    for(const bl of balls) if(bl.mode === 'play') drawBall(bl, 0);
    drawCatcher();
    for(const bl of balls) if(bl.mode === 'caught'){ bl.trail.length = 0; if(bl.catchKind === 'cloud'){ bl.x = MID; bl.y = BOT - 44 - Math.sin(clock*8)*2; } drawBall(bl, 0); }
    for(const bl of balls) if(bl.mode === 'ramp') drawBall(bl, 1);
    drawParts();
    drawFlyer();
    drawWords();
  }

  // ===== CONTROLS =====
  // Tap the left half of the screen for Starlight's horn, the right half for Rainbow's. Both at once works.
  const LEFT_KEYS = new Set(['ArrowLeft', 'KeyZ', 'ShiftLeft', 'KeyA']);
  const RIGHT_KEYS = new Set(['ArrowRight', 'KeyM', 'ShiftRight', 'Slash', 'KeyL']);
  function setHeld(f, v){
    if(v && !f.held){
      sfx.flick(f.side);
      f.blink = 0.18;
      if(clock - f.whinT > 0.55){ f.whinT = clock; sfx.whinny(f.side); }
    }
    f.held = v;
  }
  function syncControls(){
    const roles = [...ptrs.values()];
    const both = keys.has('both');
    let l = both || roles.includes('L'), r = both || roles.includes('R');
    for(const k of keys){ if(LEFT_KEYS.has(k)) l = true; if(RIGHT_KEYS.has(k)) r = true; }
    if(!playing || paused){ l = false; r = false; }
    setHeld(flips[0], l); setHeld(flips[1], r);
  }
  function releaseSpring(){
    if(plunger.pull > 0.04 && laneBall()){ const p = plunger.pull; launch(autoPower()*lerp(0.92, 1.1, p)); launchWait = 1.4; }
    plunger.pull = 0;
  }
  function boardPos(e){
    const r = board.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    return {px, py, x: (px - offX)/S, y: (py - offY)/S};
  }
  board.addEventListener('pointerdown', e => {
    if(!overlay.hidden || (e.target.closest && e.target.closest('button, a'))) return;
    e.preventDefault();
    wake(); startMusic();
    try { board.setPointerCapture(e.pointerId); } catch(err){}
    if(!playing || paused) return;
    const p = boardPos(e);
    let role = p.px < CW/2 ? 'L' : 'R';
    if(laneBall() && p.x > XS - 40 && p.x < W + 20 && p.y > plunger.rest - 200) role = 'P';
    ptrs.set(e.pointerId, role);
    syncControls();
  });
  const up = e => {
    const role = ptrs.get(e.pointerId);
    if(role === undefined) return;
    ptrs.delete(e.pointerId);
    syncControls();
    if(role === 'P' && ![...ptrs.values()].includes('P') && !kbPull) releaseSpring();
  };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => board.addEventListener(t, up));
  board.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if(!overlay.hidden){
      if(e.code === 'Enter' || e.code === 'Space'){
        const a = document.activeElement;
        if(a && a.tagName === 'BUTTON' && overlay.contains(a)) return;
        e.preventDefault(); ovBtn.click();
      }
      return;
    }
    const c = e.code, a = document.activeElement, onBtn = a && (a.tagName === 'BUTTON' || a.tagName === 'A');
    if(LEFT_KEYS.has(c) || RIGHT_KEYS.has(c)){ keys.add(c); e.preventDefault(); }
    else if(c === 'ArrowDown' || c === 'Space' || c === 'Enter'){
      if(onBtn && c !== 'ArrowDown') return;
      e.preventDefault();
      if(laneBall() || kbPull) kbPull = true;
      else if(c !== 'ArrowDown') keys.add('both');
    } else if(c === 'ArrowUp'){ keys.add('both'); e.preventDefault(); }
    else return;
    wake(); startMusic();
    syncControls();
  });
  addEventListener('keyup', e => {
    const c = e.code;
    keys.delete(c);
    if(c === 'Space' || c === 'ArrowUp' || c === 'Enter') keys.delete('both');
    if((c === 'ArrowDown' || c === 'Space' || c === 'Enter') && kbPull){ kbPull = false; if(![...ptrs.values()].includes('P')) releaseSpring(); }
    syncControls();
  });
  function letGo(){ keys.clear(); ptrs.clear(); kbPull = false; plunger.pull = 0; syncControls(); }
  addEventListener('blur', letGo);
  document.addEventListener('visibilitychange', () => {
    letGo();
    if(document.hidden && playing && !over){ paused = true; showPanel('pause'); }
    if(!actx) return;
    if(document.hidden) actx.suspend(); else actx.resume();
  });

  // ===== START, PAUSE AND END PANEL =====
  const starSvg = on => '<svg viewBox="0 0 24 24" class="' + (on ? 'on' : 'off') + '" aria-hidden="true"><path d="M12 2.2 14.9 8.4 21.7 9.2 16.6 13.8 18 20.6 12 17.1 6 20.6 7.4 13.8 2.3 9.2 9.1 8.4Z" fill="' + (on ? '#FFD43B' : '#EDE7F6') + '" stroke="' + (on ? '#E0A100' : '#C9B8F0') + '" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  function starsFor(s){ return s >= 40000 ? 3 : s >= 8000 ? 2 : 1; }
  let panelMode = 'start';
  function showPanel(mode){
    panelMode = mode;
    ovScore.hidden = ovStars.hidden = ovBest.hidden = true;
    ovKey.hidden = mode !== 'start';
    if(mode === 'start'){
      ovTitle.textContent = 'Unicorn Pinball';
      ovText.hidden = false;
      ovText.textContent = "Flick the sparkly ball with Starlight's and Rainbow's magic horns! Bounce off the cotton candy clouds, light up all the glitter stars and bop cheeky Lenny for a banana.";
      if(best > 0){ ovBest.hidden = false; ovBest.textContent = 'Best score: ' + fmt(best); }
      ovBtn.textContent = "Let's play! ▶";
    } else if(mode === 'pause'){
      ovTitle.textContent = 'Paused';
      ovText.hidden = false; ovText.textContent = 'The ball is waiting for you.';
      ovBtn.textContent = 'Keep playing ▶';
    } else {
      const n = starsFor(score), newBest = score > best;
      if(newBest){ best = score; save(KEY + 'best', best); }
      ovTitle.textContent = 'What a game!';
      ovText.hidden = true;
      ovScore.hidden = false; ovScore.textContent = fmt(score);
      ovStars.hidden = false; ovStars.innerHTML = starSvg(true) + starSvg(n >= 2) + starSvg(n >= 3);
      ovStars.setAttribute('aria-label', n + (n === 1 ? ' star' : ' stars'));
      ovBest.hidden = false;
      ovBest.className = newBest && score > 0 ? 'newbest' : 'best';
      ovBest.textContent = newBest && score > 0 ? 'New best score!' : 'Best score: ' + fmt(best);
      ovBtn.textContent = 'Play again ▶';
    }
    overlay.hidden = false;
    setTimeout(() => { try { ovBtn.focus({preventScroll: true}); } catch(e){} }, 50);
  }
  function endGame(){
    playing = false; over = true;
    letGo();
    sfx.end();
    for(let i = 0; i < (reduced ? 15 : 60); i++) addConfetti(true);
    showPanel('end');
  }
  function buildKey(){
    const rows = [['👈 Tap the left side', "Starlight's horn"], ['👉 Tap the right side', "Rainbow's horn"], ['⌨️ ← or Z, → or M', 'flick the horns'], ['⌨️ ↓ or Space', 'pull the spring (or just wait)']];
    ovKey.innerHTML = rows.map(r => '<span>' + r[0] + '</span><span>' + r[1] + '</span>').join('');
  }
  ovBtn.addEventListener('click', () => {
    wake(); startMusic();
    overlay.hidden = true;
    ovBtn.blur();
    if(panelMode === 'pause' && playing){ paused = false; return; }
    started = true;
    newGame();
  });

  // ===== SIZE AND LOOP =====
  function resize(){
    const r = board.getBoundingClientRect(), dpr = Math.min(2.5, window.devicePixelRatio || 1);
    if(r.width < 2 || r.height < 2) return;
    if(Math.abs(r.width - CW) < 0.5 && Math.abs(r.height - CH) < 0.5 && cvs.width === Math.round(r.width*dpr) && dome) return;
    CW = r.width; CH = r.height;
    cvs.width = Math.round(r.width*dpr); cvs.height = Math.round(r.height*dpr);
    PX = cvs.width/r.width;
    layout();
  }
  addEventListener('resize', resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(board);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(dome) drawBackground(); });

  let last = performance.now();
  let oops = 0;
  function loop(t){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, Math.max(0, (t - last)/1000)); last = t;
    try { update(dt); draw(); }
    catch(e){ if(oops++ < 3) console.error(e); }
  }

  /* test-hook */
  resize();
  buildKey();
  showPanel('start');
  updateHud(true);
  requestAnimationFrame(loop);
  /* end of game code */
})();
</script>
</body>
