<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .tw2{animation-delay:.4s}.tw3{animation-delay:.8s}.tw4{animation-delay:1.2s}
    .glow{animation:glow 1.8s ease-in-out infinite}
    .sp{animation:sp 2s ease-in-out infinite}
    .sp2{animation-delay:.7s}.sp3{animation-delay:1.3s}
    .trail{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.4s ease-out forwards}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(8deg)}}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:.95}}
    @keyframes sp{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){.bob,.tw,.glow,.sp{animation:none}.trail{animation:none;stroke-dashoffset:0}}
    .e{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle;dominant-baseline:central}
  </style>
  <defs>
    <pattern id="chk" width="120" height="120" patternUnits="userSpaceOnUse" x="20" y="30">
      <rect width="120" height="120" fill="#EAF7EC"/>
      <rect x="60" width="60" height="60" fill="#DDF1E1"/>
      <rect y="60" width="60" height="60" fill="#DDF1E1"/>
    </pattern>
    <radialGradient id="gold">
      <stop offset="0" stop-color="#FFC23D" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFC23D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="400" height="300" fill="#CFEFD8"/>
  <rect x="20" y="30" width="360" height="240" fill="url(#chk)"/>

  <!-- rainbow trail -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5" opacity=".9">
    <polyline class="trail" stroke="#FF6B6B" points="39,49 39,169 219,169 219,109"/>
    <polyline class="trail" stroke="#FFA94D" points="43.5,53.5 43.5,173.5 223.5,173.5 223.5,113.5"/>
    <polyline class="trail" stroke="#FFD43B" points="48,58 48,178 228,178 228,118"/>
    <polyline class="trail" stroke="#69DB7C" points="52.5,62.5 52.5,182.5 232.5,182.5 232.5,122.5"/>
    <polyline class="trail" stroke="#4DABF7" points="57,67 57,187 237,187 237,127"/>
    <polyline class="trail" stroke="#9775FA" points="61.5,71.5 61.5,191.5 241.5,191.5 241.5,131.5"/>
  </g>

  <!-- rainbow gate -->
  <circle class="glow" cx="350" cy="240" r="46" fill="url(#gold)"/>
  <text class="e" x="350" y="242" font-size="42">🌈</text>

  <!-- stars -->
  <g class="tw"><text class="e" x="170" y="60" font-size="32">⭐</text></g>
  <g class="tw tw2"><text class="e" x="350" y="120" font-size="32">⭐</text></g>
  <g class="tw tw3"><text class="e" x="110" y="240" font-size="32">⭐</text></g>
  <g class="tw tw4"><text class="e" x="290" y="60" font-size="32">⭐</text></g>

  <!-- hedges -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#2E6E61" stroke-width="11">
      <rect x="20" y="30" width="360" height="240" rx="6"/>
      <path d="M80 30V150 M140 90H260 M260 90V210 M80 150H200 M320 30V150 M20 210H140 M200 210V270 M320 210H380"/>
    </g>
    <g stroke="#4C9A7E" stroke-width="3.5">
      <rect x="20" y="30" width="360" height="240" rx="6"/>
      <path d="M80 30V150 M140 90H260 M260 90V210 M80 150H200 M320 30V150 M20 210H140 M200 210V270 M320 210H380"/>
    </g>
  </g>

  <!-- unicorn -->
  <ellipse cx="230" cy="147" rx="20" ry="5" fill="#1F4F45" opacity=".18"/>
  <g class="bob">
    <circle cx="230" cy="118" r="25" fill="#fff" stroke="#F2559B" stroke-width="4.5"/>
    <text class="e" x="230" y="120" font-size="34">🦄</text>
  </g>

  <!-- sparkles -->
  <g fill="#FFC23D">
    <path class="sp" d="M268 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path class="sp sp2" d="M196 128l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/>
    <path class="sp sp3" d="M372 188l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z"/>
  </g>
  <g fill="#F2559B">
    <path class="sp sp3" d="M120 18l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path class="sp sp2" d="M300 282l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" transform="translate(0,-14)"/>
  </g>
</svg>
