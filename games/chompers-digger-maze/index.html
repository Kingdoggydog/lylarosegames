<html lang="en-AU">
<head>

<title>Chomper's Digger Maze - Free Digger Maze Game for Kids | Lyla Rose Games</title>

<style>
  :root{
    color-scheme: light;
    --bg1:#FFF1C9;
    --bg2:#FFDCA8;
    --purple:#7B4FD6;
    --purple-d:#5A2FA0;
    --pink:#FF4F9A;
    --pink-d:#C9306F;
    --gold:#FFC23D;
    --yel:#FFD43B;
    --ink:#2F2350;
    --card:#FFFFFFD9;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);
    background-color:var(--bg1);
    color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif;
    /* fill the screen exactly, keeping clear of notches and rounded corners */
    height:100vh;height:100dvh;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    box-sizing:border-box;
    overflow:hidden;
  }
  .wrap{max-width:1100px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  /* the bar along the top: back link, title and what you have collected */
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  h1{flex:1 1 auto;font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;font-size:clamp(26px,4.6vw,40px);margin:0;line-height:1;color:var(--purple);text-shadow:2px 2px 0 #fff;text-wrap:balance}
  .stats{display:flex;gap:6px;flex-wrap:wrap}
  .pill{background:var(--card);border-radius:999px;padding:5px 11px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;min-height:24px}
  .pill img{width:24px;height:24px;display:block}
  .pill.bump{animation:bump .5s ease-out}
  .pill.done{background:#E9F9EC}
  @keyframes bump{40%{transform:scale(1.25)}}
  .back{font-weight:800;color:var(--purple-d);text-decoration:none;background:var(--card);padding:0 14px;border-radius:999px;font-size:15px;min-height:44px;display:inline-flex;align-items:center;box-sizing:border-box;white-space:nowrap}
  .back:hover{text-decoration:underline}
  /* the maze fills whatever space is left over (the game works out the exact size) */
  .stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
  .board{position:relative;width:300px;height:300px;border-radius:18px;overflow:hidden;background:#E8C98C;box-shadow:0 10px 30px #5A2FA033;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  /* buttons under the maze */
  .controls{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:6px;touch-action:none}
  .pad button{padding:0;font-size:24px;background:#E8A200;border-radius:14px;box-shadow:0 4px 0 #B87F00;min-width:0;min-height:0}
  .pad button:active,.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 #B87F00}
  .pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
  .help{font-size:14px;margin:0;max-width:36ch;font-weight:600}
  .help b{color:#8A5A34}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-weight:800;cursor:pointer;border:none;border-radius:12px;padding:10px 16px;background:var(--purple);color:#fff;font-size:16px;min-height:48px;min-width:48px;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  button.ghost{background:var(--card);color:var(--ink)}
  button.ghost.off{opacity:.6;text-decoration:line-through}
  #hintBtn{background:var(--yel);color:var(--ink);display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 #E8A200;padding:6px 14px}
  #hintBtn svg{width:34px;height:34px;display:block}
  #hintBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #E8A200}
  .lbl{white-space:nowrap}
  @media (hover:hover) and (pointer:fine){.pad{display:none}}
  @media (pointer:coarse) and (min-width:700px) and (min-height:700px){ .pad{grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px)} .pad button{font-size:28px} }
  @media (max-height:760px){ .help{display:none} h1{font-size:30px} }

  /* the panels (level picker, level done, dino bones) */
  .overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#2F2350A6;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));box-sizing:border-box}
  .panel{background:#fff;border-radius:20px;padding:16px 18px;text-align:center;max-width:480px;width:100%;max-height:100%;box-sizing:border-box;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px #2F235055}
  .panel h2{font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;font-size:32px;margin:0;color:var(--purple);line-height:1.05}
  .panel p{margin:0;font-size:16px}
  .panel p.small{font-size:14px;font-weight:800;color:#6B5A8E}
  .panel .hero{width:100%;max-width:300px;height:auto;aspect-ratio:2/1;align-self:center}
  .panel .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .panel .lr-share{align-self:center;font-size:15px}
  #ovBtn{background:var(--pink);box-shadow:0 5px 0 var(--pink-d);font-size:22px;padding:12px 22px;min-height:56px}
  #ovBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-d)}
  .panel button.ghost{background:#F1EBFF;color:var(--ink)}
  /* level picker */
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .levels button{background:#FFF4D6;color:var(--ink);padding:6px 4px 5px;border-radius:14px;box-shadow:0 3px 0 #E8C77A;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;line-height:1.1;min-width:0;position:relative}
  .levels button .num{font-family:"Chewy",cursive;font-weight:400;font-size:24px;color:#B87F00;line-height:1}
  .levels button .nm{font-weight:800}
  .levels button .st{font-size:15px;letter-spacing:1px;color:#E9DFC4}
  .levels button .st i{font-style:normal;color:#FFB000}
  .levels button .bn{position:absolute;right:5px;top:4px;width:22px;height:22px}
  .levels button.now{background:#FFE08A;outline:3px solid #FFB000}
  .levels button:disabled{opacity:.55;cursor:default;box-shadow:none;background:#EEE9F5}
  .key{font-size:14px;display:grid;grid-template-columns:auto auto;justify-content:center;gap:3px 10px;text-align:left}
  .key b{color:#8A5A34}
  @media (max-height:700px){ .key{display:none} }
  /* level done */
  .stars{display:flex;justify-content:center;gap:6px}
  .stars svg{width:56px;height:56px}
  .stars svg.on{animation:pop .5s ease-out both}
  .stars svg:nth-child(2){animation-delay:.25s}.stars svg:nth-child(3){animation-delay:.5s}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .got{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:18px}
  .got span{display:inline-flex;align-items:center;gap:4px}
  .got img{width:36px;height:36px}
  /* dino bones */
  .skel{width:100%;max-width:400px;height:auto;aspect-ratio:400/230;align-self:center;background:#FFF4DE;border-radius:14px;box-shadow:inset 0 -8px 0 #E9CFA2}
  .say{font-family:"Chewy",cursive;font-size:26px;color:var(--purple);line-height:1.1}
  @media (max-height:520px){
    .panel{padding:10px 14px;gap:6px;max-width:620px}
    .panel h2{font-size:26px}
    .panel p{font-size:14px}
    .panel .hero{display:none}
    .key{display:none}
    .levels{grid-template-columns:repeat(6,1fr);gap:6px}
    .levels button .nm{font-size:11px}
    .stars svg{width:42px;height:42px}
    .got img{width:28px;height:28px}
    .skel{max-width:300px}
    #ovBtn{min-height:50px;font-size:20px;padding:8px 18px}
  }

  /* ===== PHONES ONLY: the maze gets the whole screen, everything else floats over the spare space ===== */
  @media (max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) {
    body{padding:0}
    .wrap{display:block;max-width:none;height:100%}
    h1,.help{display:none}
    .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
    /* the stage covers the screen (inside the safe area); the maze sits in the middle of the space left over */
    .stage{position:fixed;z-index:0;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);
      box-sizing:border-box;padding:52px 6px 134px}
    .board{border-radius:14px}
    /* back, levels, music and sound: small round buttons in the top-left corner */
    .back,#lvlBtn,#musicBtn,#sfxBtn{position:fixed;z-index:3;top:calc(6px + env(safe-area-inset-top,0px));width:40px;height:40px;min-width:40px;min-height:40px;padding:0;border-radius:50%;
      display:grid;place-items:center;font-size:19px;background:#FFFFFFC7;box-shadow:0 2px 8px #2F235026;text-decoration:none}
    .back{left:calc(6px + env(safe-area-inset-left,0px));font-size:22px}
    #lvlBtn{left:calc(50px + env(safe-area-inset-left,0px))}
    #musicBtn{left:calc(94px + env(safe-area-inset-left,0px))}
    #sfxBtn{left:calc(138px + env(safe-area-inset-left,0px))}
    /* what you have collected: small see-through pills in the top-right corner */
    .stats{position:fixed;z-index:3;top:calc(12px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));gap:3px;flex-wrap:nowrap;justify-content:flex-end;pointer-events:none}
    #lvlPill{display:none}
    .pill{font-size:12px;padding:3px 7px 3px 4px;background:#FFFFFFB8;gap:2px;min-height:0}
    .pill img{width:20px;height:20px}
    /* the arrows by the left thumb, the hint hard hat by the right thumb */
    .pad{position:fixed;z-index:3;left:calc(8px + env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
      grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:5px}
    .pad button{background:#E8A200E6;font-size:24px}
    #hintBtn{position:fixed;z-index:3;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
      width:66px;height:66px;padding:0;border-radius:50%;justify-content:center;box-shadow:0 4px 0 #E8A200,0 4px 12px #2F235033}
    #hintBtn svg{width:44px;height:44px}
    /* sideways: maze in the middle, buttons and arrows in the left gap, collected things and hint in the right gap */
    @media (orientation: landscape) {
      .stage{padding:6px 92px 6px 198px}
      .stats{flex-direction:column;align-items:flex-end;top:calc(8px + env(safe-area-inset-top,0px))}
    }
  }
</style>

<script>
(() => {
  // ===== SETUP =====
  const $ = id => document.getElementById(id);
  const cvs = $('c'), ctx = cvs.getContext('2d');
  const board = $('board'), stage = $('stage'), overlay = $('overlay'), panel = $('panel');
  const lvlPill = $('lvlPill'), nugPill = $('nugPill'), hatPill = $('hatPill'), bonePill = $('bonePill');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TEST = /[?&]test\b/.test(location.search);
  const FONT = '"Chewy","Comic Sans MS",cursive';
  const TAU = Math.PI*2;
  const O = '#2F2350';                      // outline colour
  const KEY = 'lrg-chompers-digger-maze-';
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // directions: 0 up, 1 right, 2 down, 3 left
  const OPEN = 0, DIRT = 1, FENCE = 2, ROCK = 3, EDGE = 4, GATE = 5;

  const rand = (a, b) => a + Math.random()*(b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a)*u;
  const ease = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
  function rr(g, x, y, w, h, r){
    r = Math.max(0, Math.min(r, w/2, h/2));
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function ell(g, x, y, rx, ry, rot){ g.beginPath(); g.ellipse(x, y, Math.max(0.001, rx), Math.max(0.001, ry), rot || 0, 0, TAU); }
  function line(g, x1, y1, x2, y2){ g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  function poly(g, pts){ g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
  function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  // ===== THE LEVELS =====
  // n = maze size, dirt = how many walls are soft dirt, rock = how many of the other walls are rocks
  const LEVELS = [
    {name: 'Little Sandpit',  icon: '🏖️', n: 7,  dirt: 0.6,  rock: 0,    fence: 'timber',  nug: 3, hat: 1, puddles: 0, button: false,
      ground: '#F8E2A6', ground2: '#F2D592', edge: '#E7C27C', say: 'Brown dirt? Dig right through it!'},
    {name: 'Building Site',   icon: '🚧', n: 8,  dirt: 0.45, rock: 0,    fence: 'barrier', nug: 4, hat: 2, puddles: 0, button: false,
      ground: '#F0DBAE', ground2: '#E8CF9C', edge: '#D9B57A', say: 'Orange fences are too strong to dig!'},
    {name: 'Rocky Quarry',    icon: '🪨', n: 9,  dirt: 0.4,  rock: 0.5,  fence: 'barrier', nug: 5, hat: 2, puddles: 0, button: false,
      ground: '#EADFC9', ground2: '#E0D3B9', edge: '#CDBB9A', say: 'Grey rocks are too hard. Look for brown dirt!'},
    {name: 'Muddy Puddles',   icon: '💦', n: 10, dirt: 0.4,  rock: 0.35, fence: 'barrier', nug: 5, hat: 2, puddles: 7, button: false,
      ground: '#E4DCA8', ground2: '#DBD197', edge: '#C7B983', say: 'Splash through the muddy puddles!'},
    {name: 'Big Red Button',  icon: '🔴', n: 11, dirt: 0.38, rock: 0.35, fence: 'barrier', nug: 6, hat: 2, puddles: 2, button: true,
      ground: '#ECE6DA', ground2: '#E3DCCD', edge: '#CFC5B2', say: 'The gate is shut! Find the big red button!'},
    {name: 'Dino Dig',        icon: '🦕', n: 13, dirt: 0.38, rock: 0.4,  fence: 'barrier', nug: 7, hat: 3, puddles: 3, button: false,
      ground: '#F3CF9B', ground2: '#EBC28A', edge: '#D9A86A', say: 'The very last dinosaur bone is in here!'}

  // ===== GAME STATE =====
  let level = 0, lv = LEVELS[0], NX = 7, NY = 7;
  let wR = [], wD = [];          // wR[y][x] = the wall to the right of square x,y ; wD[y][x] = the wall below it

  // ===== THE MAZE =====
  function wallType(x, y, d){
    const nx = x + DX[d], ny = y + DY[d];
    if(x === NX - 1 && y === NY - 1 && d === exitDir()) return GATE;
    if(nx < 0 || ny < 0 || nx >= NX || ny >= NY) return EDGE;
    if(d === 1) return wR[y][x];
    if(d === 3) return wR[y][x - 1];
    if(d === 2) return wD[y][x];
    return wD[y - 1][x];
  }
  function setWall(x, y, d, v){
    if(d === 1) wR[y][x] = v; else if(d === 3) wR[y][x - 1] = v; else if(d === 2) wD[y][x] = v; else wD[y - 1][x] = v;
  }
  const isOpen = (x, y, d) => wallType(x, y, d) === OPEN;

  function makeMaze(R){
    const n = lv.n; NX = NY = n;
    wR = Array.from({length: n}, () => new Array(n).fill(FENCE));
    wD = Array.from({length: n}, () => new Array(n).fill(FENCE));
    // 1. an ordinary maze where every square can be reached (no digging needed)
    const seen = Array.from({length: n}, () => new Array(n).fill(false));
    // (Tipper's exit square is left out for now, so it ends up as a dead end you only drive into on purpose)
    seen[n - 1][n - 1] = true;
    const stack = [[0, 0]]; seen[0][0] = true;
    while(stack.length){
      const [x, y] = stack[stack.length - 1];
      const opts = [0, 1, 2, 3].filter(d => { const nx = x + DX[d], ny = y + DY[d]; return nx >= 0 && ny >= 0 && nx < n && ny < n && !seen[ny][nx]; });
      if(!opts.length){ stack.pop(); continue; }
      const d = opts[Math.floor(R()*opts.length)];
      setWall(x, y, d, OPEN); seen[y + DY[d]][x + DX[d]] = true; stack.push([x + DX[d], y + DY[d]]);
    }
    if(R() < 0.5) wR[n - 1][n - 2] = OPEN; else wD[n - 2][n - 1] = OPEN;
    // 2. a few extra gaps, so there is more than one way round
    for(let i = 0; i < Math.round(n*n*0.03); i++){
      const x = Math.floor(R()*(n - 1)), y = Math.floor(R()*(n - 1));
      if(R() < 0.5) wR[y][x] = OPEN; else wD[y][x] = OPEN;
    }
    // 3. now turn some of the walls into soft dirt (shortcuts), and some of the rest into rocks
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
      [[wR, x < n - 1], [wD, y < n - 1]].forEach(([w, inside]) => {
        if(!inside || w[y][x] === OPEN) return;
        w[y][x] = R() < lv.dirt ? DIRT : (R() < lv.rock ? ROCK : FENCE);

    }
  }
  // how far each square is from a square, going only through open gaps
  function distances(sx, sy, allowDirt){
    const D = Array.from({length: NY}, () => new Array(NX).fill(-1));
    const q = [[sx, sy]]; D[sy][sx] = 0;
    while(q.length){
      const [x, y] = q.shift();
      for(let d = 0; d < 4; d++){
        const t = wallType(x, y, d);
        if(!(t === OPEN || (allowDirt && t === DIRT))) continue;
        const nx = x + DX[d], ny = y + DY[d];
        if(D[ny][nx] < 0){ D[ny][nx] = D[y][x] + 1; q.push([nx, ny]); }
      }
    }
    return D;
  }
  function openCount(x, y){ let c = 0; for(let d = 0; d < 4; d++) if(isOpen(x, y, d)) c++; return c; }

  function placeThings(R){
    const D = distances(0, 0, false), E = distances(NX - 1, NY - 1, false);
    let maxD = 0; for(let y = 0; y < NY; y++) for(let x = 0; x < NX; x++) maxD = Math.max(maxD, D[y][x]);
    const taken = new Set(['0,0', (NX - 1) + ',' + (NY - 1)]);
    const cells = [];
    for(let y = 0; y < NY; y++) for(let x = 0; x < NX; x++) if(!taken.has(x + ',' + y)) cells.push({x, y, d: D[y][x], e: E[y][x], end: openCount(x, y) === 1});
    const free = c => !taken.has(c.x + ',' + c.y);
    const near = (c, min) => items.some(it => Math.abs(it.x - c.x) + Math.abs(it.y - c.y) < min) || (button && Math.abs(button.x - c.x) + Math.abs(button.y - c.y) < min);
    const take = (c, kind) => { taken.add(c.x + ',' + c.y); items.push({x: c.x, y: c.y, kind, got: false, ph: R()*6}); };
    items = []; button = null; puddles = [];

      const opts = cells.filter(c => c.d >= maxD*0.35 && c.e >= maxD*0.45).sort((a, b) => (b.end - a.end) || (R() - 0.5));
      const c = opts[0] || cells[Math.floor(R()*cells.length)];
      button = {x: c.x, y: c.y, pressed: false, t: 0}; taken.add(c.x + ',' + c.y);
    }
    // the dinosaur bone: a long way from the start, in a dead end if there is one
    {
      const far = cells.filter(c => free(c) && c.d >= maxD*0.55);
      const ends = far.filter(c => c.end);

      take(pool[Math.floor(R()*pool.length)], 'bone');

    // gold nuggets and lost hard hats, spread out, often in dead ends (so it's worth exploring)

    decor = [];

    }
  }

  // ----- things to find -----
  function drawNugget(g, r, ph){
    g.save(); g.lineJoin = 'round';
    g.fillStyle = '#FFC21A'; g.strokeStyle = O; g.lineWidth = r*0.16;
    poly(g, [[-r, 0.2*r], [-0.7*r, -0.5*r], [-0.1*r, -0.85*r], [0.6*r, -0.6*r], [r, 0.05*r], [0.7*r, 0.65*r], [-0.2*r, 0.8*r], [-0.8*r, 0.6*r]]); g.fill(); g.stroke();
    g.fillStyle = '#FFE066'; poly(g, [[-0.6*r, -0.3*r], [-0.1*r, -0.6*r], [0.4*r, -0.4*r], [0.1*r, -0.05*r], [-0.4*r, 0.05*r]]); g.fill();
    g.fillStyle = '#E8A200'; ell(g, 0.35*r, 0.35*r, 0.18*r, 0.12*r); g.fill(); ell(g, -0.45*r, 0.35*r, 0.12*r, 0.09*r); g.fill();
    const tw = reduced ? 0.6 : (Math.sin(clock*4 + (ph || 0)) + 1)/2;

    rr(g, -r, 0.05*r, 2*r, 0.3*r, 0.15*r); g.fill(); g.stroke();

    g.fillStyle = 'rgba(255,255,255,0.6)'; ell(g, -0.38*r, -0.28*r, 0.2*r, 0.1*r, -0.6); g.fill();

  function twinkle(g, x, y, r, col){
    g.fillStyle = col; g.beginPath();
    g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill();

  // little pictures for the score pills and panels
  const iconCache = {};
  function icon(id){
    if(iconCache[id]) return iconCache[id];
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); g.translate(32, 34);
    if(id === 'nug'){ const sv = clock; clock = 1.2; drawNugget(g, 24, 0); clock = sv; }
    else if(id === 'hat') drawHat(g, 26);
    else if(id === 'bone'){ g.rotate(-0.5); drawBone(g, 54); }
    else if(id === 'bone-off'){ g.rotate(-0.5); g.globalAlpha = 0.25; drawBone(g, 54); }
    return (iconCache[id] = c.toDataURL());
  }

  // ===== LAYOUT (works out how big the maze can be on this screen) =====
  let lastSize = '';
  function layout(force){
    const st = getComputedStyle(stage);
    const pw = stage.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
    const ph = stage.clientHeight - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom);
    const key = pw + 'x' + ph + ':' + NX + ':' + (window.devicePixelRatio || 1);
    if(!force && key === lastSize) return;
    lastSize = key;
    // Tipper's parking bay goes beside the maze on wide screens, underneath it on tall ones
    const cR = Math.min(pw/(NX + BAY + PAD*2), ph/(NY + PAD*2));
    const cB = Math.min(pw/(NX + PAD*2), ph/(NY + BAY + PAD*2));
    const bay = cR >= cB*0.97 ? 'right' : 'bottom';
    const cs = Math.max(6, Math.floor((bay === 'right' ? cR : cB)*4)/4);
    const W = Math.round(cs*(NX + PAD*2 + (bay === 'right' ? BAY : 0)));
    const H = Math.round(cs*(NY + PAD*2 + (bay === 'bottom' ? BAY : 0)));
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    L = {cs, ox: cs*PAD, oy: cs*PAD, bay, W, H, dpr};
    board.style.width = W + 'px'; board.style.height = H + 'px';
    cvs.width = Math.round(W*dpr); cvs.height = Math.round(H*dpr);
  }
  if(window.ResizeObserver) new ResizeObserver(() => layout()).observe(stage);
  addEventListener('resize', () => layout());

  // where things are, in maze squares (0,0 = top-left corner of the maze)
  function tipperSpot(){
    return L.bay === 'right' ? {x: NX + BAY/2 + 0.02, y: NY - 0.06, s: 1.42/260} : {x: NX - 1.25, y: NY + BAY - 0.12, s: 1.42/260};
  }
  function lennySpot(){
    return L.bay === 'right' ? {x: NX + BAY/2 + 0.05, y: 1.45, s: 1.15/110} : {x: 0.75, y: NY + BAY - 0.08, s: 1.15/110};
  }

  // ===== SOUND AND MUSIC (all made in the browser, no sound files needed) =====
  let actx = null, master, sfxBus, musicBus, noiseBuf;
  function audio(){
    if(actx) return actx;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination);
      sfxBus = actx.createGain(); sfxBus.gain.value = sfxOn ? 1 : 0; sfxBus.connect(master);
      musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.26 : 0; musicBus.connect(master);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    } catch(e){ actx = null; }
    return actx;
  }
  function wake(){ if(audio() && actx.state === 'suspended') actx.resume(); }
  function tone(f, dur, type = 'sine', vol = 0.18, f2 = null, delay = 0, bus = null){
    if(!audio()) return;
    const t0 = actx.currentTime + Math.max(0, delay);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(bus || sfxBus); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(t0, dur, filterType, freq, q, vol, attack, bus, freq2){
    if(!audio()) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = actx.createBiquadFilter(); fl.type = filterType; fl.frequency.setValueAtTime(freq, t0); fl.Q.value = q;
    if(freq2) fl.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl).connect(g).connect(bus || sfxBus);
    src.start(t0, Math.random()*0.5); src.stop(t0 + dur + 0.05);
  }
  const now = () => actx ? actx.currentTime : 0;
  function hornAt(freqs, d, len, vol){
    if(!audio()) return;
    const t = actx.currentTime + d, g = actx.createGain(), lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1600;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.setValueAtTime(vol, t + len - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    lp.connect(g).connect(sfxBus);
    freqs.forEach(f => { const o = actx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(f*1.04, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05); o.connect(lp); o.start(t); o.stop(t + len + 0.02); });
  }
  const sfx = {
    putt(){ if(!audio()) return; tone(rand(68, 78), 0.09, 'triangle', 0.13, 44); noise(now(), 0.07, 'lowpass', 420, 1, 0.05, 0.005); },
    scoop(){ if(!audio()) return; const t = now();
      noise(t, 0.3, 'bandpass', 600, 1.2, 0.16, 0.02, null, 2200);       // shhhk into the dirt
      tone(180, 0.22, 'triangle', 0.12, 420, 0.02);                        // whoop up
      noise(t + 0.22, 0.22, 'lowpass', 500, 0.8, 0.14, 0.01);             // flump
      [0.26, 0.31, 0.37, 0.44].forEach(d => noise(t + d, 0.05, 'bandpass', rand(1400, 2600), 2, 0.04, 0.004)); },
    bump(){ if(!audio()) return; const t = now(), o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(130, t + 0.16);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g).connect(sfxBus); o.start(t); o.stop(t + 0.22); },

  // background music: the happy, bouncy building-site tune from Chomper's Digger
  const ROOTS = [48, 53, 55, 48, 45, 53, 55, 48];
  const MELODY = [
    72,0,74,76,79,0,76,0,   77,0,76,74,72,0,69,0,
    71,0,74,0,79,77,76,74,  72,0,76,0,72,0,0,0,

  const hz = m => 440*Math.pow(2, (m - 69)/12);
  let mNext = 0, mStep = 0, mTimer = null;
  const stepLen = () => 60/100/2;
  function playStep(i, t){
    const bar = Math.floor(i/8), beat = i % 8, root = ROOTS[bar], d = t - actx.currentTime, S = stepLen();
    if(beat === 0 || beat === 4) tone(hz(root - 12 + (beat === 4 ? 7 : 0)), S*1.6, 'triangle', 0.26, null, d, musicBus);
    if(beat === 2 || beat === 6) [0, root === 45 ? 3 : 4, 7].forEach(n => tone(hz(root + 12 + n), 0.16, 'sine', 0.035, null, d, musicBus));

    if(m){ tone(hz(m), S*1.5, 'triangle', 0.07, null, d, musicBus); tone(hz(m + 12), 0.07, 'sine', 0.025, null, d, musicBus); }

    let c = 0; for(let d = 0; d < 4; d++){ if(d === (from + 2) % 4) continue; const t = wallType(x, y, d); if(t === OPEN || t === DIRT) c++; }

  // ===== HINT: a sparkly path to the nearest thing still to find (or the way out) =====
  function showHint(){
    if(phase !== 'play') return;
    wake(); startMusic();
    const sx = dig.move ? dig.move.tx : dig.x, sy = dig.move ? dig.move.ty : dig.y;
    const prev = Array.from({length: NY}, () => new Array(NX).fill(null));

    }
    const q = [[sx, sy]]; seen[sy][sx] = true; let end = null;
    if(targets.has(sx + ',' + sy) && targets.size > 1) targets.delete(sx + ',' + sy);

      const [x, y] = q.shift();

        if(!isOpen(x, y, d)) continue;

  }

  // ===== THE END OF A LEVEL: tip the treasure into Tipper =====

  // ----- the dinosaur skeleton (each level's bone is one piece) -----
  function boneSeg(g, x1, y1, x2, y2, w){
    // a bone with knobbly ends
    const a = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
    g.save(); g.translate(x1, y1); g.rotate(a);
    const r = w*0.62;
    const path = () => { g.beginPath(); ell(g, 0, -r*0.6, r, r); ell(g, 0, r*0.6, r, r); };
    [[0], [len]].forEach(([x]) => { g.save(); g.translate(x, 0); ell(g, 0, -r*0.6, r, r); g.fill(); g.stroke(); ell(g, 0, r*0.6, r, r); g.fill(); g.stroke(); g.restore(); });
    rr(g, 0, -w/2, len, w, w/2); g.fill(); g.stroke();
    g.save(); g.lineWidth = 0; [[0], [len]].forEach(([x]) => { ell(g, x, -r*0.6, r - 2.5, r - 2.5); g.fill(); ell(g, x, r*0.6, r - 2.5, r - 2.5); g.fill(); }); g.fillRect(0, -w/2 + 2.5, len, w - 5); g.restore();
    g.restore();
  }
  function vert(g, x, y, r){ ell(g, x, y, r, r*0.8); g.fill(); g.stroke(); }
  const SKEL = [
    // 0 tail
    g => { for(let i = 0; i < 9; i++){ const u = i/8; vert(g, lerp(40, 196, u), 170 - Math.sin(u*Math.PI*0.5)*44 - u*6, lerp(7, 15, u)); } },
    // 1 back leg
    g => { boneSeg(g, 222, 130, 206, 196, 15); boneSeg(g, 206, 196, 232, 252, 12); boneSeg(g, 232, 252, 270, 262, 9); boneSeg(g, 232, 258, 252, 270, 7); },
    // 2 little arm
    g => { boneSeg(g, 318, 128, 334, 160, 8); boneSeg(g, 334, 160, 352, 166, 6); },
    // 3 ribs and back
    (g, on) => { const rib = () => [250, 272, 294, 314].forEach((x, i) => { g.beginPath(); g.moveTo(x, 112 - i*3); g.quadraticCurveTo(x - 10, 150, x + 6, 170 - i*6); g.stroke(); });
      g.save(); if(on){ g.lineWidth = 9; rib(); g.lineWidth = 5; g.strokeStyle = '#FFF6E0'; g.setLineDash([]); rib(); } else rib(); g.restore();
      ell(g, 222, 124, 26, 18); g.fill(); g.stroke();
      for(let i = 0; i < 6; i++) vert(g, lerp(218, 330, i/5), 110 - i*5, 13); },
    // 4 neck
    g => { for(let i = 0; i < 4; i++) vert(g, lerp(344, 380, i/3), lerp(84, 54, i/3), 11); },
    // 5 head
    (g, on) => { g.beginPath(); g.moveTo(372, 52); g.quadraticCurveTo(376, 10, 420, 12); g.quadraticCurveTo(470, 14, 476, 40); g.quadraticCurveTo(478, 60, 452, 64); g.lineTo(392, 70); g.quadraticCurveTo(372, 70, 372, 52); g.closePath(); g.fill(); g.stroke();
      if(!on) return;
      g.save(); g.fillStyle = '#5A4A6E'; ell(g, 418, 32, 10, 11); g.fill(); g.fillStyle = '#fff'; ell(g, 421, 28, 3.5, 3.5); g.fill(); ell(g, 456, 30, 3, 2.4); g.fillStyle = '#5A4A6E'; g.fill(); g.restore();
      g.save(); g.lineWidth = 3; g.beginPath(); g.moveTo(398, 56); g.quadraticCurveTo(430, 66, 466, 50); g.stroke();
      g.fillStyle = '#fff'; [406, 420, 434, 448].forEach(x => { poly(g, [[x, 58 + (x - 406)*0.02], [x + 5, 59], [x + 2.5, 66]]); g.fill(); g.stroke(); }); g.restore(); }
  ];
  function drawSkeletonPanel(g, all, finale){

      g.fillStyle = '#FF4F9A'; [[120, 40], [300, 26], [180, 70]].forEach(([x, y], i) => twinkle(g, x, y, 9 - i*2, i % 2 ? '#FFD43B' : '#FF4F9A'));

  // ===== KEYBOARD, TOUCH AND MOUSE =====
  const keyMap = {ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3};
  addEventListener('keydown', e => {
    if(!overlay.hidden){
      // Enter or Space presses the big pink button (unless another button has been picked with Tab)
      if((e.key === 'Enter' || e.key === ' ') && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#panel button'))){
        const b = $('ovBtn'); if(b){ e.preventDefault(); b.click(); }
      }
      return;
    }
    const d = keyMap[e.key];
    if(d != null){
      e.preventDefault();
      if(e.repeat) return;
      if(!held.includes(d)) held.push(d);
      request(d);
    } else if(e.key === 'h' || e.key === 'H') showHint();
  });
  addEventListener('keyup', e => {
    const d = keyMap[e.key];
    if(d != null){ const i = held.indexOf(d); if(i >= 0) held.splice(i, 1); }
  });
  // on-screen arrows: press and hold to keep driving
  const padBtns = [...document.querySelectorAll('.pad button')];
  function paintPad(){ padBtns.forEach(b => b.classList.toggle('on', held.includes(+b.dataset.d))); }
  padBtns.forEach(b => {
    const d = +b.dataset.d;
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch(err){}
      if(!held.includes(d)) held.push(d);
      paintPad(); request(d);
    });
    const up = () => { const i = held.indexOf(d); if(i >= 0) held.splice(i, 1); paintPad(); };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
    b.addEventListener('click', e => e.preventDefault());
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  // swipe on the maze (or tap a spot next to the digger to drive that way)
  let sw = null;
  board.addEventListener('pointerdown', e => {
    if(phase !== 'play') return;
    sw = {x: e.clientX, y: e.clientY, moved: false};
    try { board.setPointerCapture(e.pointerId); } catch(err){}
  });
  board.addEventListener('pointermove', e => {
    if(!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y, th = Math.max(18, L.cs*0.45);
    if(Math.abs(dx) > th || Math.abs(dy) > th){
      request(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
      sw.x = e.clientX; sw.y = e.clientY; sw.moved = true;
    }
  });
  board.addEventListener('pointerup', e => {
    if(!sw) return;
    if(!sw.moved){
      const r = board.getBoundingClientRect();
      const px = (e.clientX - r.left - L.ox)/L.cs - (dig.fx + 0.5), py = (e.clientY - r.top - L.oy)/L.cs - (dig.fy + 0.5);
      if(Math.hypot(px, py) > 0.45) request(Math.abs(px) > Math.abs(py) ? (px > 0 ? 1 : 3) : (py > 0 ? 2 : 0));
    }
    sw = null;
  });
  board.addEventListener('pointercancel', () => { sw = null; });

  // ===== UPDATE =====
  function update(dt){
    clock += dt;
    // blinking
    dig.blinkT -= dt; if(dig.blinkT < 0){ dig.blink = 0.13; dig.blinkT = rand(2, 4.5); }
    if(dig.blink > 0) dig.blink -= dt;
    dig.happyT = Math.max(0, dig.happyT - dt);
    dig.bumpT = Math.max(0, dig.bumpT - dt);
    lenny.sayT = Math.max(0, lenny.sayT - dt); lenny.cheerT = Math.max(0, lenny.cheerT - dt);
    lenny.hop = lenny.cheerT > 0 && !reduced ? Math.abs(Math.sin(clock*9))*10 : 0;
    tip.happyT = Math.max(0, tip.happyT - dt); tip.honkT = Math.max(0, tip.honkT - dt);
    tip.bounce = tip.honkT > 0 && !reduced ? -Math.abs(Math.sin(clock*18))*5 : 0;
    if(hint){ hint.t -= dt; if(hint.t <= 0) hint = null; }
    gateA = lerp(gateA, gateOpen ? 1 : 0, 1 - Math.pow(0.02, dt));
    if(button) button.t += dt;
    puddles.forEach(p => p.splashT = Math.max(0, p.splashT - dt*1.4));

    if(phase === 'play'){
      // driving along
      if(dig.move){
        const m = dig.move;
        m.t += dt*SPEED;
        dig.tread += dt*SPEED*30;
        dig.puttT -= dt; if(dig.puttT <= 0){ sfx.putt(); dig.puttT = 0.12; }
        if(m.t >= 1){
          tracks.push({x1: m.fx, y1: m.fy, x2: m.tx, y2: m.ty, t: clock});
          if(tracks.length > 700) tracks.shift();
          dig.x = m.tx; dig.y = m.ty; dig.fx = m.tx; dig.fy = m.ty;
          const over = (m.t - 1)/SPEED;
          dig.move = null;
          arrive();
          if(dig.move && over > 0) dig.move.t = Math.min(0.9, over*SPEED);
        } else { dig.fx = lerp(m.fx, m.tx, m.t); dig.fy = lerp(m.fy, m.ty, m.t); }
      } else if(dig.scoop){
        // scooping a dirt wall away
        const s = dig.scoop;
        s.t += dt/0.62;
        if(!s.done && s.t >= 0.42){
          s.done = true;
          setWall(dig.x, dig.y, s.d, OPEN); digs++;
          const wx = dig.x + 0.5 + DX[s.d]*0.5, wy = dig.y + 0.5 + DY[s.d]*0.5;
          dirtFly(wx, wy, s.d); sfx.scoop();
          popWord('Scoop!', wx, wy - 0.25, '#8A5A34');
          if(digs === 1 && level === 0) lennySay('Great digging! A shortcut!', 2.6);
        }
        if(s.t >= 1){ dig.scoop = null; startMove(s.d); }
      } else if(heldDir() !== null || queued !== null){
        decide(false);
      }
    } else if(phase === 'end'){
      updateEnd(dt);
      flyers.forEach(f => f.t += dt);
    }

    // particles
    parts = parts.filter(p => p.life > 0);
    parts.forEach(p => {
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.decay*dt;
      if(p.kind === 'dirt' || p.kind === 'drop'){ p.vz -= 9*dt; p.z += p.vz*dt; if(p.z < 0){ p.z = 0; p.vz *= -0.3; p.vx *= 0.6; p.vy *= 0.6; } }
      else if(p.kind === 'conf'){ p.vy += 3.2*dt; p.vx *= 0.99; p.rot += p.spin*dt; }
      else if(p.kind === 'dust'){ p.r += dt*0.12; p.vx *= 0.95; p.vy *= 0.95; }
      else { p.vx *= 0.93; p.vy *= 0.93; }
    });
    words = words.filter(w => (w.t += dt) < 1.3);
  }

  // ===== DRAWING =====
  function render(g, Lo, poster){
    const cs = Lo.cs, dpr = Lo.dpr;
    const toPx = (x, y) => [Lo.ox + x*cs, Lo.oy + y*cs];
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // the ground around the maze
    g.fillStyle = lv.edge; g.fillRect(0, 0, Lo.W, Lo.H);
    // from here on, 1 unit = 1 maze square
    g.setTransform(dpr*cs, 0, 0, dpr*cs, dpr*Lo.ox, dpr*Lo.oy);
    const lw = Math.max(0.03, 1.6/cs);
    // the parking bay: a little road where Tipper waits
    g.fillStyle = '#B9B2A7';
    if(Lo.bay === 'right'){ g.fillRect(NX, -PAD, BAY + PAD, NY + PAD*2); g.fillStyle = '#FFE066'; for(let y = 0.2; y < NY; y += 0.8) g.fillRect(NX + BAY*0.5 - 0.03, y, 0.06, 0.4); }
    else { g.fillRect(-PAD, NY, NX + PAD*2, BAY + PAD); g.fillStyle = '#FFE066'; for(let x = 0.2; x < NX; x += 0.8) g.fillRect(x, NY + BAY*0.5 - 0.03, 0.4, 0.06); }
    // the play mat: soft squares
    g.fillStyle = lv.ground; g.fillRect(0, 0, NX, NY);
    g.fillStyle = lv.ground2; for(let y = 0; y < NY; y++) for(let x = 0; x < NX; x++) if((x + y) % 2) g.fillRect(x, y, 1, 1);
    // pebbles, grass and footprints
    decor.forEach(d => {
      if(d.kind === 'pebble'){ g.fillStyle = 'rgba(150,120,80,0.28)'; ell(g, d.x, d.y, d.r, d.r*0.7, d.rot); g.fill(); }
      else if(d.kind === 'dot'){ g.fillStyle = 'rgba(255,255,255,0.4)'; ell(g, d.x, d.y, d.r*0.5, d.r*0.5); g.fill(); }
      else if(d.kind === 'tuft'){ g.strokeStyle = 'rgba(90,150,60,0.55)'; g.lineWidth = 0.025; for(let i = -1; i <= 1; i++) line(g, d.x, d.y, d.x + i*0.05, d.y - 0.1 + Math.abs(i)*0.03); }
      else if(d.kind === 'foot'){ g.save(); g.translate(d.x, d.y); g.rotate(d.rot); g.fillStyle = 'rgba(140,80,40,0.22)'; ell(g, 0, 0.05, 0.09, 0.07); g.fill(); [-0.6, 0, 0.6].forEach(a => { ell(g, Math.sin(a)*0.13, -Math.cos(a)*0.11, 0.03, 0.06, a); g.fill(); }); g.restore(); }
    });
    // muddy puddles
    puddles.forEach(p => {
      const cx = p.x + 0.5, cy = p.y + 0.5, wob = p.splashT > 0 ? Math.sin(clock*30)*0.03*p.splashT : 0;
      g.fillStyle = '#9C7A50'; ell(g, cx, cy, p.rx + 0.05 + wob, p.ry + 0.04, p.rot); g.fill();
      g.fillStyle = '#6FB8E0'; ell(g, cx, cy, p.rx + wob, p.ry, p.rot); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.55)'; ell(g, cx - p.rx*0.35, cy - p.ry*0.35, p.rx*0.3, p.ry*0.2, p.rot); g.fill();
      if(p.splashT > 0){ g.strokeStyle = 'rgba(255,255,255,' + (p.splashT*0.8) + ')'; g.lineWidth = 0.03; ell(g, cx, cy, p.rx*(1.6 - p.splashT*0.6), p.ry*(1.6 - p.splashT*0.6), p.rot); g.stroke(); }
    });
    // tyre tracks (they fade slowly, so you can see where you've been)
    g.lineCap = 'butt';
    const tr = (x1, y1, x2, y2, a) => {
      const dx = x2 - x1, dy = y2 - y1, nx = -dy*0.2, ny = dx*0.2;
      g.globalAlpha = a; g.strokeStyle = '#7A5634'; g.lineWidth = 0.1; g.setLineDash([0.07, 0.06]);
      [1, -1].forEach(s => line(g, x1 + 0.5 + nx*s, y1 + 0.5 + ny*s, x2 + 0.5 + nx*s, y2 + 0.5 + ny*s));
    };
    tracks.forEach(t => tr(t.x1, t.y1, t.x2, t.y2, 0.42*Math.max(0.3, 1 - (clock - t.t)/45)));
    if(dig.move) tr(dig.move.fx, dig.move.fy, dig.fx, dig.fy, 0.42);
    g.setLineDash([]); g.globalAlpha = 1; g.lineCap = 'round';
    // the big red button
    if(button){
      const cx = button.x + 0.5, cy = button.y + 0.55;
      g.fillStyle = shadowCol; ell(g, cx, cy + 0.12, 0.36, 0.14); g.fill();
      g.fillStyle = '#FFD43B'; g.strokeStyle = O; g.lineWidth = lw; ell(g, cx, cy, 0.36, 0.26); g.fill(); g.stroke();
      g.save(); ell(g, cx, cy, 0.36, 0.26); g.clip(); g.strokeStyle = '#2F2350'; g.lineWidth = 0.07; for(let i = -4; i <= 4; i++) line(g, cx + i*0.13 - 0.3, cy + 0.3, cx + i*0.13 + 0.3, cy - 0.3); g.restore();

      const prev = Array.from({length: NY}, () => new Array(NX).fill(null)), q = [[dig.x, dig.y]], seen = new Set([dig.x + ',' + dig.y]);
      while(q.length){ const [x, y] = q.shift(); if(x === tx && y === ty) break;
        for(let d = 0; d < 4; d++){ const t = wallType(x, y, d); if(!(t === OPEN || (allowDirt && t === DIRT))) continue; const nx = x + DX[d], ny = y + DY[d], k = nx + ',' + ny; if(!seen.has(k)){ seen.add(k); prev[ny][nx] = [x, y, d]; q.push([nx, ny]); } } }
      const out = []; let p = [tx, ty];
      while(prev[p[1]][p[0]]){ const [x, y, d] = prev[p[1]][p[0]]; out.unshift(d); p = [x, y]; }
      return out;
    },
    reachableWithoutDigging(){ const D = distances(0, 0, false); return D.every(r => r.every(v => v >= 0)); },
    dirtWalls(){ let c = 0; wR.forEach(r => r.forEach(v => v === DIRT && c++)); wD.forEach(r => r.forEach(v => v === DIRT && c++)); return c; },
    press(d){ request(d); },
    hold(d){ if(!held.includes(d)) held.push(d); request(d); }, release(){ held.length = 0; },
    hint(){ showHint(); return hint && hint.path; },
    teleport(x, y){ dig.x = dig.fx = x; dig.y = dig.fy = y; dig.move = null; dig.scoop = null; },
    unlockAll(){ TEST_ALL = true; prog.unlocked = 6; saveProg(); },
    reset(){ prog = freshProg(); saveProg(); },
    speed(k){ timeScale = k; },
    menu(){ showMenu(); }, bones(mode){ showBones(mode || 'menu'); }, setBones(a){ prog.bones = a.slice(); saveProg(); },
    // pictures for the game card and share preview
    poster(w, h, opts){ return makePoster(w, h, opts || {}); }
  };

  function makePoster(w, h, opts){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const save = {L, NX, NY, wR, wD, items, puddles, decor, button, tracks, parts, words, dig: Object.assign({}, dig), phase, lv, level, flyers, hint, tip: Object.assign({}, tip), lenny: Object.assign({}, lenny)};
    level = 0; lv = LEVELS[opts.level || 1];
    NX = opts.nx || 7; NY = opts.ny || 5;
    // a hand-made little maze for the picture
    wR = Array.from({length: NY}, () => new Array(NX).fill(OPEN)); wD = Array.from({length: NY}, () => new Array(NX).fill(OPEN));
    (opts.walls || []).forEach(([kind, x, y, t]) => { (kind === 'r' ? wR : wD)[y][x] = t; });
    items = (opts.items || []).map(([k, x, y]) => ({kind: k, x, y, got: false, ph: x + y}));
    puddles = (opts.puddles || []).map(([x, y]) => ({x, y, rx: 0.32, ry: 0.24, rot: 0.2, splashT: 0}));
    button = null; tracks = (opts.tracks || []).map(([x1, y1, x2, y2]) => ({x1, y1, x2, y2, t: clock}));
    const R = rng(7); decor = []; for(let i = 0; i < NX*NY; i++){ const k = R(); decor.push({x: R()*NX, y: R()*NY, kind: k < 0.55 ? 'pebble' : k < 0.8 ? 'dot' : 'tuft', r: 0.04 + R()*0.05, rot: R()*TAU}); }
    const cs = opts.cs;
    L = {cs, ox: opts.ox, oy: opts.oy, bay: opts.bay || 'right', W: w, H: h, dpr: 1};
    Object.assign(dig, {x: opts.dig[0], y: opts.dig[1], fx: opts.dig[0], fy: opts.dig[1], face: opts.face || 1, tilt: 0, move: null, scoop: null, bumpT: 0, happyT: 0, blink: 0, dir: 1});
    phase = 'play'; flyers = []; hint = null;
    Object.assign(tip, {dx: 0, heap: 0.35, happyT: 1, honkT: 0, bounce: 0});
    Object.assign(lenny, {cheerT: 1, hop: 0, sayT: 0});
    // dirt flying from the scoop
    parts = []; const R2 = rng(3);
    (opts.dirt || []).forEach(([x, y, d]) => { for(let i = 0; i < 20; i++){ const a = Math.atan2(DY[d], DX[d]) + (R2() - 0.5)*2.4, sp = 0.2 + R2()*0.9; parts.push({kind: 'dirt', x: x + Math.cos(a)*sp*0.5, y: y + Math.sin(a)*sp*0.5, vx: 0, vy: 0, z: 0.2 + R2()*1.6, vz: 0, r: 0.05 + R2()*0.07, col: ['#8A5A34', '#A56B3B', '#6E4426', '#C58A52'][i % 4], life: 0.7, decay: 0}); } });
    (opts.sparkles || []).forEach(([x, y]) => { for(let i = 0; i < 8; i++){ const a = i/8*TAU; parts.push({kind: 'spark', x: x + Math.cos(a)*0.35, y: y + Math.sin(a)*0.35, vx: 0, vy: 0, z: 0, vz: 0, r: 0.05 + (i % 2)*0.03, col: i % 2 ? '#FFD43B' : '#FF9ACB', life: 0.7, decay: 0}); } });
    words = (opts.words || []).map(([text, x, y, col]) => ({text, x, y, t: 0.2, col}));
    posterSpr = opts.spr || 0;
    render(g, L, {digger: opts.digger || null});
    posterSpr = 0;
    const url = c.toDataURL('image/png');
    ({L, NX, NY, wR, wD, items, puddles, decor, button, tracks, parts, words, phase, lv, level, flyers, hint} = save);
    Object.assign(dig, save.dig); Object.assign(tip, save.tip); Object.assign(lenny, save.lenny);
    return url;
  }
})();
</script>
